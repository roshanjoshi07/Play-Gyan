<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gyan Surf — Train Chase</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07111d;
  touch-action:none;

}

canvas{

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="left">
    <div class="pill">🏆 <span id="score">0</span></div>
    <div class="pill">🪙 <span id="coins">0</span></div>
    <div class="pill">🔑 <span id="keys">0</span></div>
  </div>

  <div class="pill">
    ⚡ <span id="speed">1.0x</span>
  </div>
</div>

<div id="hint">
Swipe ← → lane • ↑ jump • ↓ slide
</div>

<div id="menu">
  <div class="card">

    <div class="logo">🚆</div>

    <h1>GYAN SURF</h1>

    <div class="desc">
      Run through the railway city, avoid incoming trains,
      collect coins and keys, and escape the police.
    </div>

    <div>
      <button class="char active"
              data-color="#38bdf8"
              data-name="Aarav">
        🧢 Aarav
      </button>

      <button class="char"
              data-color="#f59e0b"
              data-name="Milan">
        🧥 Milan
      </button>

      <button class="char"
              data-color="#f472b6"
              data-name="Riya">
        🎒 Riya
      </button>
    </div>

    <button id="start">
      START RUN
    </button>

    <div id="result"></div>

  </div>
</div>

<script>
/* =========================================================
   GYAN SURF — TRAIN CHASE
   Original HTML/CSS/JS endless runner
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,DPR;
let running=false;
let last=0;

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;
  H=innerHeight;

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();


/* ================= GAME STATE ================= */

let score=0;
let coins=0;
let keys=0;

let speed=7;

let lane=1;
let targetLane=1;

let jump=0;
let slide=0;

let police=0;

let objects=[];
let particles=[];

let spawnTimer=0;
let coinTimer=0;


/* ================= PLAYER ================= */

let player={
  name:"Aarav",
  color:"#38bdf8"
};

document.querySelectorAll(".char").forEach(btn=>{
  btn.onclick=()=>{

    document.querySelectorAll(".char")
      .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    player={
      name:btn.dataset.name,
      color:btn.dataset.color
    };
  };
});


/* ================= SOUND ENGINE ================= */

let audio=null;

function startAudio(){

  if(!audio){
    audio=new (window.AudioContext ||
               window.webkitAudioContext)();
  }

  if(audio.state==="suspended"){
    audio.resume();
  }
}

function sound(
  frequency=440,
  duration=.12,
  type="sine",
  volume=.05
){

  if(!audio)return;

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.type=type;
  osc.frequency.value=frequency;

  gain.gain.setValueAtTime(
    volume,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(audio.currentTime+duration);
}

function coinSound(){
  sound(700,.07,"sine",.07);
  setTimeout(
    ()=>sound(1000,.09,"sine",.05),
    55
  );
}

function jumpSound(){
  sound(350,.12,"triangle",.06);
}

function trainSound(){
  sound(90,.30,"sawtooth",.035);
}

function crashSound(){
  sound(70,.45,"sawtooth",.10);
  setTimeout(
    ()=>sound(45,.4,"square",.06),
    100
  );
}


/* ================= ROAD ================= */

function roadY(){
  return H*.78;
}

function laneX(i){

  const gap=Math.min(
    W*.235,
    155
  );

  return W/2+
    [-1,0,1][i]*gap;
}


/* ================= OBJECTS ================= */

function addTrain(){

  /*
    Train आउने दिशाबाट
    screen को माथिबाट तलतिर आउँछ.
  */

  objects.push({
    type:"train",
    lane:Math.floor(Math.random()*3),
    y:-160,
    speedMultiplier:
      .90+Math.random()*.30,
    dead:false
  });

  trainSound();
}

function addCoin(){

  objects.push({
    type:"coin",
    lane:Math.floor(Math.random()*3),
    y:-40,
    dead:false
  });

}

function addKey(){

  objects.push({
    type:"key",
    lane:Math.floor(Math.random()*3),
    y:-40,
    dead:false
  });

}


/* ================= PLAYER BOX ================= */

function playerBox(){

  const h=slide?43:80;

  let jumpHeight=0;

  if(jump){

    jumpHeight=
      Math.sin(
        Math.min(jump/650,1)*Math.PI
      )*125;

  }

  return{
    x:laneX(Math.round(lane))-22,

    y:
      roadY()-
      h-
      jumpHeight,

    width:44,
    height:h
  };
}


/* ================= COLLISION ================= */

function hit(a,b){

  return(
    a.x<b.x+b.width &&
    a.x+a.width>b.x &&
    a.y<b.y+b.height &&
    a.y+a.height>b.y
  );
}


/* ================= START ================= */

document.getElementById("start")
.onclick=()=>{

  startAudio();

  score=0;
  coins=0;
  keys=0;

  speed=7;

  lane=1;
  targetLane=1;

  jump=0;
  slide=0;

  police=0;

  objects=[];
  particles=[];

  spawnTimer=0;
  coinTimer=0;

  document.getElementById("result")
    .innerHTML="";

  document.getElementById("menu")
    .classList.add("hidden");

  running=true;

  last=performance.now();

  requestAnimationFrame(loop);
};


/* ================= LOOP ================= */

function loop(time){

  if(!running)return;

  const dt=Math.min(
    32,
    time-last
  );

  last=time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}


/* ================= UPDATE ================= */

function update(dt){

  score +=
    speed*dt*.045;

  speed=Math.min(
    17,
    speed+dt*.00028
  );


  lane +=
    (targetLane-lane)*
    Math.min(1,dt*.02);


  /* JUMP */

  if(jump){

    jump+=dt;

    if(jump>=650){
      jump=0;
    }
  }


  /* SLIDE */

  if(slide){

    slide-=dt;

    if(slide<0)
      slide=0;
  }


  /* TRAIN SPAWN */

  spawnTimer-=dt;

  if(spawnTimer<=0){

    addTrain();

    spawnTimer=Math.max(
      430,
      900-speed*30
    );
  }


  /* COINS / KEYS */

  coinTimer-=dt;

  if(coinTimer<=0){

    if(Math.random()<.13)
      addKey();
    else
      addCoin();

    coinTimer=
      230+
      Math.random()*400;
  }


  /* OBJECT MOVEMENT */

  objects.forEach(o=>{

    if(o.type==="train"){

      o.y +=
        speed*
        o.speedMultiplier*
        dt*
        .085;

    }else{

      o.y +=
        speed*
        dt*
        .072;

    }

  });


  const p=playerBox();


  /* COLLISION */

  for(const o of objects){

    if(o.dead)
      continue;


    let box;


    if(o.type==="train"){

      box={
        x:
          laneX(o.lane)-42,

        y:
          o.y-85,

        width:84,

        height:170
      };

    }

    else if(o.type==="coin"){

      box={
        x:
          laneX(o.lane)-17,

        y:o.y-17,

        width:34,

        height:34
      };

    }

    else{

      box={
        x:
          laneX(o.lane)-17,

        y:o.y-20,

        width:34,

        height:40
      };

    }


    if(hit(p,box)){

      if(o.type==="coin"){

        coins++;
        o.dead=true;

        coinSound();

        burst(
          laneX(o.lane),
          o.y,
          "#facc15"
        );

      }

      else if(o.type==="key"){

        keys++;
        o.dead=true;

        sound(
          900,
          .12,
          "triangle",
          .07
        );

        burst(
          laneX(o.lane),
          o.y,
          "#fde047"
        );

      }

      else{

        crashSound();

        gameOver(
          "🚆 TRAIN COLLISION!"
        );

        return;
      }

    }

  }


  objects=objects.filter(
    o =>
      !o.dead &&
      o.y<H+220
  );


  /* POLICE */

  police=Math.max(
    0,
    police-dt*.02
  );


  /* PARTICLES */

  particles.forEach(p=>{

    p.x+=p.vx*dt/16;
    p.y+=p.vy*dt/16;

    p.life-=dt;

  });

  particles=particles.filter(
    p=>p.life>0
  );


  updateUI();
}


/* ================= POLICE ================= */

function gameOver(reason){

  running=false;

  document.getElementById("menu")
    .classList.remove("hidden");

  document.getElementById("result")
    .innerHTML=
    reason+
    "<br><br>"+
    "🏆 Score: "+Math.floor(score)+
    "<br>"+
    "🪙 Coins: "+coins+
    "<br>"+
    "🔑 Keys: "+keys;
}


/* ================= PARTICLES ================= */

function burst(x,y,color){

  for(let i=0;i<16;i++){

    particles.push({

      x:x,
      y:y,

      vx:(Math.random()-.5)*6,
      vy:(Math.random()-.5)*6,

      life:500,

      color:color
    });

  }

}


/* ================= UI ================= */

function updateUI(){

  document.getElementById("score")
    .textContent=Math.floor(score);

  document.getElementById("coins")
    .textContent=coins;

  document.getElementById("keys")
    .textContent=keys;

  document.getElementById("speed")
    .textContent=
    (speed/7).toFixed(1)+"x";
}


/* ================= DRAW ================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /* SKY */

  const sky=
    ctx.createLinearGradient(
      0,0,0,H
    );

  sky.addColorStop(
    0,
    "#06152e"
  );

  sky.addColorStop(
    .45,
    "#16759b"
  );

  sky.addColorStop(
    .75,
    "#76d7dc"
  );

  sky.addColorStop(
    1,
    "#182633"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,0,W,H
  );


  /* SUN */

  ctx.fillStyle=
    "rgba(255,235,150,.32)";

  ctx.beginPath();

  ctx.arc(
    W*.78,
    H*.18,
    65,
    0,
    Math.PI*2
  );

  ctx.fill();


  drawBuildings();
  drawRoad();


  /* OBJECTS */

  objects.forEach(
    drawObject
  );


  /* POLICE */

  if(police>0){

    drawPolice(
      laneX(
        Math.round(lane)
      ),
      roadY()+90
    );

  }


  /* PLAYER */

  drawPlayer(
    playerBox()
  );


  /* PARTICLES */

  particles.forEach(p=>{

    ctx.globalAlpha=
      p.life/500;

    ctx.fillStyle=p.color;

    ctx.fillRect(
      p.x,
      p.y,
      5,
      5
    );

  });

  ctx.globalAlpha=1;
}


/* ================= BUILDINGS ================= */

function drawBuildings(){

  for(let layer=0;layer<3;layer++){

    for(let i=-2;i<16;i++){

      const width=
        70+layer*12;

      const x=
        i*width-
        (
          score*
          (.35+layer*.12)
        )%width;

      const height=
        80+
        (i*31+layer*50)%130;

      const base=
        roadY()-
        25-
        layer*35;

      ctx.fillStyle=[
        "#16334b",
        "#1d425a",
        "#2b5369"
      ][layer];

      ctx.fillRect(
        x,
        base-height,
        width-6,
        height
      );


      ctx.fillStyle=
        "rgba(255,225,120,.32)";

      for(
        let y=base-height+18;
        y<base-10;
        y+=25
      ){

        ctx.fillRect(
          x+10,
          y,
          9,
          8
        );

      }

    }

  }
}


/* ================= ROAD ================= */

function drawRoad(){

  const y=roadY();


  ctx.fillStyle="#202a35";

  ctx.beginPath();

  ctx.moveTo(
    W*.18,
    y
  );

  ctx.lineTo(
    W*.82,
    y
  );

  ctx.lineTo(
    W*1.06,
    H
  );

  ctx.lineTo(
    -W*.06,
    H
  );

  ctx.closePath();

  ctx.fill();


  /* TRACK LINES */

  ctx.strokeStyle=
    "rgba(225,240,255,.32)";

  ctx.lineWidth=3;

  for(let i=0;i<3;i++){

    ctx.beginPath();

    ctx.moveTo(
      laneX(i),
      y
    );

    ctx.lineTo(
      W/2+
      [-1,0,1][i]*
      W*.48,
      H
    );

    ctx.stroke();

  }


  /* SLEEPERS */

  for(
    let i=0;
    i<14;
    i++
  ){

    const p=i/14;

    const yy=
      y+
      (H-y)*p*p;

    const width=
      70+
      p*W*.8;

    ctx.strokeStyle=
      "rgba(190,210,225,.28)";

    ctx.beginPath();

    ctx.moveTo(
      W/2-width,
      yy
    );

    ctx.lineTo(
      W/2+width,
      yy
    );

    ctx.stroke();

  }

}


/* ================= OBJECT DRAW ================= */

function drawObject(o){

  const x=laneX(o.lane);
  const y=o.y;


  /* TRAIN */

  if(o.type==="train"){

    ctx.save();

    ctx.shadowBlur=20;
    ctx.shadowColor=
      "rgba(0,0,0,.45)";


    /* BODY */

    ctx.fillStyle="#111827";

    ctx.fillRect(
      x-42,
      y-85,
      84,
      170
    );


    /* TOP */

    ctx.fillStyle="#e11d48";

    ctx.fillRect(
      x-42,
      y-85,
      84,
      20
    );


    /* WINDOWS */

    ctx.fillStyle="#38bdf8";

    ctx.fillRect(
      x-30,
      y-55,
      60,
      42
    );


    ctx.fillStyle="#082f49";

    ctx.fillRect(
      x-23,
      y-49,
      19,
      28
    );

    ctx.fillRect(
      x+4,
      y-49,
      19,
      28
    );


    /* HEADLIGHTS */

    ctx.shadowBlur=18;
    ctx.shadowColor="#fef08a";

    ctx.fillStyle="#fef08a";

    ctx.beginPath();

    ctx.arc(
      x-25,
      y+48,
      8,
      0,
      Math.PI*2
    );

    ctx.arc(
      x+25,
      y+48,
      8,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    /* FRONT */

    ctx.fillStyle="#334155";

    ctx.fillRect(
      x-30,
      y+20,
      60,
      10
    );


    /* WHEELS */

    ctx.fillStyle="#020617";

    ctx.fillRect(
      x-38,
      y+65,
      20,
      15
    );

    ctx.fillRect(
      x+18,
      y+65,
      20,
      15
    );


    ctx.restore();

    return;
  }


  /* COIN */

  if(o.type==="coin"){

    ctx.shadowBlur=18;
    ctx.shadowColor="#facc15";

    ctx.fillStyle="#facc15";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      14,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle="#fff7b2";

    ctx.font="bold 12px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "G",
      x,
      y+4
    );

    return;
  }


  /* KEY */

  if(o.type==="key"){

    ctx.strokeStyle="#fde047";

    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.arc(
      x-7,
      y,
      9,
      0,
      Math.PI*2
    );

    ctx.moveTo(
      x+1,
      y
    );

    ctx.lineTo(
      x+20,
      y
    );

    ctx.moveTo(
      x+12,
      y
    );

    ctx.lineTo(
      x+12,
      y+8
    );

    ctx.stroke();

  }

}


/* ================= PLAYER ================= */

function drawPlayer(b){

  const x=b.x+22;
  const y=b.y;

  const a=
    Math.sin(
      performance.now()*.014
    )*5;


  /* SHADOW */

  ctx.globalAlpha=.25;

  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    x,
    roadY()+5,
    34,
    9,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;


  /* BACKPACK */

  ctx.fillStyle="#7c3aed";

  ctx.fillRect(
    x-28,
    y+28,
    12,
    34
  );


  /* BODY */

  ctx.fillStyle=
    player.color;

  ctx.fillRect(
    x-19,
    y+25,
    38,
    b.height-36
  );


  /* ARMS */

  ctx.strokeStyle="#f2c7a5";

  ctx.lineWidth=7;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    x-17,
    y+34
  );

  ctx.lineTo(
    x-31,
    y+52+a
  );

  ctx.moveTo(
    x+17,
    y+34
  );

  ctx.lineTo(
    x+31,
    y+52-a
  );

  ctx.stroke();


  /* LEGS */

  ctx.strokeStyle="#e5e7eb";

  ctx.lineWidth=9;

  ctx.beginPath();

  ctx.moveTo(
    x-7,
    y+b.height-15
  );

  ctx.lineTo(
    x-17,
    y+b.height+10+a
  );

  ctx.moveTo(
    x+7,
    y+b.height-15
  );

  ctx.lineTo(
    x+17,
    y+b.height+10-a
  );

  ctx.stroke();


  /* HEAD */

  ctx.fillStyle="#f2c7a5";

  ctx.beginPath();

  ctx.arc(
    x,
    y+11,
    16,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* HAIR */

  ctx.fillStyle="#24160f";

  ctx.beginPath();

  ctx.arc(
    x,
    y+6,
    16,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  /* CAP */

  ctx.fillStyle=
    player.color;

  ctx.fillRect(
    x-17,
    y-1,
    34,
    7
  );

  ctx.fillRect(
    x-21,
    y+4,
    13,
    4
  );

}


/* ================= POLICE ================= */

function drawPolice(x,y){

  ctx.save();

  ctx.translate(x,y);


  ctx.fillStyle="#172554";

  ctx.fillRect(
    -22,
    -60,
    44,
    55
  );


  ctx.fillStyle="#f2c7a5";

  ctx.beginPath();

  ctx.arc(
    0,
    -72,
    15,
    0,

/* ================= TOUCH CONTROLS ================= */

let sx=0;
let sy=0;

canvas.addEventListener(
  "touchstart",
  e=>{

    const t=e.changedTouches[0];

    sx=t.clientX;
    sy=t.clientY;

  },
  {passive:false}
);


canvas.addEventListener(
  "touchend",
  e=>{

    e.preventDefault();

    const t=e.changedTouches[0];

    const dx=
      t.clientX-sx;

    const dy=
      t.clientY-sy;


    if(
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      )<30
    )
      return;


    if(
      Math.abs(dx)>
      Math.abs(dy)
    ){

      if(dx>0){

        targetLane=
          Math.min(
            2,
            targetLane+1
          );

      }else{

        targetLane=
          Math.max(
            0,
            targetLane-1
          );

      }

    }else{

      if(
        dy<0 &&
        !jump &&
        !slide
      ){

        jump=1;
        jumpSound();

      }

      else if(
        dy>0 &&
        !jump
      ){

        slide=500;

        sound(
          230,
          .09,
          "triangle",
          .04
        );

      }

    }

  },
  {passive:false}
);


/* ================= KEYBOARD ================= */

addEventListener(
  "keydown",
  e=>{

    if(!running)return;


    if(
      e.key==="ArrowLeft" ||
      e.key==="a"
    ){

      targetLane=
        Math.max(
          0,
          targetLane-1
        );

    }


    if(
      e.key==="ArrowRight" ||
      e.key==="d"
    ){

      targetLane=
        Math.min(
          2,
          targetLane+1
        );

    }


    if(
      (
        e.key==="ArrowUp" ||
        e.key==="w" ||
        e.key===" "
      ) &&
      !jump &&
      !slide
    ){

      jump=1;
      jumpSound();

    }


    if(
      (
        e.key==="ArrowDown" ||
        e.key==="s"
      ) &&
      !jump
    ){

      slide=500;

    }

  }
);

</script>
