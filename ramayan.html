<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>रामायण — सम्पूर्ण कथा</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Noto Serif Devanagari", Georgia, serif;
    background:#20150d;
    color:#33200f;
}

/* HEADER */
header{
    min-height:300px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:30px 20px;
    color:#fff4d5;

    background:
    radial-gradient(circle at center,
    #c88628,
    #633511 45%,
    #1b0d06 100%);
}

.om{
    font-size:70px;
    margin-bottom:10px;
}

header h1{
    font-size:clamp(40px,8vw,70px);
    text-shadow:0 5px 20px #000;
}

header p{
    margin-top:12px;
    font-size:18px;
}

/* BOOK */
.book-area{
    width:min(1000px,94%);
    margin:30px auto 80px;
}

/* CHAPTER MENU */
.chapter-menu{
    background:#3c2410;
    padding:18px;
    border-radius:18px;
    box-shadow:0 10px 30px #0008;
    margin-bottom:25px;
}

.chapter-menu h2{
    color:#ffd98b;
    text-align:center;
    margin-bottom:15px;
}

.chapter-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
}

.chapter-buttons button{
    border:0;
    padding:10px 15px;
    border-radius:25px;
    cursor:pointer;
    background:#d49a45;
    color:#251406;
    font-weight:bold;
}

.chapter-buttons button.active{
    background:#ffe1a1;
}

/* PAPER */
.paper{
    background:#fff8e8;
    min-height:700px;
    padding:clamp(30px,7vw,75px);
    position:relative;

    box-shadow:0 20px 70px #000b;
}

.paper:before{
    content:"";
    position:absolute;
    inset:15px;
    border:2px solid #d5ad69;
    pointer-events:none;
}

.chapter-label{
    text-align:center;
    color:#a46618;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:15px;
}

h2{
    color:#703b0b;
    text-align:center;
    font-size:clamp(28px,6vw,46px);
    margin-bottom:12px;
}

.subtitle{
    text-align:center;
    color:#927453;
    margin-bottom:40px;
    font-style:italic;
}

.story{
    font-size:19px;
    line-height:2.1;
    text-align:justify;
}

.story p{
    margin-bottom:23px;
    text-indent:40px;
}

.quote{
    text-indent:0 !important;
    text-align:center;
    margin:35px 0;
    padding:22px;
    border-top:1px solid #cfa76b;
    border-bottom:1px solid #cfa76b;
    color:#8b581b;
    font-size:21px;
    font-style:italic;
}

/* NAVIGATION */
.navigation{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-top:25px;
}

.navigation button{
    flex:1;
    border:0;
    padding:16px;
    border-radius:35px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    background:#bd7b25;
    color:white;
    box-shadow:0 8px 20px #0005;
}

.navigation button:hover{
    background:#e0a64c;
}

.navigation button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.home-btn{
    width:100%;
    margin-top:12px;
    padding:13px;
    border:1px solid #b78340;
    background:#3b2410;
    color:#ffe1a3;
    border-radius:30px;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:600px){

    .story{
        font-size:17px;
        line-height:2;
    }

    .story p{
        text-indent:25px;
    }

    .paper{
        padding:30px 23px;
    }

    .navigation button{
        font-size:14px;
    }
}
</style>
</head>

<body>

<header>
    <div class="om">ॐ</div>
    <h1>रामायण</h1>
    <p>श्रीरामको जीवन र धर्मयात्राको सम्पूर्ण कथा</p>
</header>

<main class="book-area">

<div class="chapter-menu">
    <h2>Chapters</h2>
    <div class="chapter-buttons" id="chapterButtons"></div>
</div>

<article class="paper">

    <div class="chapter-label" id="chapterLabel"></div>

    <h2 id="chapterTitle"></h2>

    <div class="subtitle">
        रामायणको कथा — सरल नेपाली पुनर्कथन
    </div>

    <div class="story" id="story"></div>

</article>

<div class="navigation">
    <button id="backBtn" onclick="previousChapter()">
        ← Back
    </button>

    <button id="nextBtn" onclick="nextChapter()">
        Next →
    </button>
</div>

<button class="home-btn" onclick="goHome()">
    🏠 Home
</button>

</main>


<script>

/*
=========================================================
रामायण — सम्पूर्ण कथा
परम्परागत रामायण कथामा आधारित सरल नेपाली पुनर्कथन।
=========================================================
*/

const chapters = [

/* 1 */
{
title:"अयोध्या र राजा दशरथ",

story:`

<p>
सरयू नदीको किनारमा अयोध्या नामको प्रसिद्ध र समृद्ध
राज्य थियो। त्यहाँ इक्ष्वाकु वंशका राजा दशरथले शासन
गर्थे। अयोध्या ठूलो, सुन्दर र व्यवस्थित नगर थियो।
त्यहाँका मानिसहरू सुखी थिए र राजाप्रति सम्मान राख्थे।
</p>

<p>
राजा दशरथ वीर र पराक्रमी थिए। उनले धेरै युद्धहरूमा
भाग लिएका थिए र आफ्ना प्रजाको रक्षा गर्न सधैँ तयार
रहन्थे। उनका तीन रानी थिए—कौशल्या, कैकेयी र सुमित्रा।
</p>

<p>
तर राजाको मनमा एउटा ठूलो दुःख थियो। धेरै वर्ष बितिसक्दा
पनि उनको सन्तान थिएन। आफू पछि अयोध्याको राज्य कसले
सम्हाल्ने भन्ने चिन्ताले उनलाई सताइरहन्थ्यो।
</p>

<p>
अन्ततः ऋषिहरूको सल्लाहअनुसार राजा दशरथले पुत्रेष्टि
यज्ञ गरे। यज्ञको फलस्वरूप उनलाई दिव्य प्रसाद प्राप्त भयो।
त्यो प्रसाद आफ्ना रानीहरूलाई बाँडे।
</p>

<p class="quote">
समय बित्दै जाँदा अयोध्याको राजपरिवारमा चार महान्
राजकुमारहरूको जन्म भयो।
</p>
`
},

/* 2 */
{
title:"श्रीराम, भरत, लक्ष्मण र शत्रुघ्नको जन्म",

story:`

<p>
कौशल्याबाट श्रीरामको जन्म भयो। कैकेयीबाट भरत जन्मिए
र सुमित्राबाट लक्ष्मण तथा शत्रुघ्न जन्मिए।
</p>

<p>
चारै राजकुमार बाल्यकालदेखि नै गुणवान् थिए। राम
शान्त, सत्यवादी, दयालु र कर्तव्यनिष्ठ थिए। भरत
नम्र र धर्मप्रेमी थिए। लक्ष्मण रामप्रति अत्यन्त
समर्पित थिए भने शत्रुघ्न भरतसँग विशेष नजिक थिए।
</p>

<p>
चारै भाइबीच गहिरो प्रेम थियो। उनीहरू सँगै खेल्थे,
शिक्षा लिन्थे र राजकुलका नियमहरू सिक्थे।
</p>

<p>
राजकुमारहरूले गुरुहरूबाट वेद, शास्त्र, राजनीति,
धनुर्विद्या र युद्धकलाको शिक्षा लिए।
</p>

<p>
रामको स्वभाव सबैभन्दा विशेष थियो। उनी कहिल्यै
अहंकार गर्दैनथे र आफूभन्दा सानालाई पनि सम्मान गर्थे।
</p>
`
},

/* 3 */
{
title:"विश्वामित्रको आगमन",

story:`

<p>
एक दिन महर्षि विश्वामित्र अयोध्या आए। उनले राजा
दशरथसँग एउटा महत्वपूर्ण सहायता मागे।
</p>

<p>
ऋषिहरूले वनमा यज्ञ गर्दा राक्षसहरूले बारम्बार
यज्ञ नष्ट गर्ने गरेका थिए। त्यसैले विश्वामित्रले
रामलाई आफूसँग वनमा पठाउन आग्रह गरे।
</p>

<p>
राजा दशरथ रामलाई राक्षसहरूसँग लड्न पठाउन डराए।
तर गुरु वशिष्ठले विश्वामित्रको अनुरोध स्वीकार गर्नु
धर्म र राजकुमारको कर्तव्य भएको बताए।
</p>

<p>
रामसँग लक्ष्मण पनि गए। विश्वामित्रले उनीहरूलाई
धेरै दिव्य अस्त्रहरूको ज्ञान दिए।
</p>

<p>
राम र लक्ष्मणले ऋषिको यज्ञको रक्षा गरे र वनमा
आतंक फैलाउने ताडका लगायतका राक्षसी शक्तिहरूलाई
पराजित गरे।
</p>
`
},

/* 4 */
{
title:"मिथिलाको यात्रा र सीता",

story:`

<p>
विश्वामित्र राम र लक्ष्मणलाई लिएर मिथिलातर्फ गए।
मिथिलाका राजा जनक अत्यन्त ज्ञानी र धर्मात्मा राजा थिए।
</p>

<p>
राजा जनककी पुत्री सीता अत्यन्त गुणवान् र तेजस्वी थिइन्।
सीताको स्वयंवरको तयारी भइरहेको थियो।
</p>

<p>
राजा जनकसँग भगवान् शिवसँग सम्बन्धित एउटा महान् धनुष
थियो। जसले त्यो धनुष उठाएर प्रत्यञ्चा चढाउन सक्थ्यो,
उसैले सीतासँग विवाह गर्ने शर्त राखिएको थियो।
</p>

<p>
धेरै शक्तिशाली राजाहरू आए तर कसैले पनि धनुषलाई
सजिलै उठाउन सकेनन्।
</p>

<p>
विश्वामित्रको आज्ञामा राम धनुष नजिक गए। उनले धनुष
उठाएर प्रत्यञ्चा चढाउन खोज्दा धनुष भाँचियो।
</p>

<p>
यसरी राम र सीताको विवाह निश्चित भयो।
</p>
`
},

/* 5 */
{
title:"राम र सीताको विवाह",

story:`

<p>
रामले सीतासँग विवाह गरे। त्यसै अवसरमा दशरथका अन्य
पुत्रहरूको पनि विवाह सम्पन्न भयो।
</p>

<p>
लक्ष्मणले उर्मिलासँग, भरतले माण्डवीसँग र शत्रुघ्नले
श्रुतकीर्तिसँग विवाह गरे।
</p>

<p>
अयोध्या र मिथिलामा विवाहको ठूलो उत्सव भयो। सबैले
राजपरिवारको सुखको कामना गरे।
</p>

<p>
राम र सीताको सम्बन्ध केवल पति-पत्नीको मात्र थिएन।
उनीहरू एकअर्काका सहयात्री र दुःख-सुखका साथी थिए।
</p>

<p>
विवाहपछि राम अयोध्या फर्किए। केही समयसम्म अयोध्यामा
शान्ति र समृद्धि कायम रह्यो।
</p>
`
},

/* 6 */
{
title:"रामलाई युवराज बनाउने निर्णय",

story:`

<p>
समय बित्दै जाँदा राजा दशरथ वृद्ध भए। उनले अयोध्याको
राज्य रामलाई सुम्पने निर्णय गरे।
</p>

<p>
अयोध्याका नागरिकहरू यो निर्णयबाट अत्यन्त खुसी भए।
रामको न्यायप्रिय स्वभावका कारण सबै उनलाई भविष्यको
राजाका रूपमा हेर्न चाहन्थे।
</p>

<p>
तर दरबारभित्र एउटा घटना घट्यो जसले सम्पूर्ण
अयोध्याको भविष्य परिवर्तन गरिदियो।
</p>

<p>
कैकेयीकी दासी मन्थराले कैकेयीलाई राम राजा बनेपछि
भरतको भविष्य कमजोर हुने कुरा सम्झाएर उत्तेजित गरिन्।
</p>

<p>
कैकेयीले राजा दशरथसँग पहिले प्राप्त गरेका दुई वरदान
मागिन्। पहिलो—भरतलाई राजा बनाउने। दोस्रो—रामलाई
चौध वर्ष वनवास पठाउने।
</p>
`
},

/* 7 */
{
title:"रामको वनवास",

story:`

<p>
राजा दशरथले कैकेयीको माग सुनेर गहिरो दुःख पाए।
उनी रामलाई वनवास पठाउन चाहँदैनथे।
</p>

<p>
तर उनले पहिले दिएको वचन तोड्न सकेनन्।
जब रामले कुरा थाहा पाए, उनले कुनै विरोध गरेनन्।
</p>

<p>
रामले भने कि पिताको वचन पूरा गर्नु आफ्नो कर्तव्य हो।
</p>

<p>
सीताले पनि रामलाई एक्लै वन जान नदिने निर्णय गरिन्।
उनले पति जहाँ जान्छन् आफू पनि त्यहीँ जाने बताइन्।
</p>

<p>
लक्ष्मणले पनि दाजु रामको साथ नछोड्ने प्रतिज्ञा गरे।
यसरी राम, सीता र लक्ष्मण अयोध्याबाट वनतर्फ लागे।
</p>

<p class="quote">
रामले राज्यभन्दा धर्म र पिताको वचनलाई ठूलो माने।
</p>
`
},

/* 8 */
{
title:"दशरथको मृत्यु र भरतको त्याग",

story:`

<p>
राम वन गएपछि राजा दशरथ अत्यन्त दुःखी भए। रामसँग
बिछोडको पीडाले उनको स्वास्थ्य बिग्रियो।
</p>

<p>
केही समयपछि राजा दशरथको मृत्यु भयो।
</p>

<p>
त्यतिबेला भरत अयोध्यामा थिएनन्। फर्किएपछि उनले
रामलाई वन पठाइएको कुरा थाहा पाए।
</p>

<p>
भरतले आफ्नी आमाको निर्णय स्वीकार गरेनन्। उनले
रामलाई नै अयोध्याको वास्तविक राजा माने।
</p>

<p>
भरत वनमा गएर रामलाई फर्कन आग्रह गरे। तर रामले
पिताको वचन पूरा नभएसम्म अयोध्या फर्कन नसक्ने बताए।
</p>

<p>
भरतले रामका पादुका लिएर अयोध्या फर्किए र त्यसलाई
राजसिंहासनमा राखेर आफू रामको प्रतिनिधिका रूपमा
राज्य सञ्चालन गर्न थाले।
</p>
`
},

/* 9 */
{
title:"वनको जीवन",

story:`

<p>
राम, सीता र लक्ष्मण विभिन्न वनहरू हुँदै अगाडि बढे।
उनीहरूले धेरै ऋषिहरूलाई भेटे र उनीहरूको आश्रममा
केही समय बिताए।
</p>

<p>
वनको जीवन कठिन थियो। उनीहरूले राजमहलको सुविधा
छोडेर साधारण जीवन बिताए।
</p>

<p>
रामले वनमा बस्ने ऋषिहरू र साधुहरूको रक्षा गर्ने
प्रतिज्ञा गरे।
</p>

<p>
यस क्रममा उनीहरूको भेट धेरै ऋषि र वनवासीहरूसँग भयो।
उनीहरूले धर्म, कर्तव्य र जीवनका बारेमा धेरै कुरा
सुने।

/* =====================================================
   VARIABLES
===================================================== */

let current = 0;

const title =
document.getElementById("chapterTitle");

const label =
document.getElementById("chapterLabel");

const story =
document.getElementById("story");

const backBtn =
document.getElementById("backBtn");

const nextBtn =
document.getElementById("nextBtn");

const chapterButtons =
document.getElementById("chapterButtons");


/* =====================================================
   CREATE CHAPTER BUTTONS
===================================================== */

chapters.forEach((chapter,index)=>{

    const button =
    document.createElement("button");

    button.textContent = index + 1;

    button.onclick = () => {
        loadChapter(index);
    };

    chapterButtons.appendChild(button);

});


/* =====================================================
   LOAD CHAPTER
===================================================== */

function loadChapter(index){

    current = index;

    const chapter =
    chapters[current];

    label.textContent =
    "CHAPTER " + (current + 1);

    title.textContent =
    chapter.title;

    story.innerHTML =
    chapter.story;

    document
    .querySelectorAll(".chapter-buttons button")
    .forEach((btn,i)=>{

        btn.classList.toggle(
            "active",
            i === current
        );

    });

    backBtn.disabled =
    current === 0;

    nextBtn.disabled =
    current === chapters.length - 1;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================================
   NEXT
===================================================== */

function nextChapter(){

    if(current < chapters.length - 1){
        loadChapter(current + 1);
    }

}


/* =====================================================
   BACK
===================================================== */

function previousChapter(){

    if(current > 0){
        loadChapter(current - 1);
    }

}


/* =====================================================
   HOME
===================================================== */

function goHome(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   START
===================================================== */

loadChapter(0);

</script>
