<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>श्री रामायण — नेपाली डिजिटल पुस्तक</title>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#e8d6b5;
    color:#302116;
    font-family:"Noto Serif Devanagari","Nirmala UI",
                Georgia,serif;
}

/* HEADER */

header{
    background:
    linear-gradient(135deg,#421605,#8d4615,#4a1906);
    color:#fff;
    text-align:center;
    padding:30px 15px;
    box-shadow:0 5px 25px #0006;
}

header h1{
    font-size:clamp(35px,8vw,65px);
    margin:0;
}

header h2{
    margin:8px 0;
    font-size:clamp(20px,4vw,30px);
}

header p{
    opacity:.9;
}

/* CONTROLS */

.controls{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
}

button{
    border:0;
    padding:11px 16px;
    border-radius:9px;
    background:#d59a42;
    color:#2c1505;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:translateY(-2px);
}

/* MAIN */

.container{
    width:min(1200px,94%);
    margin:25px auto;
    display:grid;
    grid-template-columns:270px 1fr;
    gap:25px;
}

/* SIDEBAR */

.sidebar{
    background:#fff7e5;
    border:2px solid #ae7736;
    border-radius:15px;
    padding:18px;
    height:max-content;
    position:sticky;
    top:15px;
}

.sidebar h3{
    text-align:center;
    color:#70350c;
}

.kanda{
    width:100%;
    display:block;
    text-align:left;
    margin:7px 0;
    background:#ead8b8;
}

.kanda.active{
    background:#75370e;
    color:#fff;
}

/* BOOK */

.book{
    background:#fffaf0;
    border:2px solid #ae7736;
    border-radius:15px;
    padding:clamp(22px,5vw,65px);
    box-shadow:0 10px 35px #0003;
}

.book-title{
    text-align:center;
    color:#71350d;
    font-size:clamp(30px,6vw,48px);
}

.subtitle{
    text-align:center;
    color:#875d2c;
    margin-bottom:35px;
}

.chapter-title{
    text-align:center;
    color:#71350d;
    border-bottom:2px solid #c49a62;
    padding-bottom:15px;
    margin-bottom:30px;
}

.chapter{
    font-size:20px;
    line-height:2.05;
}

.chapter p{
    margin-bottom:22px;
    text-align:justify;
}

.chapter h3{
    color:#7b3b10;
    text-align:center;
    margin-top:40px;
}

.chapter .quote{
    text-align:center;
    font-weight:bold;
    color:#73370e;
    margin:25px 5%;
}

/* NAVIGATION */

.navigation{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:50px;
}

.navigation button{
    flex:1;
}

/* DARK */

body.dark{
    background:#111;
    color:#e8d9c0;
}

body.dark .sidebar,
body.dark .book{
    background:#211a14;
    border-color:#735331;
}

body.dark .kanda{
    background:#33271c;
    color:#ead9be;
}

body.dark .kanda.active{
    background:#9b5b20;
    color:white;
}

body.dark .book-title,
body.dark .chapter-title,
body.dark .chapter h3{
    color:#e2a65b;
}

body.dark .subtitle{
    color:#c8a978;
}

/* MOBILE */

@media(max-width:800px){

    .container{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:relative;
        top:0;
    }

    .chapter{
        font-size:18px;
        line-height:1.9;
    }

    .chapter p{
        text-align:left;
    }

    .navigation{
        flex-direction:column;
    }

}
</style>
</head>

<script>

const chapters = [

{
title:"बालकाण्ड — रामको जन्म र बाल्यकाल",

story:`

<p>
अयोध्या नगरीमा दशरथ नाम गरेका महान् राजा
राज्य गर्थे। उनी न्यायप्रिय, वीर र प्रजालाई
आफ्ना सन्तानसरह माया गर्ने राजा थिए। तर
उनको मनमा एउटा ठूलो दुःख थियो—उनका
सन्तान थिएनन्।
</p>

<p>
राजा दशरथले सन्तान प्राप्तिको कामनाले
विशेष यज्ञ गरे। यज्ञको फलस्वरूप उनकी
तीन रानी—कौशल्या, कैकेयी र सुमित्राबाट
चार पुत्र जन्मिए।
</p>

<p>
कौशल्याबाट राम, कैकेयीबाट भरत तथा
सुमित्राबाट लक्ष्मण र शत्रुघ्न जन्मिए।
चारै राजकुमार गुणी, पराक्रमी र विनम्र
थिए। राम सबैका प्रिय थिए।
</p>

<p>
राम र लक्ष्मणले बाल्यकालदेखि नै शस्त्रविद्या,
धर्म, नीति र राजकाजको शिक्षा पाए।
</p>

<h3>विश्वामित्रको आगमन</h3>

<p>
एक दिन महान् ऋषि विश्वामित्र अयोध्या आए।
उनले राजा दशरथसँग आफ्नो यज्ञमा बाधा
पुर्‍याउने राक्षसहरूबाट रक्षा गर्न रामलाई
आफूसँग पठाइदिन आग्रह गरे।
</p>

<p>
दशरथलाई सुरुमा चिन्ता लाग्यो, तर ऋषिको
आदेश स्वीकार गरे। रामसँग लक्ष्मण पनि गए।
ऋषिको मार्गदर्शनमा उनीहरूले धेरै कठिनाइ
पार गरे र राक्षसी शक्तिहरूलाई पराजित गरे।
</p>

<h3>सीतासँग भेट</h3>

<p>
विश्वामित्र राम र लक्ष्मणलाई मिथिला
राज्यमा लिएर गए। त्यहाँ राजा जनकले
सीताको स्वयंवर आयोजना गरेका थिए।
</p>

<p>
राजा जनकसँग भगवान् शिवको अत्यन्त
भारी धनुष थियो। त्यस धनुषलाई उठाएर
प्रत्यञ्चा चढाउन सक्ने वीरसँग सीताको
विवाह गर्ने शर्त राखिएको थियो।
</p>

<p>
धेरै राजा र वीरहरूले प्रयास गरे तर
धनुष चलाउन सकेनन्। रामले धनुष उठाए
र प्रत्यञ्चा चढाउने क्रममा धनुष नै
भाँचियो।
</p>

<p>
त्यसपछि राम र सीताको विवाह भयो।
लक्ष्मण, भरत र शत्रुघ्नको पनि विवाह
राजपरिवारका कन्याहरूसँग भयो।
</p>

<p class="quote">
“सत्य, धर्म र कर्तव्यको बाटो नै
महान् जीवनको आधार हो।”
</p>
`
},

{
title:"अयोध्याकाण्ड — वनवासको सुरुवात",

story:`

<p>
विवाहपछि राम अयोध्या फर्किए। समय बित्दै
गयो। राजा दशरथ वृद्ध हुँदै गए र उनले
रामलाई अयोध्याको युवराज बनाउने निर्णय गरे।
सम्पूर्ण अयोध्या खुसी भयो।
</p>

<p>
तर कैकेयीकी दासी मन्थराले कैकेयीको मनमा
ईर्ष्या उत्पन्न गरिन्। कैकेयीले दशरथसँग
पहिले पाएको दुई वरदान मागिन्।
</p>

<p>
पहिलो वरदानमा भरतलाई राजा बनाउनुपर्ने
र दोस्रो वरदानमा रामलाई चौध वर्ष वनवास
पठाउनुपर्ने माग गरिन्।
</p>

<p>
राजा दशरथ अत्यन्त दुःखी भए। तर रामले
बुवाको वचनलाई सर्वोच्च धर्म माने।
उनले कुनै विरोध नगरी वन जान स्वीकार गरे।
</p>

<p>
सीताले पनि आफू श्रीमान्सँगै वन जाने
बताइन्। लक्ष्मणले पनि रामलाई एक्लै
जान नदिने निर्णय गरे।
</p>

<p>
यसरी राम, सीता र लक्ष्मण अयोध्याबाट
वनतर्फ लागे। अयोध्यावासीहरू उनीहरूलाई
छोड्न तयार थिएनन्।
</p>

<h3>दशरथको मृत्यु</h3>

<p>
राम वन गएको दुःख राजा दशरथले सहन
सकेनन्। उनले आफ्नो जीवनको अन्तिम
क्षणमा रामलाई सम्झिँदै प्राण त्यागे।
</p>

<p>
भरत त्यस समयमा अयोध्यामा थिएनन्।
फर्किएपछि उनले सबै कुरा थाहा पाए।
भरतले राज्य स्वीकार गर्न अस्वीकार गरे
र रामलाई फर्काउन वनतर्फ गए।
</p>

<p>
रामले भने बुवाको वचन पूरा नभएसम्म
अयोध्या फर्कन नसक्ने बताए। भरतले
रामको पादुका लिएर अयोध्या फर्किए र
रामको प्रतिनिधिका रूपमा राज्य सञ्चालन
गर्ने निर्णय गरे।
</p>
`
},

{
title:"अरण्यकाण्ड — वनको जीवन र सीताको हरण",

story:`

<p>
राम, सीता र लक्ष्मणले वनमा विभिन्न
ऋषिहरूलाई भेट्दै आफ्नो वनवास बिताउन
थाले। उनीहरूले वनमा रहेका आश्रमहरूमा
समय बिताए र ऋषिहरूको रक्षा गरे।
</p>

<p>
वनमा एक दिन राक्षसी शूर्पणखाको
रामप्रति आकर्षण भयो। रामले उनको
प्रस्ताव अस्वीकार गरे। त्यसपछि घटना
क्रममा शूर्पणखाको अपमान भयो र उनले
आफ्ना भाइहरूलाई रामविरुद्ध उक्साइन्।
</p>

<p>
रामले राक्षसहरूसँग युद्ध गरेर उनीहरूलाई
पराजित गरे। यो समाचार लङ्काका राजा
रावणसम्म पुग्यो।
</p>

<h3>सीताको हरण</h3>

<p>
रावणले सीतालाई हरण गर्ने योजना बनायो।
मारीचलाई सुनौलो मृगको रूप धारण गर्न
लगाइयो।
</p>

<p>
सीताले त्यो सुन्दर मृग देखेर रामलाई
त्यसलाई ल्याइदिन आग्रह गरिन्। राम
मृगको पछि लागे। पछि लक्ष्मण पनि
रामको खोजीमा गए।
</p>

<p>
त्यस अवसरमा रावण साधुको रूप लिएर
आयो र सीतालाई छल गरेर लङ्का
लिएर गयो।
</p>

<p>
जटायु नाम गरेका वृद्ध पक्षीले सीताको
रक्षा गर्ने प्रयास गरे। उनले रावणसँग
वीरतापूर्वक युद्ध गरे तर गम्भीर
रूपमा घाइते भए।
</p>

<p>
राम र लक्ष्मण फर्किएपछि सीता
नभएको थाहा पाए। उनीहरूले सीताको
खोजी सुरु गरे।
</p>
`
},

{
title:"किष्किन्धाकाण्ड — हनुमानसँग भेट",

story:`

<p>
सीताको खोजी गर्दै राम र लक्ष्मण
किष्किन्धा क्षेत्रमा पुगे। त्यहाँ
उनीहरूको भेट हनुमानसँग भयो।
</p>

<p>
हनुमान सुग्रीवका विश्वासपात्र थिए।
हनुमानले राम र सुग्रीवबीच मित्रता
गराए।
</p>

<p>
सुग्रीवले आफ्नो दाजु वालीसँगको
समस्या रामलाई बताए। रामले सुग्रीवलाई
सहयोग गरे। त्यसपछि सुग्रीवले सीताको
खोजीमा आफ्ना वानर सेनालाई पठाए।
</p>

<p>
वानरहरूले विभिन्न दिशामा खोजी गरे।
अन्ततः सीता लङ्कामा रहेको जानकारी
प्राप्त भयो।
</p>

<h3>समुद्रको किनारमा</h3>

<p>
सीता लङ्कामा रहेको थाहा पाएपछि
सबैको ध्यान समुद्र पार गर्ने उपायमा
गयो।
</p>

<p>
हनुमानले आफ्नो असाधारण शक्ति सम्झिए।
उनले लङ्का पुगेर सीताको खोजी गर्ने
जिम्मेवारी लिए।
</p>
`
},

{
title:"सुन्दरकाण्ड — हनुमानको लङ्का यात्रा",

story:`

<p>
हनुमान विशाल रूप धारण गरेर समुद्र
पार गरे। लामो यात्रापछि उनी लङ्का
पुगे।
</p>

<p>
हनुमानले लङ्कामा गोप्य रूपमा प्रवेश
गरे र धेरै ठाउँ खोजे। अन्ततः उनले
अशोक वाटिकामा सीतालाई भेटे।
</p>

<p>
हनुमानले रामको सन्देश सुनाए र रामले
दिएको चिनारी सीतालाई देखाए।
सीताको मनमा आशा जाग्यो।
</p>

<p>
हनुमानले सीतालाई राम चाँडै उनलाई
उद्धार गर्न आउने विश्वास दिलाए।
</p>

<p>
त्यसपछि हनुमानले लङ्कामा आफ्नो
शक्ति देखाए। रावणका सैनिकहरूसँग
युद्ध भयो।
</p>

<p>
हनुमानको पुच्छरमा आगो लगाइयो।
हनुमानले त्यही आगोबाट लङ्काका
धेरै स्थानमा आगो लगाए र सुरक्षित
रूपमा समुद्र पार गरेर फर्किए।
</p>

<p>
हनुमानले रामलाई सीताको अवस्था
बताए। अब लङ्कामाथि अभियानको
तयारी सुरु भयो।
</p>
`
},

{
title:"युद्धकाण्ड — लङ्काको महान् युद्ध",

story:`

<p>
रामको नेतृत्वमा वानर सेना समुद्र
किनारमा पुग्यो। समुद्रमाथि पुल
निर्माण गरी सेना लङ्कातर्फ अघि
बढ्यो।
</p>

/* ==========================================
   VARIABLES
========================================== */

let current=0;
let textSize=20;


/* ==========================================
   MENU
========================================== */

function createMenu(){

const menu=document.getElementById("menu");

menu.innerHTML="";

chapters.forEach((chapter,index)=>{

const btn=document.createElement("button");

btn.className="kanda";

btn.textContent=
(index+1)+". "+chapter.title;

btn.onclick=()=>{
openChapter(index);
};

menu.appendChild(btn);

});

}


/* ==========================================
   OPEN CHAPTER
========================================== */

function openChapter(index){

current=index;

const chapter=chapters[index];

document.getElementById(
"title"
).textContent=chapter.title;

document.getElementById(
"story"
).innerHTML=chapter.story;

document
.querySelectorAll(".kanda")
.forEach((button,i)=>{

button.classList.toggle(
"active",
i===current
);

});

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* ==========================================
   NEXT
========================================== */

function nextChapter(){

if(current<chapters.length-1){

openChapter(current+1);

}else{

alert(
"🎉 तपाईंले रामायणको सम्पूर्ण कथात्मक संस्करण पढिसक्नुभयो!"
);

}

}


/* ==========================================
   PREVIOUS
========================================== */

function previousChapter(){

if(current>0){

openChapter(current-1);

}

}


/* ==========================================
   DARK MODE
========================================== */

function darkMode(){

document.body
.classList.toggle("dark");

}


/* ==========================================
   FONT SIZE
========================================== */

function fontChange(value){

textSize+=value;

if(textSize<15)
textSize=15;

if(textSize>32)
textSize=32;

document.getElementById(
"story"
).style.fontSize=
textSize+"px";

}


/* ==========================================
   START
========================================== */

createMenu();

openChapter(0);

</script>
