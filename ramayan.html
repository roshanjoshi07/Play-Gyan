<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>रामायण — Animated Book</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Noto Serif Devanagari", Georgia, serif;
    background:#20150d;
    color:#33200f;
}

/* ================= HEADER ================= */

header{
    min-height:290px;
    display:flex;

    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:30px 20px;
    color:#fff4d5;

    radial-gradient(circle at center,
    #c88628,
    #603411 48%,
    #190b05 100%);
}

.om{
    font-size:70px;
    margin-bottom:5px;
}

header h1{
    font-size:clamp(40px,8vw,70px);
    text-shadow:0 5px 20px #000;
}

header p{
    margin-top:10px;
}

/* ================= BOOK ================= */

.book-area{
    width:min(1000px,94%);
    margin:30px auto 70px;
}

.chapter-menu{
    background:#3c2410;
    padding:18px;
    border-radius:18px;
    box-shadow:0 10px 30px #0008;
    margin-bottom:25px;
}

.chapter-menu h2{
    color:#ffd98b;
    text-align:center;
    margin-bottom:15px;
}

.chapter-buttons{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    justify-content:center;
}

.chapter-buttons button{
    border:0;
    padding:10px 15px;
    border-radius:25px;
    cursor:pointer;
    background:#d49a45;
    color:#251406;
    font-weight:bold;
}

.chapter-buttons button.active{
    background:#ffe1a1;
}

/* ================= PAPER ================= */

.paper{
    background:#fff8e8;
    min-height:700px;
    padding:clamp(25px,6vw,70px);
    position:relative;
    box-shadow:0 20px 70px #000b;
}

.paper:before{
    content:"";
    position:absolute;
    inset:15px;
    border:2px solid #d5ad69;
    pointer-events:none;
}

.chapter-label{
    text-align:center;
    color:#a46618;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:15px;
}

.paper h2{
    color:#703b0b;
    text-align:center;
    font-size:clamp(28px,6vw,46px);
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#927453;
    margin-bottom:30px;
    font-style:italic;
}

/* ================= ANIMATION ================= */

.animation-box{
    position:relative;
    width:100%;
    max-width:900px;
    margin:0 auto 35px;
    background:#111;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 15px 40px #0008;
}

canvas{
    display:block;
    width:100%;
    height:auto;
}

.animation-title{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 18px;
    border-radius:20px;
    background:#0009;
    color:white;
    font-family:Arial,sans-serif;
    font-size:14px;
}

/* ================= STORY ================= */

.story{
    font-size:19px;
    line-height:2.1;
    text-align:justify;
}

.story p{
    margin-bottom:23px;
    text-indent:40px;
}

.quote{
    text-indent:0 !important;
    text-align:center;
    margin:30px 0;
    padding:20px;
    border-top:1px solid #cfa76b;
    border-bottom:1px solid #cfa76b;
    color:#8b581b;
    font-size:21px;
    font-style:italic;
}

/* ================= NAVIGATION ================= */

.navigation{
    display:flex;
    gap:15px;
    margin-top:25px;
}

.navigation button{
    flex:1;

.navigation button:disabled{
    opacity:.35;

}

.home-btn{

    color:#ffe1a3;
    border-radius:30px;

}

/* ================= MOBILE ================= */

@media(max-width:600px){

        line-height:2;
    }

        text-indent:25px;
    }

    .paper{
        padding:25px 20px;
    }

    .navigation button{
        font-size:14px;
    }
}
</style>
</head>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById("sceneCanvas");

const ctx =
canvas.getContext("2d");


let current=0;
let animationStart=performance.now();


/* =====================================================
   BOOK ELEMENTS
===================================================== */

const title =
document.getElementById("chapterTitle");

const label =
document.getElementById("chapterLabel");

const story =
document.getElementById("story");

const buttons =
document.getElementById("chapterButtons");

const backBtn =
document.getElementById("backBtn");

const nextBtn =
document.getElementById("nextBtn");


/* =====================================================
   CHAPTER BUTTONS
===================================================== */

chapters.forEach((chapter,index)=>{

    const button =
    document.createElement("button");

    button.textContent =
    index+1;

    button.onclick=()=>{
        loadChapter(index);
    };

    buttons.appendChild(button);

});


/* =====================================================
   LOAD CHAPTER
===================================================== */

function loadChapter(index){

    current=index;

    label.textContent =
    "CHAPTER "+(index+1);

    title.textContent =
    chapters[index].title;

    story.innerHTML =
    chapters[index].story;

    document
    .querySelectorAll(".chapter-buttons button")
    .forEach((button,i)=>{

        button.classList.toggle(
            "active",
            i===current
        );

    });

    backBtn.disabled =
    current===0;

    nextBtn.disabled =
    current===chapters.length-1;

    animationStart =
    performance.now();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================================
   DRAW SKY
===================================================== */

function drawSky(){

    const gradient =
    ctx.createLinearGradient(
        0,0,
        0,canvas.height
    );

    gradient.addColorStop(
        0,
        "#172b58"
    );

    gradient.addColorStop(
        1,
        "#e58b43"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );

}


/* =====================================================
   DRAW SUN
===================================================== */

function drawSun(){

    ctx.beginPath();

    ctx.arc(
        720,
        110,
        55,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#ffd447";

    ctx.fill();

}


/* =====================================================
   DRAW GROUND
===================================================== */

function drawGround(){

    ctx.fillStyle="#31552d";

    ctx.fillRect(
        0,
        360,
        canvas.width,
        140
    );

}


/* =====================================================
   DRAW TREE
===================================================== */

function drawTree(x,y){

    ctx.fillStyle="#51351d";

    ctx.fillRect(
        x-15,
        y,
        30,
        130
    );

    ctx.fillStyle="#235c2d";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        70,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   DRAW RAM
===================================================== */

function drawRam(x,y){

    // body
    ctx.fillStyle="#e6c49b";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        45,
        65,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    // head
    ctx.beginPath();

    ctx.arc(
        x,
        y-65,
        38,
        0,
        Math.PI*2
    );

    ctx.fill();

    // hair
    ctx.fillStyle="#21170f";

    ctx.beginPath();

    ctx.arc(
        x,
        y-80,
        35,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    // eyes
    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
        x-13,
        y-65,
        4,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+13,
        y-65,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

    // bow
    ctx.strokeStyle="#6e401c";
    ctx.lineWidth=6;

    ctx.beginPath();

    ctx.arc(
        x+55,
        y,
        65,
        -Math.PI/2,
        Math.PI/2
    );

    ctx.stroke();

}


/* =====================================================
   DRAW SITA
===================================================== */

function drawSita(x,y){

    ctx.fillStyle="#b33b62";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        45,
        70,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#e7bd91";

    ctx.beginPath();

    ctx.arc(
        x,
        y-75,
        35,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#21140d";

    ctx.beginPath();

    ctx.arc(
        x,
        y-90,
        38,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   DRAW RAVAN
===================================================== */

function drawRavan(x,y){

    ctx.fillStyle="#541c1c";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        60,
        90,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
      Symbolic multi-head animation.
      This is an original graphic representation.
    */

    for(let i=0;i<5;i++){

        ctx.fillStyle="#7b2929";

        ctx.beginPath();

        ctx.arc(
            x+(i-2)*38,
            y-100,
            28,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.fillStyle="#ffd1a3";

    ctx.beginPath();

    ctx.arc(
        x,
        y-100,
        23,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   DRAW ARROW
===================================================== */

function drawArrow(x,y){

    ctx.strokeStyle="#f2d58b";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(x,y);
    ctx.lineTo(x+110,y);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(x+110,y);
    ctx.lineTo(x+90,y-10);

    ctx.moveTo(x+110,y);
    ctx.lineTo(x+90,y+10);

    ctx.stroke();

}


/* =====================================================
   ANIMATION LOOP
===================================================== */

function animate(time){

    const t =
    (time-animationStart)/1000;

    drawSky();
    drawSun();
    drawGround();

    drawTree(100,280);
    drawTree(820,270);

    /* ==========================================
       SCENE BASED ON CHAPTER
    ========================================== */

    if(current===0){

        drawRam(270,330);

        drawSita(430,330);

        drawRam(
            270 + Math.sin(t)*10,
            330
        );

    }

    else if(current===1){

        drawRam(260,330);
        drawSita(450,330);

        drawTree(700,270);

    }

    else if(current===2){

        /*
          Sita Harlan Demo
        */

        drawSita(350,330);

        drawRavan(700,300);

        const arrowX =
        350 + Math.sin(t)*120;

        drawArrow(
            arrowX,
            250
        );

    }

    else if(current===3){

        drawRam(250,330);

        drawSita(450,330);

        // symbolic Hanuman
        ctx.fillStyle="#8a4f28";

        ctx.beginPath();

        ctx.arc(
            680,
            300,
            45,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#8a4f28";
        ctx.lineWidth=15;

        ctx.beginPath();

        ctx.moveTo(680,340);
        ctx.lineTo(680,400);

        ctx.stroke();

    }

    else if(current===4){

        /*
          Hanuman flying
        */

        const hx =
        150 + ((t*100)%650);

        const hy =
        250 + Math.sin(t*3)*45;

        ctx.save();

        ctx.translate(hx,hy);

        ctx.rotate(
            Math.sin(t*2)*.1
        );

        ctx.fillStyle="#8a4f28";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            38,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#8a4f28";
        ctx.lineWidth=14;

        ctx.beginPath();

        ctx.moveTo(0,30);
        ctx.lineTo(0,90);

        ctx.stroke();

        // tail
        ctx.beginPath();

        ctx.arc(
            0,
            80,
            50,
            Math.PI,
            Math.PI*1.7
        );

        ctx.stroke();

        ctx.restore();

    }

    else if(current===5){

        drawRavan(650,300);

        ctx.fillStyle="#ff7b16";

        for(let i=0;i<7;i++){

            const fx =
            120+i*100;

            const fy =
            360-Math.abs(
                Math.sin(t*5+i)*45
            );

            ctx.beginPath();

            ctx.arc(
                fx,
                fy,
                22,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }

    else if(current===6){

        drawRam(250,330);
        drawRavan(650,300);

        drawArrow(
            300+Math.sin(t)*120,
            240
        );

    }

    else{

        drawRam(330,330);
        drawSita(500,330);

    }


    requestAnimationFrame(animate);

}


/* =====================================================
   NEXT / BACK
===================================================== */

function nextChapter(){

    if(current < chapters.length-1){

        loadChapter(
            current+1
        );

    }

}


function previousChapter(){

    if(current > 0){

        loadChapter(
            current-1
        );

    }

}


/* =====================================================
   HOME
===================================================== */

function goHome(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   START
===================================================== */

loadChapter(0);

requestAnimationFrame(
    animate
);

</script>
