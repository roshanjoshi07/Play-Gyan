<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>रामायण — Animated Story Book</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Noto Serif Devanagari",Georgia,serif;
    background:#1c1008;
    color:#35200f;
}

/* HEADER */

header{
    min-height:280px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#fff1c9;
    padding:30px 15px;

    background:
    radial-gradient(circle at 50% 35%,
    #e2a33e 0%,
    #8b4c18 42%,
    #210e05 100%);
}

.om{
    font-size:65px;
}

header h1{
    font-size:clamp(42px,8vw,72px);
    text-shadow:0 5px 15px #000;
}

header p{
    margin-top:8px;
    font-size:18px;
}

/* MAIN */

.book-area{
    width:min(1050px,94%);
    margin:30px auto 70px;
}

/* CHAPTER MENU */

.chapter-menu{
    background:#3a220e;
    padding:18px;
    border-radius:18px;
    box-shadow:0 10px 35px #0009;
    margin-bottom:25px;
}

.chapter-menu h2{
    color:#ffd98c;
    text-align:center;
    margin-bottom:15px;
}

.chapter-buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:9px;
}

.chapter-buttons button{
    border:0;
    padding:10px 16px;
    border-radius:25px;
    cursor:pointer;
    background:#ce913e;
    color:#251406;
    font-weight:bold;
}

.chapter-buttons button.active{
    background:#ffe5ad;
}

/* PAPER */

.paper{
    background:#fff8e8;
    padding:clamp(25px,6vw,70px);
    position:relative;
    box-shadow:0 25px 80px #000c;
}

.paper:before{
    content:"";
    position:absolute;
    inset:15px;
    border:2px solid #d4a765;
    pointer-events:none;
}

.chapter-label{
    text-align:center;
    color:#a26518;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:12px;
}

.paper h2{
    text-align:center;
    color:#713d0b;
    font-size:clamp(28px,6vw,46px);
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#957553;
    margin-bottom:28px;
}

/* ANIMATION */

.animation-box{
    position:relative;
    width:100%;
    max-width:950px;
    margin:auto;
    overflow:hidden;
    border-radius:20px;
    background:#111;
    box-shadow:0 15px 45px #0009;
}

canvas{
    display:block;
    width:100%;
    height:auto;
}

.scene-name{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    background:#0009;
    color:white;
    padding:8px 18px;
    border-radius:30px;
    font-family:Arial,sans-serif;
    font-size:14px;
}

/* STORY */

.story{
    margin-top:35px;
    font-size:19px;
    line-height:2.05;
    text-align:justify;
}

.story p{
    margin-bottom:22px;
    text-indent:40px;
}

.quote{
    text-indent:0!important;
    text-align:center;
    color:#8c591a;
    border-top:1px solid #cda76b;
    border-bottom:1px solid #cda76b;
    padding:20px;
    margin:30px 0;
    font-style:italic;
}

/* BUTTONS */

.navigation{
    display:flex;
    gap:15px;
    margin-top:25px;
}

.navigation button,
.home-btn{
    border:0;
    cursor:pointer;
    font-weight:bold;
    border-radius:35px;
    background:#bd7924;
    color:white;
    padding:15px;
    box-shadow:0 8px 20px #0005;
}

.navigation button{
    flex:1;
}

.navigation button:hover,
.home-btn:hover{
    background:#df9b3e;
}

.navigation button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.home-btn{
    width:100%;
    margin-top:12px;
    background:#3b2410;
    color:#ffe0a0;
}

/* MOBILE */

@media(max-width:600px){

    .paper{
        padding:25px 19px;
    }

    .story{
        font-size:17px;
    }

    .story p{
        text-indent:25px;
    }
}
</style>
</head>

/* =====================================================
   BASIC VARIABLES
===================================================== */

let current=0;
let animationStart=performance.now();

const canvas=
document.getElementById("canvas");

const ctx=
canvas.getContext("2d");

const title=
document.getElementById("chapterTitle");

const label=
document.getElementById("chapterLabel");

const story=
document.getElementById("story");

const chapterButtons=
document.getElementById("chapterButtons");

const backBtn=
document.getElementById("backBtn");

const nextBtn=
document.getElementById("nextBtn");


/* =====================================================
   CREATE CHAPTER BUTTONS
===================================================== */

chapters.forEach((chapter,index)=>{

const btn=
document.createElement("button");

btn.textContent=index+1;

btn.onclick=()=>{
loadChapter(index);
};

chapterButtons.appendChild(btn);

});


/* =====================================================
   LOAD CHAPTER
===================================================== */

function loadChapter(index){

current=index;

title.textContent=
chapters[index].title;

label.textContent=
"CHAPTER "+(index+1);

story.innerHTML=
chapters[index].story;

document
.querySelectorAll(".chapter-buttons button")
.forEach((btn,i)=>{

btn.classList.toggle(
"active",
i===current
);

});

backBtn.disabled=
current===0;

nextBtn.disabled=
current===chapters.length-1;

animationStart=
performance.now();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =====================================================
   BACKGROUND
===================================================== */

function background(){

/* sky */

const sky=
ctx.createLinearGradient(
0,0,
0,560
);

sky.addColorStop(
0,
"#172c5c"
);

sky.addColorStop(
0.55,
"#d47d42"
);

sky.addColorStop(
1,
"#f0b85d"
);

ctx.fillStyle=sky;

ctx.fillRect(
0,0,
1000,560
);


/* sun */

ctx.beginPath();

ctx.arc(
820,
100,
55,
0,
Math.PI*2
);

ctx.fillStyle="#ffd84d";

ctx.fill();


/* mountains */

ctx.fillStyle="#3a443b";

ctx.beginPath();

ctx.moveTo(0,360);
ctx.lineTo(170,210);
ctx.lineTo(300,360);
ctx.lineTo(470,180);
ctx.lineTo(650,360);
ctx.lineTo(820,210);
ctx.lineTo(1000,360);

ctx.closePath();

ctx.fill();


/* ground */

ctx.fillStyle="#345b2e";

ctx.fillRect(
0,
360,
1000,
200
);

}


/* =====================================================
   TREE
===================================================== */

function tree(x,y){

ctx.fillStyle="#57381e";

ctx.fillRect(
x-14,
y,
28,
150
);

ctx.fillStyle="#1e642d";

ctx.beginPath();

ctx.arc(
x,
y,
65,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
x-40,
y+25,
45,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
x+40,
y+25,
45,
0,
Math.PI*2
);

ctx.fill();

}


/* =====================================================
   RAM — IMPROVED CARTOON CHARACTER
===================================================== */

function ram(x,y,scale=1,walking=0){

ctx.save();

ctx.translate(
x,
y
);

ctx.scale(
scale,
scale
);


/* shadow */

ctx.fillStyle="#0004";

ctx.beginPath();

ctx.ellipse(
0,
115,
55,
12,
0,
0,
Math.PI*2
);

ctx.fill();


/* legs */

ctx.strokeStyle="#4b3022";
ctx.lineWidth=13;
ctx.lineCap="round";

let step=
Math.sin(walking)*10;

ctx.beginPath();

ctx.moveTo(-22,60);
ctx.lineTo(-28-step,112);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(22,60);
ctx.lineTo(28+step,112);

ctx.stroke();


/* golden clothing */

ctx.fillStyle="#e4ad45";

ctx.beginPath();

ctx.roundRect(
-48,
-20,
96,
100,
25
);

ctx.fill();


/* blue shawl */

ctx.fillStyle="#2863a8";

ctx.beginPath();

ctx.moveTo(-42,-15);
ctx.lineTo(-70,75);
ctx.lineTo(-30,85);
ctx.lineTo(0,20);

ctx.closePath();

ctx.fill();


/* neck */

ctx.fillStyle="#b8784e";

ctx.fillRect(
-13,
-48,
26,
30
);


/* face */

ctx.fillStyle="#c8875b";

ctx.beginPath();

ctx.arc(
0,
-80,
48,
0,
Math.PI*2
);

ctx.fill();


/* long hair */

ctx.fillStyle="#21140d";

ctx.beginPath();

ctx.arc(
0,
-105,
43,
Math.PI,
Math.PI*2
);

ctx.fill();

ctx.fillRect(
-40,
-105,
80,
35
);


/* hair top ornament */

ctx.fillStyle="#e8b94e";

ctx.beginPath();

ctx.arc(
0,
-130,
12,
0,
Math.PI*2
);

ctx.fill();


/* eyes */

ctx.fillStyle="#17110c";

ctx.beginPath();

ctx.ellipse(
-17,
-83,
6,
9,
0,
0,
Math.PI*2
);

ctx.ellipse(
17,
-83,
6,
9,
0,
0,
Math.PI*2
);

ctx.fill();


/* eyebrows */

ctx.strokeStyle="#3a2013";
ctx.lineWidth=4;

ctx.beginPath();

ctx.moveTo(-27,-98);
ctx.lineTo(-8,-102);

ctx.moveTo(8,-102);
ctx.lineTo(27,-98);

ctx.stroke();


/* nose */

ctx.beginPath();

ctx.moveTo(0,-80);
ctx.lineTo(-4,-65);
ctx.lineTo(5,-64);

ctx.stroke();


/* smile */

ctx.beginPath();

ctx.arc(
0,
-61,
14,
0,
Math.PI
);

ctx.stroke();


/* bow */

ctx.strokeStyle="#633a19";
ctx.lineWidth=6;

ctx.beginPath();

ctx.arc(
70,
5,
72,
-Math.PI/2,
Math.PI/2
);

ctx.stroke();


/* arrow */

ctx.strokeStyle="#d6b25b";
ctx.lineWidth=4;

ctx.beginPath();

ctx.moveTo(20,5);
ctx.lineTo(125,5);

ctx.stroke();


ctx.restore();

}


/* =====================================================
   SITA — IMPROVED

0,
112,

11,

Math.PI*2
);

ctx.beginPath();

ctx.moveTo(-50,-5);
ctx.lineTo(-75,110);
ctx.lineTo(75,110);
ctx.lineTo(50,-5);

ctx.closePath();

ctx.fill();

ctx.strokeStyle="#f1c34f";
ctx.lineWidth=8;

ctx.beginPath();

ctx.moveTo(-50,0);
ctx.lineTo(-75,110);
ctx.lineTo(75,110);

ctx.lineTo(-35,-35);

/* neck */

ctx.fillStyle="#c8875b";

ctx.fillRect(
-12,
-50,
24,
30
);


/* face */

ctx.fillStyle="#c8875b";

ctx.beginPath();

ctx.arc(
0,
-78,
43,
0,
Math.PI*2
);

ctx.fill();


/* hair */

ctx.fillStyle="#21140d";

ctx.beginPath();

ctx.arc(
0,
-98,
42,
Math.PI,
Math.PI*2
);

ctx.fill();

ctx.fillRect(
-40,
-98,
80,
28
);


/* veil */

ctx.fillStyle="#e6ad45aa";

ctx.beginPath();

ctx.moveTo(
-40,
-105
);

ctx.quadraticCurveTo(
0,
-145,
45,
-105
);

ctx.lineTo(
65,
10
);

ctx.lineTo(
40,
-5
);

ctx.lineTo(
25,
-75
);

ctx.closePath();

ctx.fill();


/* eyes */

ctx.fillStyle="#17110c";

ctx.beginPath();

ctx.ellipse(
-15,
-80,
5,
8,
0,
0,
Math.PI*2
);

ctx.ellipse(
15,
-80,
5,
8,
0,
0,
Math.PI*2
);

ctx.fill();


/* bindi */

ctx.fillStyle="#9e1c29";

ctx.beginPath();

ctx.arc(
0,
-65,
4,
0,
Math.PI*2
);

ctx.fill();


/* smile */

ctx.strokeStyle="#522319";
ctx.lineWidth=3;

ctx.beginPath();

ctx.arc(
0,
-58,
11,
0,
Math.PI
);

ctx.stroke();


/* necklace */

ctx.strokeStyle="#f4c84b";
ctx.lineWidth=5;

ctx.beginPath();

ctx.arc(
0,
-35,
25,
0,
Math.PI
);

/* =====================================================
   RAVAN — IMPROVED
===================================================== */

function ravan(x,y,scale=1){

ctx.save();

ctx.translate(x,y);

ctx.scale(
scale,
scale
);


/* body */

ctx.fillStyle="#581d25";

ctx.beginPath();

ctx.ellipse(
0,
30,
65,
105,
0,
0,
Math.PI*2
);

ctx.fill();


/* armor */

ctx.fillStyle="#d59a32";

ctx.fillRect(
-55,
-5,
110,
25
);


/* ten heads */

for(let i=0;i<5;i++){

let px=
(i-2)*42;

drawRavanHead(
px,
-110
);

}

for(let i=0;i<5;i++){

let px=
(i-2)*42;

drawRavanHead(
px,
-170
);

}


/* arms */

ctx.strokeStyle="#6c2630";
ctx.lineWidth=20;

for(let side of [-1,1]){

ctx.beginPath();

ctx.moveTo(
side*50,
0
);

ctx.lineTo(
side*110,
60
);

ctx.stroke();

}


/* sword */

ctx.strokeStyle="#d8b766";
ctx.lineWidth=7;

ctx.beginPath();

ctx.moveTo(
110,
60
);

ctx.lineTo(
150,
-10
);

ctx.stroke();


ctx.restore();

}


function drawRavanHead(x,y){

ctx.fillStyle="#8d3036";

ctx.beginPath();

ctx.arc(
x,
y,
30,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle="#e3a574";

ctx.beginPath();

ctx.arc(
x,
y+3,
22,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle="#21100d";

ctx.beginPath();

ctx.arc(
x,
y-12,
23,
Math.PI,
Math.PI*2
);

ctx.fill();


ctx.fillStyle="#111";

ctx.beginPath();

ctx.arc(
x-8,
y+2,
3,
0,
Math.PI*2
);

ctx.arc(
x+8,
y+2,
3,
0,
Math.PI*2
);

ctx.fill();

}


/* =====================================================
   ARROW
===================================================== */

function arrow(x,y){

ctx.strokeStyle="#e7cf91";
ctx.lineWidth=5;

ctx.beginPath();

ctx.moveTo(
x,
y
);

ctx.lineTo(
x+120,
y
);

ctx.stroke();


ctx.beginPath();

ctx.moveTo(
x+120,
y
);

ctx.lineTo(
x+98,
y-13
);

ctx.moveTo(
x+120,
y
);

ctx.lineTo(
x+98,
y+13
);

ctx.stroke();

}


/* =====================================================
   ANIMATION
===================================================== */

function animate(time){

const t=
(time-animationStart)/1000;


/* background */

background();

tree(100,285);
tree(900,280);


/* CHAPTER 1 */

if(current===0){

ram(
260+Math.sin(t)*8,
350,
1,
t*3
);

sita(
470,
350,
1
);

}


/* CHAPTER 2 */

else if(current===1){

ram(
250,
350,
1
);

sita(
450,
350,
1
);

tree(720,285);

}


/* CHAPTER 3 — SITA HARIAN */

else if(current===2){

sita(
320,
350,
1
);

ravan(
720,
320,
0.8
);


/* flying movement */

let ax=
350+Math.sin(t*2)*130;

arrow(
ax,
220
);

}


/* CHAPTER 4 */

else if(current===3){

ram(
220,
350,
1
);

sita(
430,
350,
1
);

hanuman(
700,
330,
0.9
);

}


/* CHAPTER 5 — HANUMAN FLYING */

else if(current===4){

ram(
180,
350,
0.8
);

let hx=
350+(t*100)%450;

let hy=
260+Math.sin(t*3)*55;

hanuman(
hx,
hy,
0.8
);

}


/* CHAPTER 6 — LANKA */

else if(current===5){

ravan(
700,
320,
0.75
);

hanuman(
280,
350,
0.75
);


/* fire */

for(let i=0;i<7;i++){

let fx=
350+i*75;

let fy=
330+Math.sin(t*6+i)*25;

ctx.fillStyle="#ff7a00";

ctx.beginPath();

ctx.arc(
fx,
fy,
18,
0,
Math.PI*2
);

ctx.fill();

}

}


/* CHAPTER 7 — WAR */

else if(current===6){

ram(
210,
350,
0.9
);

ravan(
720,
320,
0.72
);

let ax=
300+Math.sin(t*2)*160;

arrow(
ax,
230
);

}


/* CHAPTER 8 */

else{

ram(
330,
350,
1
);

sita(
510,
350,
1
);

}


/* LOOP */

requestAnimationFrame(
animate
);

}


/* =====================================================
   NAVIGATION
===================================================== */

function nextChapter(){

if(current<chapters.length-1){

loadChapter(
current+1
);

}

}


function previousChapter(){

if(current>0){

loadChapter(
current-1
);

}

}


function goHome(){

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =====================================================
   START
===================================================== */

loadChapter(0);

requestAnimationFrame(
animate
);

</script>
