<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>CAREM - Carrom Game</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle,#315844,#08110d);
    font-family:Arial,sans-serif;
    overflow:hidden;
    touch-action:none;
}

#app{
    width:min(96vw,720px);
    text-align:center;
}

h1{
    color:white;
    font-size:clamp(25px,6vw,42px);
    margin-bottom:6px;
    text-shadow:0 4px 10px #000;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
    background:#06120df5;
}

#menu h2{
    font-size:clamp(38px,10vw,70px);
    margin-bottom:10px;
}

#menu p{
    margin-bottom:15px;
}

.menuBtn{
    width:min(90%,340px);
    margin:7px;
    padding:15px;
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,#e7a340,#a95a1c);
    color:white;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 7px 18px #0008;
}

#hud{
    display:flex;
    gap:6px;
    margin-bottom:6px;
}

.player{
    flex:1;
    color:white;
    background:#0009;
    padding:7px;
    border-radius:12px;
    font-size:13px;
    font-weight:bold;
}

.player.active{
    border:2px solid #ffd21c;
    box-shadow:0 0 12px #ffd21c88;
}

#board{
    position:relative;
    width:100%;
    aspect-ratio:1;

    background:
        linear-gradient(135deg,
        #b86d2e,
        #f0bd72,
        #c47734);

    border:17px solid #512911;
    border-radius:10px;

    box-shadow:
        0 18px 40px #000c,
        inset 0 0 25px #693715;

    overflow:hidden;
}

.playArea{
    position:absolute;
    inset:5%;
    background:#f0c17a;
    border:3px solid #743917;
}

.centerCircle{
    position:absolute;
    width:28%;
    aspect-ratio:1;
    left:36%;
    top:36%;
    border:2px solid #8b401e;
    border-radius:50%;
}

.centerCircle:after{
    content:"";
    position:absolute;
    width:13%;
    aspect-ratio:1;
    left:43.5%;
    top:43.5%;
    background:#9c351b;
    border-radius:50%;
}

.pocket{
    position:absolute;
    width:9%;
    aspect-ratio:1;
    border-radius:50%;
    background:#100a07;
    border:4px solid #703614;
    box-shadow:inset 0 4px 7px #000;
}

.p1{left:.5%;top:.5%}
.p2{right:.5%;top:.5%}
.p3{left:.5%;bottom:.5%}
.p4{right:.5%;bottom:.5%}

.coin{
    position:absolute;
    width:6%;
    aspect-ratio:1;
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:10;
    box-shadow:
        0 3px 5px #0009,
        inset 1px 1px 3px #fff8;
}

.white{
    background:radial-gradient(circle at 35% 30%,#fff,#c8c8c8);
    border:2px solid #999;
}

.black{
    background:radial-gradient(circle at 35% 30%,#666,#111);
    border:2px solid #000;
}

.queen{
    background:radial-gradient(circle at 35% 30%,#ff6969,#a00000);
    border:2px solid #700;
}

#striker{
    position:absolute;
    width:7%;
    aspect-ratio:1;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%,#fff,#d4d4d4);
    border:3px solid #2475b4;
    box-shadow:0 3px 8px #000b;
    z-index:30;
    touch-action:none;
}

#aim{
    position:absolute;
    height:3px;
    background:
        repeating-linear-gradient(
            90deg,
            white 0 9px,
            transparent 9px 17px
        );
    transform-origin:left center;
    display:none;
    z-index:25;
    pointer-events:none;
}

#power{
    height:9px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
    margin-top:6px;
}

#powerBar{
    width:0%;
    height:100%;
    background:
        linear-gradient(
            90deg,
            #16cf61,
            #ffd000,
            #ff3434
        );
}

#message{
    color:white;
    min-height:28px;
    padding:5px;
    font-weight:bold;
}

.controls{
    display:flex;
    justify-content:center;
    gap:7px;
}

button{
    border:0;
    border-radius:12px;
    padding:10px 16px;
    background:#d99134;
    color:white;
    font-size:14px;
    font-weight:bold;
}

@media(max-width:500px){
    #board{
        border-width:11px;
    }

    .player{
        font-size:11px;
        padding:6px 3px;
    }

    button{
        padding:9px 12px;
        font-size:13px;
    }
}
</style>
</head>

<body>

<div id="menu">

    <h2>🎯 CAREM</h2>

    <p>Choose your game mode</p>

    <button class="menuBtn"
    onclick="newGame('computer')">
        🤖 Player vs Computer
    </button>

    <button class="menuBtn"
    onclick="newGame('two')">
        👥 Two Players
    </button>

</div>


<div id="app">

<h1>🎯 CAREM</h1>

<div id="hud">

    <div id="p1"
    class="player active">
        👤 Player 1<br>
        Score: <span id="s1">0</span>
    </div>

    <div class="player">
        🪙 <span id="left">19</span>
    </div>

    <div id="p2"
    class="player">
        🤖 Player 2<br>
        Score: <span id="s2">0</span>
    </div>

</div>


<div id="board">

    <div class="playArea"></div>

    <div class="centerCircle"></div>

    <div class="pocket p1"></div>
    <div class="pocket p2"></div>
    <div class="pocket p3"></div>
    <div class="pocket p4"></div>

    <div id="aim"></div>

    <div id="striker"></div>

</div>


<div id="power">
    <div id="powerBar"></div>
</div>


<div id="message">
    Start the game 🎮
</div>


<div class="controls">

    <button onclick="resetGame()">
        🔄 Restart
    </button>

    <button onclick="showMenu()">
        🏠 Menu
    </button>

</div>

</div>


<script>

/* ============================
   ELEMENTS
============================ */

const board =
document.getElementById("board");

const striker =
document.getElementById("striker");

const aim =
document.getElementById("aim");

const powerBar =
document.getElementById("powerBar");

const message =
document.getElementById("message");

const s1 =
document.getElementById("s1");

const s2 =
document.getElementById("s2");

const left =
document.getElementById("left");

const p1 =
document.getElementById("p1");

const p2 =
document.getElementById("p2");

const menu =
document.getElementById("menu");


/* ============================
   GAME STATE
============================ */

let mode = null;

let currentPlayer = 1;

let score = [0,0];

let coins = [];

let moving = false;

let aiming = false;

let sx = 50;

let sy = 87;

let vx = 0;

let vy = 0;

let startX = 0;

let startY = 0;


/*
   Queen system
*/

let queenPocketed = false;

let queenCovered = false;


/*
   Each player gets a colour
*/

let playerColor = {
    1:"white",
    2:"black"
};


/* ============================
   START GAME
============================ */

function newGame(gameMode){

    mode = gameMode;

    menu.style.display = "none";

    resetGame();
}


/* ============================
   RESET
============================ */

function resetGame(){

    score = [0,0];

    currentPlayer = 1;

    moving = false;

    aiming = false;

    sx = 50;

    sy = 87;

    vx = 0;

    vy = 0;

    queenPocketed = false;

    queenCovered = false;

    s1.textContent = "0";

    s2.textContent = "0";

    createBoard();

    setStriker();

    updateHUD();

    message.textContent =
        "Player 1: Striker पछाडि तान्नुहोस् 🎯";
}


/* ============================
   CREATE BOARD
============================ */

function createBoard(){

    coins.forEach(c=>{
        c.el.remove();
    });

    coins = [];


    /*
       Queen
    */

    addCoin(50,50,"queen");


    /*
       First ring
    */

    for(let i=0;i<9;i++){

        const a =
            i*Math.PI*2/9;

        addCoin(
            50+Math.cos(a)*8,
            50+Math.sin(a)*8,
            i%2===0
            ?"white"
            :"black"
        );
    }


    /*
       Second ring
    */

    for(let i=0;i<9;i++){

        const a =
            i*Math.PI*2/9
            + Math.PI/9;

        addCoin(
            50+Math.cos(a)*14,
            50+Math.sin(a)*14,
            i%2===0
            ?"black"
            :"white"
        );
    }
}


/* ============================
   ADD COIN
============================ */

function addCoin(x,y,color){

    const el =
        document.createElement("div");

    el.className =
        "coin " + color;

    board.appendChild(el);

    el.style.left = x+"%";
    el.style.top = y+"%";

    coins.push({
        el,
        x,
        y,
        vx:0,
        vy:0,
        color,
        active:true
    });
}


/* ============================
   STRIKER
============================ */

function setStriker(){

    striker.style.left =
        sx+"%";

    striker.style.top =
        sy+"%";
}


/* ============================
   HUD
============================ */

function updateHUD(){

    s1.textContent =
        score[0];

    s2.textContent =
        score[1];

    left.textContent =
        coins.filter(
            c=>c.active
        ).length;

    p1.classList.toggle(
        "active",
        currentPlayer===1
    );

    p2.classList.toggle(
        "active",
        currentPlayer===2
    );
}


/* ============================
   POINTER DOWN
============================ */

striker.addEventListener(
"pointerdown",
e=>{

    if(
        moving ||
        !mode ||
        (
            mode==="computer" &&
            currentPlayer===2
        )
    )
        return;

    aiming = true;

    startX =
        e.clientX;

    startY =
        e.clientY;

    striker.setPointerCapture(
        e.pointerId
    );
});


/* ============================
   POINTER MOVE
============================ */

striker.addEventListener(
"pointermove",
e=>{

    if(!aiming)
        return;

    const dx =
        startX-e.clientX;

    const dy =
        startY-e.clientY;

    const power =
        Math.min(
            Math.hypot(dx,dy),
            180
        );

    powerBar.style.width =
        power/180*100+"%";

    const angle =
        Math.atan2(dy,dx);

    aim.style.display =
        "block";

    aim.style.left =
        sx+"%";

    aim.style.top =
        sy+"%";

    aim.style.width =
        power+"px";

    aim.style.transform =
        `rotate(
        ${angle*180/Math.PI}deg)`;
});


/* ============================
   POINTER UP
============================ */

striker.addEventListener(
"pointerup",
e=>{

    if(!aiming)
        return;

    aiming = false;

    aim.style.display =
        "none";

    const dx =
        startX-e.clientX;

    const dy =
        startY-e.clientY;

    const power =
        Math.min(
            Math.hypot(dx,dy),
            180
        );

    powerBar.style.width =
        "0%";

    if(power<15)
        return;

    shoot(dx,dy,power);
});


/* ============================
   SHOOT
============================ */

function shoot(dx,dy,power){

    const angle =
        Math.atan2(dy,dx);


    /*
       Faster than previous version
    */

    const force =
        power*0.070;


    vx =
        Math.cos(angle)*force;

    vy =
        Math.sin(angle)*force;

    moving = true;

    message.textContent =
        currentPlayer===1
        ?"👤 Player 1 Shot!"
        :"👤 Player 2 Shot!";
}


/* ============================
   PHYSICS LOOP
============================ */

function loop(){

    if(moving){

        sx += vx;

        sy += vy;


        /*
           Stronger friction =
           faster finishing
        */

        vx *= .965;

        vy *= .965;


        /*
           Board walls
        */

        if(sx<8 || sx>92){

            vx *= -.82;

            sx =
                Math.max(
                    8,
                    Math.min(92,sx)
                );
        }


        if(sy<8 || sy>92){

            vy *= -.82;

            sy =
                Math.max(
                    8,
                    Math.min(92,sy)
                );
        }


        setStriker();


        /*
           Coins
        */

        coins.forEach(c=>{

            if(!c.active)
                return;

            c.x += c.vx;
            c.y += c.vy;

            c.vx *= .965;
            c.vy *= .965;


            if(c.x<7 || c.x>93){

                c.vx *= -.82;

                c.x =
                    Math.max(
                        7,
                        Math.min(93,c.x)
                    );
            }


            if(c.y<7 || c.y>93){

                c.vy *= -.82;

                c.y =
                    Math.max(
                        7,
                        Math.min(93,c.y)
                    );
            }


            strikerCollision(c);


            c.el.style.left =
                c.x+"%";

            c.el.style.top =
                c.y+"%";

            pocketCheck(c);

        });


        /*
           Coin collisions
        */

        for(
            let i=0;
            i<coins.length;
            i++
        ){

            for(
                let j=i+1;
                j<coins.length;
                j++
            ){

                if(
                    coins[i].active &&
                    coins[j].active
                ){

                    coinCollision(
                        coins[i],
                        coins[j]
                    );
                }
            }
        }


        /*
           Stop quickly
        */

        let stillMoving =
            Math.abs(vx)>.045 ||
            Math.abs(vy)>.045;


        coins.forEach(c=>{

            if(
                Math.abs(c.vx)>.045 ||
                Math.abs(c.vy)>.045
            )
                stillMoving=true;

        });


        if(!stillMoving){

            moving=false;

            finishTurn();
        }
    }


    requestAnimationFrame(loop);
}

loop();


/* ============================
   STRIKER COLLISION
============================ */

function strikerCollision(c){

    const dx =
        c.x-sx;

    const dy =
        c.y-sy;

    const d =
        Math.hypot(dx,dy);


    if(
        d<6 &&
        d>0
    ){

        const nx =
            dx/d;

        const ny =
            dy/d;

        const force =
            Math.hypot(vx,vy);


        c.vx =
            nx*force*1.08;

        c.vy =
            ny*force*1.08;


        vx *= .35;
        vy *= .35;
    }
}


/* ============================
   COIN COLLISION
============================ */

function coinCollision(a,b){

    const dx =
        b.x-a.x;

    const dy =
        b.y-a.y;

    const d =
        Math.hypot(dx,dy);


    if(
        d>=6 ||
        d===0
    )
        return;


    const nx =
        dx/d;

    const ny =
        dy/d;


    const rvx =
        a.vx-b.vx;

    const rvy =
        a.vy-b.vy;


    const speed =
        rvx*nx+rvy*ny;


    if(speed<0)
        return;


    a.vx -=
        speed*nx;

    a.vy -=
        speed*ny;

    b.vx +=
        speed*nx;

    b.vy +=
        speed*ny;
}


/* ============================
   POCKET CHECK
============================ */

function pocketCheck(c){

    const pockets=[
        [4,4],
        [96,4],
        [4,96],
        [96,96]
    ];


    for(
        const p of pockets
    ){

        if(
            Math.hypot(
                c.x-p[0],
                c.y-p[1]
            )<7
        ){

            pocketCoin(c);

            return;
        }
    }
}


/* ============================
   POCKET COIN
============================ */

function pocketCoin(c){

    c.active=false;

    c.el.remove();


    /*
       QUEEN
    */

    if(c.color==="queen"){

        queenPocketed=true;

        message.textContent =
            "🔴 Queen pocketed! Cover गर्नुहोस्";

        updateHUD();

        return;
    }


    /*
       Correct colour
    */

    if(
        c.color===
        playerColor[currentPlayer]
    ){

        score[currentPlayer-1]
            +=10;

        message.textContent =
            "🎯 Own coin +10";

    }
    else{

        /*
           Opponent coin =
           foul/penalty
        */

        score[currentPlayer-1]
            =Math.max(
                0,
                score[currentPlayer-1]-5
            );

        message.textContent =
            "⚠️ Opponent coin! -5";

    }


    updateHUD();
}


/* ============================
   TURN FINISH
============================ */

function finishTurn(){

    /*
       Queen must be covered
    */

    if(
        queenPocketed &&
        !queenCovered
    ){

        /*
           If current player has
           pocketed own coin after queen,
           queen is covered.
        */

        const ownRemaining =
            coins.some(
                c =>
                c.active &&
                c.color===
                playerColor[currentPlayer]
            );


        if(!ownRemaining){

            queenCovered=true;

            score[currentPlayer-1]
                +=20;

            message.textContent =
                "👑 Queen Covered! +20";

        }
        else{

            message.textContent =
                "⚠️ Queen Cover failed";

        }
    }


    /*
       Win check
    */

    const remaining =
        coins.filter(
            c=>c.active &&
            c.color!=="queen"
        ).length;


    if(remaining===0){

        finishGame();

        return;
    }


    /*
       Change turn
    */

    currentPlayer =
        currentPlayer===1
        ?2
        :1;


    sx=50;

    sy =
        currentPlayer===1
        ?87
        :13;

    vx=0;
    vy=0;

    setStriker();

    updateHUD();


    /*
       Computer
    */

    if(
        mode==="computer" &&
        currentPlayer===2
    ){

        message.textContent =
            "🤖 Computer सोच्दैछ...";

        setTimeout(
            computerShot,
            500
        );

    }
    else{

        message.textContent =
            `Player ${currentPlayer}: Shot लिनुहोस् 🎯`;
    }
}


/* ============================
   COMPUTER
============================ */

function computerShot(){

    if(moving)
        return;


    const targets =
        coins.filter(
            c =>
            c.active &&
            c.color!=="queen"
        );


    if(!targets.length)
        return;


    /*
       Choose nearest target
    */

    let target=targets[0];

    let best=Infinity;


    targets.forEach(c=>{

        const d =
            Math.hypot(
                c.x-sx,
                c.y-sy
            );

        if(d<best){

            best=d;

            target=c;
        }
    });


    const dx =
        target.x-sx;

    const dy =
        target.y-sy;


    const angle =
        Math.atan2(dy,dx);


    /*
       Slight randomness
    */

    const finalAngle =
        angle+
        (Math.random()-.5)*.12;


    const power =
        100+
        Math.random()*55;


    vx =
        Math.cos(finalAngle)
        *power*.070;

    vy =
        Math.sin(finalAngle)
        *power*.070;


    moving=true;

    message.textContent =
        "🤖 Computer Shot!";
}


/* ============================
   FINISH GAME
============================ */

function finishGame(){

    moving=false;


    let result;


    if(score[0]>score[1]){

        result =
            "🏆 Player 1 Wins!";

    }
    else if(score[1]>score[0]){

        result =
            mode==="computer"
            ?"🤖 Computer Wins!"
            :"🏆 Player 2 Wins!";

    }
    else{

        result =
            "🤝 Match Draw!";
    }


    message.innerHTML =
        `${result}
        &nbsp; ${score[0]} - ${score[1]}`;
}


/* ============================
   MENU
============================ */

function showMenu(){

    moving=false;

    mode=null;

    menu.style.display="flex";
}


/* ============================
   INITIAL
============================ */

setStriker();

</script>

</body>
</html>
