<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>महाभारत — डिजिटल पुस्तक</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
    Georgia,
    "Noto Serif Devanagari",
    serif;

    background:
    radial-gradient(circle at top,#76552e,#17110b);

    color:#38220f;

    min-height:100vh;

    transition:.3s;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;

    background:
    linear-gradient(
        135deg,
        #54250c,
        #b56b20,
        #54250c
    );

    color:white;

    text-align:center;

    padding:14px;

    box-shadow:
    0 5px 20px #0009;
}

header h1{
    font-size:clamp(28px,7vw,48px);

    text-shadow:
    0 3px 5px #000;
}

header p{
    margin-top:4px;
}

.controls{
    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:6px;

    margin-top:10px;
}

button{
    border:0;

    padding:9px 14px;

    border-radius:9px;

    cursor:pointer;

    font-weight:bold;

    background:
    linear-gradient(
        145deg,
        #ffd477,
        #a75a18
    );

    color:#321706;

    box-shadow:
    0 3px 7px #0007;

    transition:.15s;
}

button:hover{
    transform:translateY(-2px);
}

button:active{
    transform:scale(.94);
}

#search{
    margin-top:9px;

    width:min(92%,500px);

    padding:11px;

    border-radius:9px;

    border:1px solid #e0b45c;

    outline:none;

    font-size:16px;
}

/* PROGRESS */

.progress{
    height:7px;

    background:#392515;
}

#progress{
    width:0;

    height:100%;

    background:
    linear-gradient(
        90deg,
        #e9a52d,
        #fff2a2
    );

    transition:.4s;
}

/* MAIN */

.wrapper{
    width:min(1250px,96%);

    margin:18px auto;

    display:grid;

    grid-template-columns:
    270px 1fr;

    gap:16px;
}

/* SIDE MENU */

.sidebar{
    background:
    linear-gradient(
        135deg,
        #dfc28c,
        #f9e5ae
    );

    border:
    2px solid #966128;

    border-radius:12px;

    padding:12px;

    height:max-content;

    position:sticky;

    top:155px;

    box-shadow:
    0 8px 25px #0007;
}

.sidebar h2{
    text-align:center;

    color:#71360e;

    margin-bottom:10px;
}

.parva{
    display:block;

    width:100%;

    margin:4px 0;

    text-align:left;

    background:#a96722;

    color:white;
}

.parva.active{
    background:#642b0c;

    box-shadow:
    inset 0 0 0 2px #ffd76a;
}

/* BOOK */

.book{
    background:
    linear-gradient(
        90deg,
        #ddc28a,
        #fff3ca,
        #ddc28a
    );

    border:
    2px solid #98652b;

    border-radius:13px;

    min-height:80vh;

    padding:
    clamp(22px,6vw,65px);

    box-shadow:
    0 15px 45px #0009,
    inset 0 0 40px #8d5d222f;
}

/* CHAPTER */

.title{
    text-align:center;

    color:#71350d;

    margin-bottom:25px;
}

.title h2{
    font-size:
    clamp(26px,6vw,42px);

    margin-bottom:7px;
}

.title h3{
    font-size:16px;

    opacity:.7;
}

/* STORY */

.story{
    font-size:21px;

    line-height:2;

    text-align:justify;

    transition:.2s;
}

.story p{
    margin-bottom:20px;
}

.story .dropcap:first-letter{
    float:left;

    font-size:3.7em;

    line-height:.75;

    padding-right:8px;

    color:#a14c10;
}

/* QUOTE */

.quote{
    margin:25px 0;

    padding:18px;

    border-left:
    5px solid #ad681f;

    background:#cda76255;

    border-radius:8px;

    font-style:italic;
}

/* INFO */

.info{
    margin-top:25px;

    padding:15px;

    background:#cba45b55;

    border-left:
    5px solid #a85b19;

    border-radius:8px;
}

/* NAV */

.navigation{
    display:flex;

    gap:10px;

    margin-top:30px;

    padding-top:16px;

    border-top:
    1px solid #a47b43;
}

.navigation button{
    flex:1;
}

/* DARK */

body.dark{
    background:
    radial-gradient(circle at top,#3d2c1e,#080705);

    color:#ead8b5;
}

body.dark .book{
    background:
    linear-gradient(
        90deg,
        #211b15,
        #30271d,
        #211b15
    );

    border-color:#75562d;
}

body.dark .sidebar{
    background:#292119;

    color:#ead8b5;
}

body.dark .sidebar h2,
body.dark .title{
    color:#e4ae5c;
}

body.dark .story .dropcap:first-letter{
    color:#e5a450;
}

body.dark .info,
body.dark .quote{
    background:#453724;
}

/* MOBILE */

@media(max-width:800px){

    .wrapper{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:static;
    }

    .parva{
        display:inline-block;

        width:auto;

        margin:2px;

        font-size:13px;
    }

    .book{
        padding:24px 17px;
    }

    .story{
        text-align:left;

        line-height:1.9;

        font-size:18px;
    }

    .navigation{
        flex-direction:column;
    }

    .navigation button{
        width:100%;
    }
}

</style>
</head>

/* =====================================
   VARIABLES
===================================== */

let current=0;

let fontSize=21;


/* =====================================
   MENU
===================================== */

function makeMenu(){

    const menu=
    document.getElementById("menu");

    parvas.forEach((name,i)=>{

        const b=
        document.createElement("button");

        b.className="parva";

        b.textContent=
        `${i+1}. ${name}`;

        b.onclick=()=>{

            const first=
            chapters.findIndex(
                c=>c.parva===i
            );

            if(first>=0){

                current=first;

                show();

            }

        };

        menu.appendChild(b);

    });
}


/* =====================================
   SHOW
===================================== */

function show(){

    const c=
    chapters[current];

    document.getElementById(
        "chapter"
    ).textContent=c.title;

    document.getElementById(
        "number"
    ).textContent=
    `${parvas[c.parva]} • ${current+1}/${chapters.length}`;

    document.getElementById(
        "story"
    ).innerHTML=c.text;

    document.getElementById(
        "info"
    ).textContent=
    "📜 "+c.info;

    document.getElementById(
        "story"
    ).style.fontSize=
    fontSize+"px";

    document.getElementById(
        "progress"
    ).style.width=
    ((current+1)/chapters.length*100)+"%";

    highlight();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

===================================== */

function next(){

    if(current<
       chapters.length-1){

        current++;

        show();
    }

}


/* =====================================
   PREVIOUS
===================================== */

function previous(){

    if(current>0){

        current--;

        show();
    }

}


/* =====================================
   HIGHLIGHT
===================================== */

function highlight(){

    document
    .querySelectorAll(".parva")
    .forEach((b,i)=>{

        b.classList.toggle(
            "active",
            i===chapters[current].parva
        );

    });
}


/* =====================================
   DARK MODE
===================================== */

function darkMode(){

    document.body
    .classList.toggle("dark");

}


/* =====================================
   FONT
===================================== */

function font(amount){

    fontSize+=amount;

    if(fontSize<15)
        fontSize=15;

    if(fontSize>32)
        fontSize=32;

    document.getElementById(
        "story"
    ).style.fontSize=
    fontSize+"px";
}


/* =====================================
   BOOKMARK
===================================== */

function bookmark(){

    localStorage.setItem(
        "mahabharat-bookmark",
        current
    );

    alert(
        "🔖 यो अध्याय Bookmark भयो!"
    );
}


/* =====================================
   SEARCH
===================================== */

function searchBook(){

    const q=
    document.getElementById(
        "search"
    ).value
    .toLowerCase()
    .trim();

    if(!q)
        return;

    const found=
    chapters.findIndex(c=>

        c.title
        .toLowerCase()
        .includes(q)

        ||

        parvas[c.parva]
        .toLowerCase()
        .includes(q)

    );

    if(found>=0){

        current=found;

        show();

    }

}


/* =====================================
   LOAD BOOKMARK
===================================== */

const saved=
localStorage.getItem(
    "mahabharat-bookmark"
);

if(saved!==null){

    current=
    Number(saved);

}


/* =====================================
   START
===================================== */

makeMenu();

show();

</script>
