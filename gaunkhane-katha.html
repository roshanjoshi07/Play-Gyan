<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🇳🇵 गाउँखाने कथा Quiz</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:"Noto Sans Devanagari",Arial,sans-serif;
    background:
        linear-gradient(135deg,#061b2e,#075985,#064e3b);
    color:white;
    padding:12px;
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
}

header{
    text-align:center;
    padding:15px 5px 20px;
}

header h1{
    font-size:clamp(26px,7vw,44px);
    text-shadow:0 4px 12px #000;
}

header p{
    color:#cde8e5;
    margin-top:6px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:12px;
}

.stat{
    text-align:center;
    padding:10px 4px;
    border-radius:15px;
    background:#ffffff12;
    border:1px solid #ffffff25;
}

.stat small{
    display:block;
    color:#b9d2dc;
    font-size:12px;
}

.stat strong{
    font-size:19px;
}

/* GAME */

.game{
    background:#ffffff0d;
    border:1px solid #ffffff25;
    border-radius:22px;
    padding:20px;
    box-shadow:0 15px 40px #0008;
    backdrop-filter:blur(10px);
}

.progress{
    height:9px;
    background:#ffffff18;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress-bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#00d4ff,#00ff88);
    transition:.3s;
}

.riddle-box{
    background:#ffffff0d;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    border:1px solid #ffffff20;
}

.label{
    text-align:center;
    color:#ffd166;
    font-weight:bold;
    margin-bottom:10px;
}

.riddle{
    text-align:center;
    font-size:clamp(20px,5vw,30px);
    line-height:1.6;
    font-weight:bold;
}

/* OPTIONS */

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.option{
    min-height:60px;
    padding:12px;
    border-radius:15px;
    border:2px solid #ffffff20;
    background:#ffffff0c;
    color:white;
    font-size:16px;
    font-family:inherit;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    transform:translateY(-3px);
    background:#ffffff18;
}

.option.correct{
    background:#087c4a;
    border-color:#20e695;
}

.option.wrong{
    background:#8d2020;
    border-color:#ff6262;
}

.option:disabled{
    cursor:not-allowed;
}

/* FEEDBACK */

.feedback{
    min-height:45px;
    text-align:center;
    font-size:17px;
    font-weight:bold;
    margin:15px 0 5px;
    line-height:1.5;
}

/* BUTTON */

.next,
.restart{
    width:100%;
    padding:14px;
    border:0;
    border-radius:14px;
    color:white;
    font-size:17px;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
}

.next{
    background:linear-gradient(135deg,#00aaff,#0066ff);
}

.restart{
    background:#00b86b;
}

/* RESULT */

.result{
    display:none;
    text-align:center;
}

.result h2{
    font-size:30px;
    margin-bottom:10px;
}

.final-score{
    font-size:55px;
    font-weight:bold;
    margin:10px;
}

.result-text{
    line-height:1.7;
}

/* MOBILE */

@media(max-width:600px){

    body{
        padding:7px;
    }

    .game{
        padding:13px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .options{
        grid-template-columns:1fr;
    }

    .riddle{
        font-size:21px;
    }

    .option{
        min-height:55px;
    }
}
</style>
</head>

/* =====================================================

let current = 0;
let score = 0;
let right = 0;

let lives = 3;

let answered = false;

let gameQuestions = [];


/* =====================================================
   ELEMENTS
   ===================================================== */

const riddle =
document.getElementById("riddle");

const options =
document.getElementById("options");

const feedback =
document.getElementById("feedback");

const scoreEl =
document.getElementById("score");

const rightEl =
document.getElementById("right");

const numberEl =
document.getElementById("number");

const livesEl =
document.getElementById("lives");

const progress =
document.getElementById("progress");

const game =
document.getElementById("game");

const result =
document.getElementById("result");

const finalScore =
document.getElementById("finalScore");

const resultText =
document.getElementById("resultText");

const resultTitle =
document.getElementById("resultTitle");


/* =====================================================
   SHUFFLE QUESTIONS
   ===================================================== */

function shuffleQuestions(){

    gameQuestions =
        [...riddles];

    for(
        let i = gameQuestions.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            gameQuestions[i],
            gameQuestions[j]
        ] =
        [
            gameQuestions[j],
            gameQuestions[i]
        ];
    }
}


/* =====================================================
   SHUFFLE OPTIONS
   ===================================================== */

function shuffleOptions(item){

    let answers =
        item.a.map(
            (answer,index)=>({
                text:answer,
                correct:index === item.c
            })
        );

    for(
        let i = answers.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            answers[i],
            answers[j]
        ] =
        [
            answers[j],
            answers[i]
        ];
    }

    return answers;
}


/* =====================================================
   LOAD QUESTION
   ===================================================== */

function loadQuestion(){

    answered = false;

    const item =
        gameQuestions[current];

    numberEl.textContent =
        current + 1;

    scoreEl.textContent =
        score;

    rightEl.textContent =
        right;

    updateLives();

    riddle.textContent =
        item.q;

    options.innerHTML = "";

    feedback.textContent = "";

    progress.style.width =
        (
            current /
            gameQuestions.length *
            100
        ) + "%";


    const answers =
        shuffleOptions(item);


    answers.forEach(
        answer=>{

            const button =
                document.createElement("button");

            button.className =
                "option";

            button.textContent =
                answer.text;

            button.dataset.correct =
                answer.correct;

            button.onclick =
                function(){

                    checkAnswer(
                        answer.correct,
                        button,
                        answers
                    );

                };

            options.appendChild(button);

        }
    );
}


/* =====================================================
   LIFE DISPLAY
   ===================================================== */

function updateLives(){

    let hearts = "";

    for(
        let i = 0;
        i < 3;
        i++
    ){

        if(i < lives){

            hearts += "❤️";

        }else{

            hearts += "🖤";

        }
    }

    livesEl.textContent =
        hearts;
}


/* =====================================================
   CHECK ANSWER
   ===================================================== */

function checkAnswer(
    isCorrect,
    button,
    answers
){

    if(answered){
        return;
    }

    answered = true;


    const all =
        document.querySelectorAll(
            ".option"
        );


    all.forEach(
        b=>{
            b.disabled = true;
        }
    );


    if(isCorrect){

        button.classList.add(
            "correct"
        );

        feedback.innerHTML =
            "🎉 बिल्कुल सही! +10 Points";

        score += 10;

        right++;

    }else{

        button.classList.add(
            "wrong"
        );


        /* SHOW CORRECT ANSWER */

        all.forEach(
            b=>{

                if(
                    b.dataset.correct ===
                    "true"
                ){

                    b.classList.add(
                        "correct"
                    );

                }

            }
        );


        /* REMOVE LIFE */

        lives--;

        updateLives();


        let correctAnswer =
            answers.find(
                a=>a.correct
            );


        feedback.innerHTML =
            "❌ गलत!<br>" +
            "सही उत्तर: <b>" +
            correctAnswer.text +
            "</b><br>" +
            "❤️ बाँकी Life: " +
            lives;


        /* 3 WRONG ANSWERS */

        if(lives <= 0){

            setTimeout(
                gameOver,
                1300
            );

            return;
        }

    }


    scoreEl.textContent =
        score;

    rightEl.textContent =
        right;
}


/* =====================================================
   NEXT QUESTION
   ===================================================== */

function nextQuestion(){

    if(!answered){

        feedback.textContent =
            "👇 पहिले एउटा उत्तर छान्नुहोस्।";

        return;
    }


    current++;


    if(
        current >=
        gameQuestions.length
    ){

        finishGame();

        return;
    }


    loadQuestion();
}


/* =====================================================
   GAME OVER
   ===================================================== */

function gameOver(){

    game.style.display =
        "none";

    result.style.display =
        "block";

    resultTitle.textContent =
        "💔 Game Over!";

    finalScore.textContent =
        score;


    resultText.innerHTML =
        "तपाईंका सबै ❤️ Life सकिए।" +
        "<br><br>" +

        "सही उत्तर: " +
        right +
        "<br>" +

        "Score: " +
        score +
        "<br><br>" +

        "🎲 फेरि खेल्दा प्रश्नहरू " +
        "<b>नयाँ Random क्रम</b> मा आउनेछन्।";


    document.querySelector(
        ".restart"
    ).textContent =
        "🎲 नयाँ प्रश्नबाट फेरि खेल्नुहोस्";
}


/* =====================================================
   FINISH GAME
   ===================================================== */

function finishGame(){

    game.style.display =
        "none";

    result.style.display =
        "block";

    resultTitle.textContent =
        "🏆 सबै प्रश्न सकियो!";

    finalScore.textContent =
        score;


    const percent =
        Math.round(
            right /
            gameQuestions.length *
            100
        );


    if(percent >= 90){

        resultText.innerHTML =
            "🔥 शानदार!" +
            "<br>" +
            "तपाईं गाउँखाने कथा Master हुनुहुन्छ!";

    }
    else if(percent >= 70){

        resultText.innerHTML =
            "👏 धेरै राम्रो!" +
            "<br>" +
            "तपाईंलाई गाउँखाने कथा राम्रोसँग आउँछ।";

    }
    else if(percent >= 50){

        resultText.innerHTML =
            "👍 राम्रो प्रयास!" +
            "<br>" +
            "अझै केही अभ्यास गर्नुहोस्।";

    }
    else{

        resultText.innerHTML =
            "📚 अझै अभ्यास गर्नुहोस्!" +
            "<br>" +
            "फेरि खेल्दा अझ राम्रो गर्न सक्नुहुन्छ।";

    }

}


/* =====================================================
   RESTART WITH NEW RANDOM QUESTIONS
   ===================================================== */

function restartGame(){

    current = 0;

    score = 0;

    right = 0;

    lives = 3;

    answered = false;


    /* NEW RANDOM ORDER */

    shuffleQuestions();


    game.style.display =
        "block";

    result.style.display =
        "none";


    loadQuestion();
}


/* =====================================================
   START GAME
   ===================================================== */

shuffleQuestions();

loadQuestion();

</script>
