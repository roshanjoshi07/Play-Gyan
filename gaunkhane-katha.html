<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>गाउँ खाने कथा - Quiz</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, "Noto Sans Devanagari", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #141e30, #243b55);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    color: white;
}

.game {
    width: 100%;
    max-width: 650px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
}

h1 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #d8e7ff;
    margin-bottom: 20px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
}

.info {
    flex: 1;
    background: rgba(0,0,0,0.20);
    padding: 12px;
    border-radius: 14px;
    text-align: center;
}

.info small {
    display: block;
    color: #cbd5e1;
    margin-bottom: 4px;
}

.info strong {
    font-size: 20px;
}

#lives {
    letter-spacing: 3px;
}

.progress-box {
    width: 100%;
    height: 9px;
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 22px;
}

#progress {
    height: 100%;
    width: 0%;
    background: #22c55e;
    transition: width 0.3s;
}

.question-box {
    background: rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 25px 20px;
    margin-bottom: 20px;
}

.question-number {
    color: #93c5fd;
    font-size: 15px;
    margin-bottom: 12px;
}

.question {
    font-size: 23px;
    line-height: 1.6;
    font-weight: bold;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 13px;
}

.option {
    border: none;
    border-radius: 15px;
    padding: 17px 12px;
    background: #f8fafc;
    color: #172033;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    min-height: 60px;
}

.option:hover {
    transform: translateY(-3px);
    background: #dbeafe;
}

.option.correct {
    background: #22c55e;
    color: white;
}

.option.wrong {
    background: #ef4444;
    color: white;
}

.option.disabled {
    pointer-events: none;
}

.feedback {
    min-height: 45px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin-top: 18px;
}

.next-btn,
.restart-btn {
    display: none;
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    background: #3b82f6;
    color: white;
    margin-top: 10px;
}

.next-btn:hover,
.restart-btn:hover {
    background: #2563eb;
}

.game-over {
    display: none;
    text-align: center;
}

.game-over h2 {
    font-size: 38px;
    margin-bottom: 15px;
}

.game-over p {
    font-size: 20px;
    margin-bottom: 8px;
}

.restart-btn {
    display: block;
}

.hidden {
    display: none !important;
}

@media(max-width: 550px) {

    .game {
        padding: 18px;
        border-radius: 20px;
    }

    h1 {
        font-size: 27px;
    }

    .question {
        font-size: 19px;
    }

    .options {
        grid-template-columns: 1fr;
    }

    .option {
        min-height: 55px;
    }

    .topbar {
        flex-wrap: wrap;
    }

    .info {
        min-width: 30%;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>🧠 गाउँ खाने कथा</h1>
    <p class="subtitle">सोच्नुहोस्, उत्तर छान्नुहोस् र आफ्नो बुद्धि परीक्षण गर्नुहोस्!</p>

    <div id="quiz">

        <div class="topbar">

            <div class="info">
                <small>प्रश्न</small>
                <strong id="questionCount">1 / 100</strong>
            </div>

            <div class="info">
                <small>स्कोर</small>
                <strong id="score">0</strong>
            </div>

            <div class="info">
                <small>जीवन</small>
                <strong id="lives">❤️❤️❤️</strong>
            </div>

        </div>

        <div class="progress-box">
            <div id="progress"></div>
        </div>

        <div class="question-box">

            <div class="question-number" id="questionNumber">
                प्रश्न नं. 1
            </div>

            <div class="question" id="question">
                प्रश्न यहाँ आउनेछ।
            </div>

        </div>

        <div class="options" id="options"></div>

        <div class="feedback" id="feedback"></div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
            अर्को प्रश्न ➜
        </button>

    </div>

    <div class="game-over" id="gameOver">

        <h2>💀 Game Over</h2>

        <p>तपाईंको खेल सकियो!</p>

        <p>अन्तिम स्कोर: <strong id="finalScore">0</strong></p>

        <p>सही उत्तर: <strong id="finalCorrect">0</strong></p>

        <button class="restart-btn" onclick="restartGame()">
            🔄 फेरि खेल्नुहोस्
        </button>

    </div>

</div>

// ================================
// GAME VARIABLES
// ================================

let currentQuestion = 0;
let score = 0;
let lives = 3;
let correctAnswers = 0;

let shuffledQuestions = [];


// ================================
// SHUFFLE
// ================================

function shuffle(array) {

    return array
        .map(value => ({ value, sort: Math.random() }))
        .sort((a,b) => a.sort - b.sort)
        .map(({value}) => value);

}


// ================================
// START GAME
// ================================

function startGame() {

    shuffledQuestions = shuffle([...questions]);

    currentQuestion = 0;
    score = 0;
    lives = 3;
    correctAnswers = 0;

    document.getElementById("quiz").classList.remove("hidden");
    document.getElementById("gameOver").style.display = "none";

    updateLives();
    showQuestion();

}


// ================================
// SHOW QUESTION
// ================================

function showQuestion() {

    const q = shuffledQuestions[currentQuestion];

    document.getElementById("questionCount").textContent =
        `${currentQuestion + 1} / ${shuffledQuestions.length}`;

    document.getElementById("questionNumber").textContent =
        `प्रश्न नं. ${currentQuestion + 1}`;

    document.getElementById("question").textContent =
        q.question;

    document.getElementById("score").textContent =
        score;

    document.getElementById("feedback").textContent = "";

    document.getElementById("nextBtn").style.display = "none";

    const progress =
        ((currentQuestion) / shuffledQuestions.length) * 100;

    document.getElementById("progress").style.width =
        progress + "%";

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    const shuffledOptions = shuffle([...q.options]);

    shuffledOptions.forEach(option => {

        const button = document.createElement("button");

        button.className = "option";

        button.textContent = option;

        button.onclick = () =>
            checkAnswer(button, option, q.answer);

        optionsContainer.appendChild(button);

    });

}


// ================================
// CHECK ANSWER
// ================================

function checkAnswer(button, selected, correct) {

    const allOptions =
        document.querySelectorAll(".option");

    allOptions.forEach(btn => {
        btn.classList.add("disabled");
    });


    if (selected === correct) {

        button.classList.add("correct");

        score += 10;

        correctAnswers++;

        document.getElementById("score").textContent =
            score;

        document.getElementById("feedback").innerHTML =
            "🎉 सही उत्तर! +10 अंक";

        document.getElementById("feedback").style.color =
            "#4ade80";

    }

    else {

        button.classList.add("wrong");

        lives--;

        updateLives();

        allOptions.forEach(btn => {

            if (btn.textContent === correct) {
                btn.classList.add("correct");
            }

        });

        document.getElementById("feedback").innerHTML =
            `❌ गलत उत्तर! सही उत्तर: <b>${correct}</b>`;

        document.getElementById("feedback").style.color =
            "#f87171";


        if (lives <= 0) {

            setTimeout(gameOver, 1200);

            return;
        }

    }


    document.getElementById("nextBtn").style.display =
        "block";

}


// ================================
// NEXT QUESTION
// ================================

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= shuffledQuestions.length) {

        finishGame();

        return;
    }

    showQuestion();

}


// ================================
// UPDATE LIVES
// ================================

function updateLives() {

    let hearts = "";

    for (let i = 0; i < lives; i++) {
        hearts += "❤️";
    }

    for (let i = lives; i < 3; i++) {
        hearts += "🖤";
    }

    document.getElementById("lives").textContent =
        hearts;

}


// ================================
// GAME OVER
// ================================

function gameOver() {

    document.getElementById("quiz")
        .classList.add("hidden");

    document.getElementById("gameOver")
        .style.display = "block";

    document.getElementById("finalScore")
        .textContent = score;

    document.getElementById("finalCorrect")
        .textContent = correctAnswers;

}


// ================================
// FINISH GAME
// ================================

function finishGame() {

    document.getElementById("quiz")
        .classList.add("hidden");

    document.getElementById("gameOver")
        .style.display = "block";

    document.querySelector("#gameOver h2")
        .textContent = "🏆 खेल पूरा भयो!";

    document.querySelector("#gameOver p")
        .textContent =
        "तपाईंले सबै गाउँ खाने कथा पूरा गर्नुभयो!";

    document.getElementById("finalScore")
        .textContent = score;

    document.getElementById("finalCorrect")
        .textContent = correctAnswers;

}


// ================================
// RESTART
// ================================

function restartGame() {

    document.querySelector("#gameOver h2")
        .textContent = "💀 Game Over";

    startGame();

}


// ================================
// START
// ================================

startGame();
