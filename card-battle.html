<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Card Battle Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#263c73,#090d20 65%);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

#game{
    width:100%;
    min-height:100vh;
    position:relative;
    padding:12px;
    overflow:hidden;
}

.bg-orb{
    position:absolute;
    width:250px;
    height:250px;
    border-radius:50%;
    filter:blur(70px);
    opacity:.25;
    pointer-events:none;
}

.orb1{
    background:#ff315c;
    left:-100px;
    top:120px;
}

.orb2{
    background:#2f8cff;
    right:-100px;
    bottom:100px;
}

/* TOP */

.topbar{
    max-width:1050px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;
    backdrop-filter:blur(10px);
}

.title{
    font-size:22px;
    font-weight:900;
}

.small-btn{
    border:0;
    padding:9px 15px;
    border-radius:12px;
    background:#ffffff18;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

/* ARENA */

.arena{
    max-width:1050px;
    margin:14px auto;
    padding:15px;
    border-radius:25px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.11),
            rgba(255,255,255,.035)
        );
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 20px 60px #0008;
}

/* PLAYER AREA */

.fighter{
    display:flex;
    align-items:center;
    gap:15px;
}

.avatar{
    width:64px;
    height:64px;
    border-radius:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    background:linear-gradient(145deg,#ff526e,#7b1d3d);
    box-shadow:0 8px 25px #0008;
}

.enemy .avatar{
    background:linear-gradient(145deg,#596cff,#172d83);
}

.info{
    flex:1;
}

.name{
    font-size:18px;
    font-weight:900;
    margin-bottom:7px;
}

.hpbar{
    width:100%;
    max-width:420px;
    height:18px;
    background:#090d19;
    border-radius:20px;
    overflow:hidden;
    border:1px solid #ffffff22;
}

.hp{
    height:100%;
    width:100%;
    transition:.35s;
    background:linear-gradient(
        90deg,
        #ff315b,
        #ff9b43
    );
}

.enemy .hp{
    background:linear-gradient(
        90deg,
        #367bff,
        #6f5cff
    );
}

.stats{
    margin-top:5px;
    font-size:13px;
    color:#d8def5;
}

/* BATTLE MESSAGE */

#message{
    text-align:center;
    min-height:50px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:8px;
    font-weight:bold;
    color:#ffe875;
    font-size:16px;
}

/* CENTER */

.battle-zone{
    min-height:210px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    position:relative;
}

.vs{
    font-size:32px;
    font-weight:1000;
    color:#ffe04d;
    text-shadow:0 4px 15px #000;
}

.battle-card{
    width:150px;
    height:205px;
    border-radius:18px;
    padding:10px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    text-align:center;
    box-shadow:0 15px 35px #0008;
    border:3px solid #fff;
    transform:rotate(-4deg);
    background:
        linear-gradient(
            145deg,
            #ff5b6d,
            #8e163e
        );
}

.battle-card.enemy-card{
    transform:rotate(4deg);
    background:
        linear-gradient(
            145deg,
            #4e7cff,
            #15256e
        );
}

.battle-card .emoji{
    font-size:62px;
}

.battle-card h3{
    font-size:17px;
}

.battle-card .power{
    font-size:25px;
    font-weight:1000;
    color:#ffe24c;
}

/* HAND */

.hand-title{
    text-align:center;
    margin:8px 0 10px;
    color:#cfd8ff;
}

.hand{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

/* CARDS */

.card{
    width:125px;
    height:175px;
    border:2px solid #ffffff77;
    border-radius:17px;
    padding:9px;
    cursor:pointer;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    text-align:center;
    background:
        linear-gradient(
            145deg,
            #ffffff,
            #dfe7ff
        );
    color:#11172b;
    box-shadow:0 12px 25px #0008;
    transition:.18s;
    user-select:none;
}

.card:hover{
    transform:translateY(-12px) scale(1.03);
    border-color:#ffe04d;
}

.card.selected{
    transform:translateY(-15px) scale(1.04);
    border-color:#ffe04d;
    box-shadow:
        0 0 25px #ffe04d99,
        0 15px 30px #0009;
}

.card.disabled{
    opacity:.45;
    cursor:not-allowed;
    filter:grayscale(.7);
}

.card .cost{
    position:absolute;
    top:7px;
    left:7px;
    width:27px;
    height:27px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background:#2477ff;
    color:white;
    font-weight:bold;
}

.card .cardemoji{
    font-size:50px;
    margin-top:10px;
}

.card h3{
    font-size:15px;
}

.card .damage{
    font-size:19px;
    font-weight:1000;
    color:#d52c47;
}

.card small{
    color:#4c5572;
    font-size:10px;
}

/* CONTROLS */

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:13px;
}

.action{
    border:0;
    border-radius:14px;
    padding:13px 22px;
    font-weight:900;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#ff3d68,#8c245b);
    box-shadow:0 5px 0 #4c1636;
}

.action:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #4c1636;
}

.action:disabled{
    opacity:.4;
    cursor:not-allowed;
}

/* MANA */

.mana-area{
    max-width:500px;
    margin:12px auto 0;
    text-align:center;
}

.mana-title{
    font-size:13px;
    color:#b9c8ff;
    margin-bottom:5px;
}

.mana-bar{
    height:14px;
    background:#080c19;
    border-radius:20px;
    overflow:hidden;
}

.mana{
    height:100%;
    width:100%;
    background:linear-gradient(
        90deg,
        #20a8ff,
        #8c5cff
    );
    transition:.3s;
}

/* LOG */

#battleLog{
    max-width:850px;
    margin:12px auto 0;
    height:75px;
    overflow:auto;
    padding:8px;
    border-radius:12px;
    background:#0005;
    font-size:12px;
    color:#bbc7e9;
}

#battleLog div{
    margin-bottom:4px;
}

/* OVERLAY */

#overlay{
    position:fixed;
    inset:0;
    z-index:200;
    background:#020617d9;
    backdrop-filter:blur(10px);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.modal{
    max-width:500px;
    width:100%;
    padding:30px;
    border-radius:25px;
    background:
        linear-gradient(
            145deg,
            #202c5d,
            #0b1029
        );
    border:1px solid #ffffff25;
    box-shadow:0 30px 80px #000;
}

.modal h1{
    font-size:42px;
    margin-bottom:12px;
}

.modal p{
    color:#c7d0ed;
    margin-bottom:20px;
}

.start-btn{
    border:0;
    padding:14px 28px;
    border-radius:15px;
    background:#ffe04d;
    color:#15192a;
    font-size:17px;
    font-weight:1000;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* DAMAGE ANIMATION */

.hit{
    animation:hit .3s;
}

@keyframes hit{
    0%{transform:translateX(0)}
    25%{transform:translateX(-12px)}
    50%{transform:translateX(12px)}
    75%{transform:translateX(-7px)}
    100%{transform:translateX(0)}
}

/* MOBILE */

@media(max-width:650px){

    .topbar{
        padding:10px;
    }

    .title{
        font-size:17px;
    }

    .arena{
        padding:10px;
        margin:8px auto;
    }

    .battle-zone{
        min-height:150px;
        gap:12px;
    }

    .battle-card{
        width:110px;
        height:145px;
    }

    .battle-card .emoji{
        font-size:42px;
    }

    .card{
        width:100px;
        height:145px;
    }

    .card .cardemoji{
        font-size:38px;
    }

    .card h3{
        font-size:12px;
    }

    .card .damage{
        font-size:16px;
    }

    .fighter .avatar{
        width:50px;
        height:50px;
        font-size:28px;
    }

    .controls{
        margin-top:8px;
    }

    .action{
        padding:11px 16px;
    }
}
</style>
</head>

<body>

<div id="game">

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<!-- TOP -->

<div class="topbar">

    <div class="title">
        🃏 Card Battle Arena
    </div>

    <button class="small-btn"
            onclick="newGame()">
        🔄 New Game
    </button>

</div>


<div class="arena">

<!-- ENEMY -->

<div class="fighter enemy">

    <div class="avatar">
        🤖
    </div>

    <div class="info">

        <div class="name">
            Dark Bot
        </div>

        <div class="hpbar">
            <div
                id="enemyHP"
                class="hp">
            </div>
        </div>

        <div class="stats">
            ❤️ HP:
            <span id="enemyHpText">
                100
            </span>
            / 100
        </div>

    </div>

</div>


<div id="message">
    Choose a card to attack!
</div>


<!-- BATTLE AREA -->

<div class="battle-zone">

    <div
        id="enemyBattleCard"
        class="battle-card enemy-card">

        <div class="emoji">
            👹
        </div>

        <h3>
            Dark Warrior
        </h3>

        <div class="power">
            ⚔️ 18
        </div>

    </div>


    <div class="vs">
        VS
    </div>


    <div
        id="playerBattleCard"
        class="battle-card">

        <div class="emoji">
            🛡️
        </div>

        <h3>
            Your Hero
        </h3>

        <div class="power">
            ⚔️ 10
        </div>

    </div>

</div>


<!-- PLAYER -->

<div class="fighter">

    <div class="avatar">
        🧙
    </div>

    <div class="info">

        <div class="name">
            You
        </div>

        <div class="hpbar">
            <div
                id="playerHP"
                class="hp">
            </div>
        </div>

        <div class="stats">
            ❤️ HP:
            <span id="playerHpText">
                100
            </span>
            / 100
        </div>

    </div>

</div>


<!-- MANA -->

<div class="mana-area">

    <div class="mana-title">
        🔷 Mana:
        <span id="manaText">
            5
        </span>
        / 5
    </div>

    <div class="mana-bar">
        <div
            id="mana"
            class="mana">
        </div>
    </div>

</div>


<h3 class="hand-title">
    🃏 Choose Your Card
</h3>


<!-- CARDS -->

<div
    id="hand"
    class="hand">
</div>


<div class="controls">

    <button
        id="endTurn"
        class="action"
        onclick="endTurn()">

        ⚡ End Turn

    </button>

</div>


<div id="battleLog">
</div>

</div>


<!-- OVERLAY -->

<div id="overlay">

    <div class="modal">

        <h1>
            🃏 Card Battle
        </h1>

        <p>
            Defeat the Dark Bot by using
            powerful cards and smart strategy!
        </p>

        <button
            class="start-btn"
            onclick="startGame()">

            ⚔️ START BATTLE

        </button>

    </div>

</div>

</div>


<script>

/* =========================================
   CARD DATA
========================================= */

const cards=[

{
    name:"Fire Mage",
    emoji:"🔥",
    damage:20,
    cost:2,
    type:"attack",
    text:"20 damage"
},

{
    name:"Ice Blast",
    emoji:"❄️",
    damage:15,
    cost:1,
    type:"attack",
    text:"15 damage"
},

{
    name:"Thunder",
    emoji:"⚡",
    damage:28,
    cost:3,
    type:"attack",
    text:"28 damage"
},

{
    name:"Knight",
    emoji:"⚔️",
    damage:12,
    cost:1,
    type:"attack",
    text:"12 damage"
},

{
    name:"Dragon",
    emoji:"🐉",
    damage:35,
    cost:4,
    type:"attack",
    text:"35 damage"
},

{
    name:"Heal",
    emoji:"💚",
    damage:18,
    cost:2,
    type:"heal",
    text:"Restore 18 HP"
},

{
    name:"Meteor",
    emoji:"☄️",
    damage:45,
    cost:5,
    type:"attack",
    text:"45 damage"
},

{
    name:"Shield",
    emoji:"🛡️",
    damage:10,
    cost:2,
    type:"shield",
    text:"10 damage + shield"
}

];


/* =========================================
   VARIABLES
========================================= */

let playerHP=100;
let enemyHP=100;

let mana=5;
let maxMana=5;

let shield=0;

let playerTurn=true;

let gameStarted=false;

let selectedCard=null;


/* =========================================
   DOM
========================================= */

const hand=
document.getElementById("hand");

const playerHpText=
document.getElementById("playerHpText");

const enemyHpText=
document.getElementById("enemyHpText");

const playerHPBar=
document.getElementById("playerHP");

const enemyHPBar=
document.getElementById("enemyHP");

const manaBar=
document.getElementById("mana");

const manaText=
document.getElementById("manaText");

const message=
document.getElementById("message");

const log=
document.getElementById("battleLog");


/* =========================================
   SOUND
========================================= */

let audioCtx=null;

function sound(
    frequency,
    duration=.1,
    type="sine"
){

    try{

        if(!audioCtx){

            audioCtx=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

        }

        if(
            audioCtx.state==="suspended"
        ){

            audioCtx.resume();

        }

        const osc=
        audioCtx.createOscillator();

        const gain=
        audioCtx.createGain();

        osc.type=type;

        osc.frequency.value=
        frequency;

        gain.gain.setValueAtTime(
            .08,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime+
            duration
        );

        osc.connect(gain);

        gain.connect(
            audioCtx.destination
        );

        osc.start();

        osc.stop(
            audioCtx.currentTime+
            duration
        );

    }catch(e){}

}


/* =========================================
   START
========================================= */

function startGame(){

    document
    .getElementById("overlay")
    .classList
    .add("hidden");

    newGame();

}


/* =========================================
   NEW GAME
========================================= */

function newGame(){

    playerHP=100;

    enemyHP=100;

    mana=5;

    shield=0;

    playerTurn=true;

    gameStarted=true;

    selectedCard=null;

    message.innerText=
        "Choose a card to attack!";

    log.innerHTML="";

    updateUI();

    renderHand();

    addLog(
        "⚔️ Battle started!"
    );

}


/* =========================================
   UPDATE UI
========================================= */

function updateUI(){

    playerHpText.innerText=
        Math.max(0,playerHP);

    enemyHpText.innerText=
        Math.max(0,enemyHP);

    playerHPBar.style.width=
        Math.max(0,playerHP)+"%";

    enemyHPBar.style.width=
        Math.max(0,enemyHP)+"%";

    manaText.innerText=
        mana;

    manaBar.style.width=
        (mana/maxMana*100)+"%";

}


/* =========================================
   RENDER HAND
========================================= */

function renderHand(){

    hand.innerHTML="";


    cards.forEach(
        (card,index)=>{

            const div=
            document.createElement("div");

            div.className="card";


            if(
                card.cost>mana ||
                !playerTurn
            ){

                div.classList.add(
                    "disabled"
                );

            }


            div.innerHTML=`

                <div class="cost">
                    ${card.cost}
                </div>

                <div class="cardemoji">
                    ${card.emoji}
                </div>

                <h3>
                    ${card.name}
                </h3>

                <div class="damage">
                    ${
                        card.type==="heal"
                        ? "❤️ +"+card.damage
                        : "⚔️ "+card.damage
                    }
                </div>

                <small>
                    ${card.text}
                </small>

            `;


            div.onclick=()=>{

                playCard(
                    index,
                    div
                );

            };


            hand.appendChild(div);

        }
    );

}


/* =========================================
   PLAY CARD
========================================= */

function playCard(
    index,
    element
){

    if(!gameStarted)
        return;

    if(!playerTurn)
        return;


    const card=
    cards[index];


    if(card.cost>mana){

        message.innerText=
            "❌ Not enough mana!";

        sound(180,.1);

        return;

    }


    mana-=card.cost;


    /* HEAL */

    if(card.type==="heal"){

        playerHP=
        Math.min(
            100,
            playerHP+card.damage
        );

        message.innerText=
            "💚 You healed "+card.damage+" HP!";

        addLog(
            "💚 You used Heal."
        );

        sound(700,.15);

    }


    /* SHIELD */

    else if(card.type==="shield"){

        let damage=
        calculateDamage(
            card.damage
        );

        enemyHP-=damage;

        shield+=15;

        message.innerText=
            "🛡️ Shield activated!";

        addLog(
            "🛡️ Shield attack dealt "+
            damage+
            " damage."
        );

        sound(600,.12);

    }


    /* ATTACK */

    else{

        let damage=
        calculateDamage(
            card.damage
        );

        enemyHP-=damage;

        message.innerText=
            "💥 "+card.name+
            " dealt "+damage+
            " damage!";

        addLog(
            "🔥 You used "+
            card.name+
            " for "+
            damage+
            " damage."
        );

        sound(
            300+
            damage*8,
            .12,
            "square"
        );

    }


    element.classList.add("selected");

    document
    .getElementById(
        "enemyBattleCard"
    )
    .classList.add("hit");


    setTimeout(
        ()=>{

            document
            .getElementById(
                "enemyBattleCard"
            )
            .classList.remove("hit");

        },
        350
    );


    updateUI();


    if(
        enemyHP<=0
    ){

        winGame();

        return;

    }


    playerTurn=false;

    renderHand();


    setTimeout(
        enemyTurn,
        800
    );

}


/* =========================================
   DAMAGE
========================================= */

function calculateDamage(
    base
){

    let bonus=
    Math.floor(
        Math.random()*6
    );

    return base+bonus;

}


/* =========================================
   ENEMY TURN
========================================= */

function enemyTurn(){

    if(
        enemyHP<=0 ||
        playerHP<=0
    )
        return;


    message.innerText=
        "🤖 Dark Bot is attacking...";


    setTimeout(
        ()=>{

            let attacks=[
                10,
                12,
                15,
                18,
                22
            ];


            let damage=
            attacks[
                Math.floor(
                    Math.random()*
                    attacks.length
                )
            ];


            /* SHIELD */

            if(shield>0){

                let blocked=
                Math.min(
                    shield,
                    damage
                );

                shield-=blocked;

                damage-=blocked;

                addLog(
                    "🛡️ Your shield blocked "+
                    blocked+
                    " damage."
                );

            }


            playerHP-=damage;


            message.innerText=
                "💥 Dark Bot dealt "+
                damage+
                " damage!";


            addLog(
                "🤖 Enemy attacked for "+
                damage+
                " damage."
            );


            document
            .getElementById(
                "playerBattleCard"
            )
            .classList.add("hit");


            setTimeout(
                ()=>{

                    document
                    .getElementById(
                        "playerBattleCard"
                    )
                    .classList.remove("hit");

                },
                350
            );


            sound(
                130,
                .18,
                "sawtooth"
            );


            updateUI();


            if(
                playerHP<=0
            ){

                loseGame();

                return;

            }


            /* NEW TURN */

            mana=
            Math.min(
                maxMana,
                mana+2
            );


            playerTurn=true;

            message.innerText=
                "⚔️ Your turn! Choose a card.";

            renderHand();

            updateUI();

        },
        700
    );

}


/* =========================================
   END TURN
========================================= */

function endTurn(){

    if(
        !gameStarted ||
        !playerTurn
    )
        return;


    playerTurn=false;

    message.innerText=
        "⚡ Turn ended.";

    renderHand();

    setTimeout(
        enemyTurn,
        500
    );

}


/* =========================================
   WIN
========================================= */

function winGame(){

    gameStarted=false;

    enemyHP=0;

    updateUI();

    message.innerText=
        "🏆 YOU WIN!";


    addLog(
        "🏆 Congratulations! You defeated Dark Bot!"
    );


    sound(
        900,
        .15
    );

    setTimeout(
        ()=>{

            showResult(
                "🏆 YOU WIN!",
                "Amazing battle! You defeated the enemy."
            );

        },
        700
    );

}


/* =========================================
   LOSE
========================================= */

function loseGame(){

    gameStarted=false;

    playerHP=0;

    updateUI();

    message.innerText=
        "💀 YOU LOST!";


    addLog(
        "💀 Dark Bot defeated you."
    );


    sound(
        120,
        .3,
        "sawtooth"
    );


    setTimeout(
        ()=>{

            showResult(
                "💀 GAME OVER",
                "The Dark Bot won this battle."
            );

        },
        700
    );

}


/* =========================================
   RESULT
========================================= */

function showResult(
    title,
    text
){

    const overlay=
    document.getElementById(
        "overlay"
    );

    overlay.innerHTML=`

        <div class="modal">

            <h1>
                ${title}
            </h1>

            <p>
                ${text}
            </p>

            <button
                class="start-btn"
                onclick="newGame();closeResult()">

                🔄 PLAY AGAIN

            </button>

        </div>

    `;

    overlay.classList.remove(
        "hidden"
    );

}


function closeResult(){

    document
    .getElementById(
        "overlay"
    )
    .classList
    .add("hidden");

}


/* =========================================
   LOG
========================================= */

function addLog(text){

    const item=
    document.createElement("div");

    item.innerText=text;

    log.prepend(item);

}

</script>

</body>
</html>
