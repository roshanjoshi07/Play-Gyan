<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Highway Racer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:min(100vw,400px);height:min(100vh,700px);max-width:400px;max-height:700px;overflow:hidden;background:#333;box-shadow:0 0 25px #000}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:5;color:#fff;font-weight:bold;font-size:18px}
.badge{padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.55);text-shadow:1px 1px 2px #000}
#start,#over{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
#over{display:none}
h1{margin:0 0 10px;font-size:40px;text-shadow:0 0 12px #0ff}
p{margin:8px 0 20px}
button{border:0;border-radius:12px;padding:13px 28px;font-size:19px;font-weight:bold;background:#00c853;color:#fff}
#hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-size:13px;z-index:4;text-shadow:1px 1px 3px #000}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="400" height="700"></canvas>

<div id="hud">
  <div class="badge">🏁 <span id="score">0</span></div>
  <div class="badge">🪙 <span id="coins">0</span></div>
  <div class="badge">⚡ <span id="speed">1</span></div>
</div>

<div id="hint">Swipe ← → to steer</div>

<div id="start">
  <h1>HIGHWAY RACER</h1>
  <p>Swipe left or right to change lanes<br>Collect coins and avoid traffic!</p>
  <button id="play">PLAY</button>
</div>

<div id="over">
  <h1>GAME OVER</h1>
  <p>Score: <b id="finalScore">0</b></p>
  <p>Best: <b id="best">0</b></p>
  <button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");
const speedEl=document.getElementById("speed");

const lanes=[62,174,286];
const player={lane:1,x:174,y:560,w:52,h:100,targetX:174};
let traffic=[],coinList=[];
let score=0,coins=0,game=false,dead=false;
let roadOffset=0,speed=5,spawnTimer=0,coinTimer=0;
let last=0,touchX=0;

function reset(){
  traffic=[];coinList=[];score=0;coins=0;speed=5;
  player.lane=1;player.x=174;player.targetX=174;dead=false;
  updateHUD();
}

document.getElementById("play").onclick=()=>{
  document.getElementById("start").style.display="none";
  game=true; last=performance.now(); requestAnimationFrame(loop);
};

canvas.addEventListener("touchstart",e=>{
  touchX=e.touches[0].clientX;
},{passive:true});

canvas.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)>35){
    if(dx<0) move(-1); else move(1);
  }
},{passive:true});

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") move(-1);
  if(e.key==="ArrowRight") move(1);
});

function move(dir){
  if(!game||dead)return;
  player.lane=Math.max(0,Math.min(2,player.lane+dir));
  player.targetX=lanes[player.lane];
}

function updateHUD(){
  scoreEl.textContent=score;
  coinsEl.textContent=coins;
  speedEl.textContent=Math.max(1,Math.floor(speed/2));
}

function roundedRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawRoad(dt){
  ctx.fillStyle="#555";
  ctx.fillRect(0,0,400,700);

  ctx.fillStyle="#1d8a35";
  ctx.fillRect(0,0,34,700);
  ctx.fillRect(366,0,34,700);

  ctx.fillStyle="#eee";
  ctx.fillRect(34,0,5,700);
  ctx.fillRect(361,0,5,700);

  roadOffset=(roadOffset+speed*dt/16.67)%70;

  ctx.strokeStyle="#f5f5f5";
  ctx.lineWidth=6;
  for(let y=-70;y<710;y+=70){
    for(const xx of [133,266]){
      ctx.beginPath();
      ctx.moveTo(xx,y+roadOffset);
      ctx.lineTo(xx,y+35+roadOffset);
      ctx.stroke();
    }
  }
}

function drawCar(px,py,color,isPlayer=false){
  ctx.save();

  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();
  ctx.ellipse(px+26,py+96,29,8,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#111";
  ctx.fillRect(px-4,py+17,8,22);
  ctx.fillRect(px+48,py+17,8,22);
  ctx.fillRect(px-4,py+66,8,22);
  ctx.fillRect(px+48,py+66,8,22);

  ctx.fillStyle=color;
  roundedRect(px+3,py,46,94,11);ctx.fill();

  ctx.fillStyle="rgba(255,255,255,.18)";
  roundedRect(px+9,py+9,34,70,9);ctx.fill();

  ctx.fillStyle="#9eeaff";
  roundedRect(px+11,py+16,30,25,6);ctx.fill();

  ctx.fillStyle="#4da9c4";
  roundedRect(px+12,py+45,28,15,5);ctx.fill();

  ctx.fillStyle=isPlayer?"#fff59d":"#ff4040";
  ctx.fillRect(px+8,py+4,10,6);
  ctx.fillRect(px+34,py+4,10,6);

  ctx.fillStyle="#222";
  ctx.fillRect(px+5,py+81,42,6);

  ctx.fillStyle="rgba(255,255,255,.45)";
  ctx.fillRect(px+24,py+4,4,76);

  ctx.restore();
}

function spawnTraffic(){
  const lane=Math.floor(Math.random()*3);
  traffic.push({
    lane,x:lanes[lane],y:-120,
    color:["#1976d2","#ff9800","#8e24aa","#00a878","#e53935"][Math.floor(Math.random()*5)]
  });
}

function spawnCoin(){
  const lane=Math.floor(Math.random()*3);
  coinList.push({lane,x:lanes[lane]+26,y:-20,r:11,rot:0});
}

function drawTraffic(dt){
  for(let i=traffic.length-1;i>=0;i--){
    const t=traffic[i];
    t.y+=speed*dt/16.67;
    drawCar(t.x,t.y,t.color,false);

    if(t.y>720){
      traffic.splice(i,1);
      score++;
      continue;
    }

    if(player.x+7<t.x+48 && player.x+45>t.x &&
       player.y+10<t.y+90 && player.y+90>t.y+8){
      endGame();
      return;
    }
  }
}

function drawCoins(dt){
  for(let i=coinList.length-1;i>=0;i--){
    const c=coinList[i];
    c.y+=speed*dt/16.67;
    c.rot+=.12;

    ctx.save();
    ctx.translate(c.x,c.y);
    ctx.scale(Math.abs(Math.cos(c.rot))*.65+.35,1);
    ctx.fillStyle="#ffd600";
    ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#fff59d";ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle="#9a6b00";ctx.font="bold 13px Arial";
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("$",0,1);
    ctx.restore();

    if(c.x>player.x && c.x<player.x+52 && c.y>player.y && c.y<player.y+100){
      coins++;
      score+=5;
      coinList.splice(i,1);
      continue;
    }
    if(c.y>720)coinList.splice(i,1);
  }
}

function endGame(){
  if(dead)return;
  dead=true;game=false;
  const old=Number(localStorage.getItem("highwayBest")||0);
  const best=Math.max(old,score);
  localStorage.setItem("highwayBest",best);
  document.getElementById("finalScore").textContent=score;
  document.getElementById("best").textContent=best;
  document.getElementById("over").style.display="flex";
}

function loop(now){
  if(!game)return;
  const dt=Math.min(32,now-last);last=now;

  ctx.clearRect(0,0,400,700);
  drawRoad(dt);

  spawnTimer+=dt;
  coinTimer+=dt;

  if(spawnTimer>900){
    spawnTimer=0;
    spawnTraffic();
  }
  if(coinTimer>700){
    coinTimer=0;
    spawnCoin();
  }

  speed=Math.min(13,5+score*.035);
  player.x+=(player.targetX-player.x)*.18;

  drawTraffic(dt);
  if(!dead)drawCoins(dt);
  drawCar(player.x,player.y,"#e91e63",true);

  updateHUD();

  if(!dead)requestAnimationFrame(loop);
}

reset();
</script>
</body>
</html>
