<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Neon Pong</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    background:#020617;
    font-family:Arial,sans-serif;
    color:white;
    touch-action:none;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;

    background:
    radial-gradient(circle at center,#172554,#020617 70%);
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}

.hud{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;

    display:flex;
    gap:35px;

    padding:10px 25px;
    border-radius:20px;

    background:#020617aa;
    border:1px solid #ffffff22;
    backdrop-filter:blur(10px);
}

.score{
    font-size:32px;
    font-weight:bold;
}

.label{
    font-size:10px;
    color:#94a3b8;
    text-align:center;
}

.screen{
    position:absolute;
    inset:0;
    z-index:20;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#020617bb;
    backdrop-filter:blur(12px);
}

.card{
    width:min(420px,90%);
    padding:35px 25px;

    text-align:center;

    border-radius:28px;

    background:
    linear-gradient(145deg,#0f172a,#1e293b);

    border:1px solid #ffffff1c;

    box-shadow:0 30px 90px #000b;

    animation:appear .5s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:scale(.7) translateY(30px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.icon{
    font-size:70px;
    margin-bottom:10px;

    animation:float 2s infinite ease-in-out;
}

@keyframes float{
    50%{
        transform:translateY(-10px);
    }
}

h1{
    font-size:40px;

    background:
    linear-gradient(90deg,#22d3ee,#818cf8,#f472b6);

    -webkit-background-clip:text;
    color:transparent;
}

p{
    color:#94a3b8;
    line-height:1.7;
    margin:15px 0 25px;
}

button{
    width:100%;
    padding:15px;

    border:0;
    border-radius:18px;

    color:white;
    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(135deg,#2563eb,#7c3aed);

    box-shadow:0 10px 30px #4f46e566;
}

button:active{
    transform:scale(.97);
}

.hidden{
    display:none!important;
}

.controls{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;

    color:#64748b;
    font-size:12px;
    text-align:center;
}
</style>
</head>

<body>

<div id="game">

    <div class="hud">

        <div>
            <div class="label">YOU</div>
            <div id="playerScore" class="score">0</div>
        </div>

        <div>
            <div class="label">AI</div>
            <div id="aiScore" class="score">0</div>
        </div>

    </div>

    <canvas id="canvas"></canvas>

    <div class="controls">
        PC: W / S or ↑ / ↓ &nbsp; • &nbsp; Mobile: Drag your paddle
    </div>

    <div id="startScreen" class="screen">

        <div class="card">

            <div class="icon">🏓</div>

            <h1>NEON PONG</h1>

            <p>
                Classic Pong with modern neon graphics.<br>
                Play against the AI and reach 7 points!
                <br><br>
                🎮 PC: W/S or Arrow Keys<br>
                📱 Mobile: Drag your paddle
            </p>

            <button id="startBtn">
                ▶ START GAME
            </button>

        </div>

    </div>


    <div id="gameOver" class="screen hidden">

        <div class="card">

            <div id="resultIcon" class="icon">🏆</div>

            <h1 id="resultTitle">
                YOU WIN!
            </h1>

            <p>
                Final Score
                <br><br>

                <strong
                id="finalScore"
                style="font-size:30px">
                    0 - 0
                </strong>
            </p>

            <button id="restartBtn">
                🔄 PLAY AGAIN
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================
   CANVAS
========================================= */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let W,H;

function resize(){

    W=innerWidth;
    H=innerHeight;

    const dpr =
    Math.min(
        devicePixelRatio || 1,
        2
    );

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}

resize();

addEventListener("resize",resize);


/* =========================================
   GAME VARIABLES
========================================= */

let playerScore=0;
let aiScore=0;

let playing=false;

const paddle={
    width:15,
    height:110,
    speed:8
};

let player={
    x:35,
    y:0
};

let ai={
    x:0,
    y:0
};

let ball={
    x:0,
    y:0,
    size:11,
    vx:6,
    vy:3
};

let particles=[];


/* =========================================
   RESET
========================================= */

function resetPositions(){

    player.x=30;
    player.y=H/2-paddle.height/2;

    ai.x=W-45;
    ai.y=H/2-paddle.height/2;

    ball.x=W/2;
    ball.y=H/2;

    const direction =
    Math.random()<.5 ? -1 : 1;

    ball.vx=
    direction*6;

    ball.vy=
    (Math.random()-.5)*6;
}


/* =========================================
   DRAW BACKGROUND
========================================= */

function drawBackground(){

    ctx.fillStyle="#020617";

    ctx.fillRect(
        0,0,W,H
    );

    /* glow */

    const gradient=
    ctx.createRadialGradient(
        W/2,H/2,20,
        W/2,H/2,
        Math.max(W,H)*.7
    );

    gradient.addColorStop(
        0,
        "#172554"
    );

    gradient.addColorStop(
        1,
        "#020617"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,0,W,H
    );


    /* center line */

    ctx.setLineDash([
        10,15
    ]);

    ctx.strokeStyle=
    "#ffffff25";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
        W/2,
        0
    );

    ctx.lineTo(
        W/2,
        H
    );

    ctx.stroke();

    ctx.setLineDash([]);


    /* circles */

    ctx.strokeStyle=
    "#ffffff12";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        90,
        0,
        Math.PI*2
    );

    ctx.stroke();

}


/* =========================================
   DRAW PADDLE
========================================= */

function drawPaddle(
    p,
    type
){

    const gradient=
    ctx.createLinearGradient(
        0,
        p.y,
        0,
        p.y+paddle.height
    );

    if(type==="player"){

        gradient.addColorStop(
            0,
            "#22d3ee"
        );

        gradient.addColorStop(
            1,
            "#2563eb"
        );

        ctx.shadowColor=
        "#22d3ee";

    }else{

        gradient.addColorStop(
            0,
            "#f472b6"
        );

        gradient.addColorStop(
            1,
            "#7c3aed"
        );

        ctx.shadowColor=
        "#f472b6";
    }

    ctx.shadowBlur=25;

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.roundRect(
        p.x,
        p.y,
        paddle.width,
        paddle.height,
        10
    );

    ctx.fill();

    ctx.shadowBlur=0;
}


/* =========================================
   DRAW BALL
========================================= */

function drawBall(){

    ctx.shadowColor=
    "#f8fafc";

    ctx.shadowBlur=25;

    const g=
    ctx.createRadialGradient(
        ball.x-3,
        ball.y-3,
        2,
        ball.x,
        ball.y,
        ball.size
    );

    g.addColorStop(
        0,
        "#ffffff"
    );

    g.addColorStop(
        .4,
        "#67e8f9"
    );

    g.addColorStop(
        1,
        "#2563eb"
    );

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.size,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;
}


/* =========================================
   PARTICLES
========================================= */

function particlesAt(
    x,
    y
){

    for(let i=0;i<18;i++){

        particles.push({

            x:x,
            y:y,

            vx:
            (Math.random()-.5)*7,

            vy:
            (Math.random()-.5)*7,

            life:1,

            size:
            2+Math.random()*4

        });

    }
}


function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha=p.life;

        ctx.fillStyle=
        "#67e8f9";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;
}


function updateParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=
        particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.life-=.04;

        if(p.life<=0){

            particles.splice(
                i,
                1
            );

        }

    }
}


/* =========================================
   COLLISION
========================================= */

function paddleCollision(
    p
){

    return(
        ball.x-ball.size < p.x+paddle.width &&
        ball.x+ball.size > p.x &&
        ball.y+ball.size > p.y &&
        ball.y-ball.size <
        p.y+paddle.height
    );
}


/* =========================================
   UPDATE GAME
========================================= */

function update(){

    if(!playing)
        return;

    /* player */

    ball.x+=ball.vx;
    ball.y+=ball.vy;


    /* top / bottom */

    if(
        ball.y-ball.size<0 ||
        ball.y+ball.size>H
    ){

        ball.vy*=-1;

        wallSound();

        particlesAt(
            ball.x,
            ball.y
        );

    }


    /* player paddle */

    if(
        ball.vx<0 &&
        paddleCollision(player)
    ){

        ball.x=
        player.x+
        paddle.width+
        ball.size;

        ball.vx=
        Math.abs(ball.vx)*1.04;

        const hit=
        (
            ball.y -
            (
                player.y+
                paddle.height/2
            )
        )
        /
        (
            paddle.height/2
        );

        ball.vy=
        hit*6;

        paddleSound();

        particlesAt(
            ball.x,
            ball.y
        );

    }


    /* AI paddle */

    if(
        ball.vx>0 &&
        paddleCollision(ai)
    ){

        ball.x=
        ai.x-ball.size;

        ball.vx=
        -Math.abs(ball.vx)*1.04;

        const hit=
        (
            ball.y-
            (
                ai.y+
                paddle.height/2
            )
        )
        /
        (
            paddle.height/2
        );

        ball.vy=
        hit*6;

        paddleSound();

        particlesAt(
            ball.x,
            ball.y
        );

    }


    /* AI */

    const target=
    ball.y-
    paddle.height/2;

    /*
       AI has reaction delay,
       so it can be beaten.
    */

    const aiSpeed=
    4.5+
    Math.min(
        playerScore*.15,
        2
    );

    if(
        ai.y<target
    ){

        ai.y+=aiSpeed;

    }else{

        ai.y-=aiSpeed;

    }


    ai.y=
    Math.max(
        0,
        Math.min(
            H-paddle.height,
            ai.y
        )
    );


    /* SCORE */

    if(
        ball.x< -30
    ){

        aiScore++;

        scoreSound(false);

        updateScore();

        if(
            aiScore>=7
        ){

            endGame(false);

        }else{

            resetPositions();

        }

    }


    if(
        ball.x>W+30
    ){

        playerScore++;

        scoreSound(true);

        updateScore();

        if(
            playerScore>=7
        ){

            endGame(true);

        }else{

            resetPositions();

        }

    }


    updateParticles();

}


/* =========================================
   DRAW
========================================= */

function draw(){

    drawBackground();

    drawPaddle(
        player,
        "player"
    );

    drawPaddle(
        ai,
        "ai"
    );

    drawBall();

    drawParticles();

}


/* =========================================
   LOOP
========================================= */

function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );

}


/* =========================================
   KEYBOARD
========================================= */

const keys={};

addEventListener(
    "keydown",
    e=>{
        keys[e.key.toLowerCase()]=true;
    }
);

addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);


function keyboard(){

    if(!playing)
        return;

    if(
        keys["w"] ||
        keys["arrowup"]
    ){

        player.y-=paddle.speed;

    }

    if(
        keys["s"] ||
        keys["arrowdown"]
    ){

        player.y+=paddle.speed;

    }

    player.y=
    Math.max(
        0,
        Math.min(
            H-paddle.height,
            player.y
        )
    );

    requestAnimationFrame(
        keyboard
    );
}


/* =========================================
   MOBILE TOUCH
========================================= */

canvas.addEventListener(
    "pointermove",
    e=>{

        if(!playing)
            return;

        const rect=
        canvas.getBoundingClientRect();

        const y=
        e.clientY-
        rect.top;

        player.y=
        y-
        paddle.height/2;

        player.y=
        Math.max(
            0,
            Math.min(
                H-paddle.height,
                player.y
            )
        );

    }
);


/* =========================================
   SCORE
========================================= */

function updateScore(){

    document.getElementById(
        "playerScore"
    ).textContent=
    playerScore;

    document.getElementById(
        "aiScore"
    ).textContent=
    aiScore;
}


/* =========================================
   GAME START
========================================= */

function startGame(){

    playerScore=0;
    aiScore=0;

    updateScore();

    resetPositions();

    playing=true;

    document.getElementById(
        "startScreen"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "gameOver"
    ).classList.add(
        "hidden"
    );

    startSound();
}


/* =========================================
   GAME OVER
========================================= */

function endGame(
    playerWon
){

    playing=false;

    document.getElementById(
        "finalScore"
    ).textContent=
    playerScore+
    " - "+
    aiScore;

    document.getElementById(
        "resultTitle"
    ).textContent=
    playerWon
    ? "YOU WIN! 🏆"
    : "AI WINS 🤖";

    document.getElementById(
        "resultIcon"
    ).textContent=
    playerWon
    ? "🏆"
    : "🤖";

    document.getElementById(
        "gameOver"
    ).classList.remove(
        "hidden"
    );

    gameOverSound();
}


/* =========================================
   SOUND ENGINE
========================================= */

let audioCtx=null;

function audio(){

    if(!audioCtx){

        audioCtx=
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(
        audioCtx.state==="suspended"
    ){

        audioCtx.resume();

    }
}


function tone(
    frequency,
    duration,
    type="sine",
    volume=.07
){

    audio();

    const osc=
    audioCtx.createOscillator();

    const gain=
    audioCtx.createGain();

    osc.type=type;

    osc.frequency.value=
    frequency;

    gain.gain.setValueAtTime(
        .001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.02
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+
        duration
    );

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime+
        duration+.02
    );
}


function paddleSound(){

    tone(
        700,
        .07,
        "square",
        .05
    );

}


function wallSound(){

    tone(
        400,
        .05,
        "triangle",
        .04
    );

}


function scoreSound(
    player
){

    tone(
        player?900:300,
        .15,
        "sine",
        .08
    );

    setTimeout(
        ()=>{
            tone(
                player?1200:200,
                .18,
                "sine",
                .06
            );
        },
        100
    );

}


function startSound(){

    tone(
        400,
        .08
    );

    setTimeout(
        ()=>tone(
            600,
            .08
        ),
        100
    );

    setTimeout(
        ()=>tone(
            900,
            .15
        ),
        200
    );

}


function gameOverSound(){

    tone(
        500,
        .12
    );

    setTimeout(
        ()=>tone(
            300,
            .15
        ),
        120
    );

    setTimeout(
        ()=>tone(
            150,
            .35
        ),
        250
    );

}


/* =========================================
   BUTTONS
========================================= */

document.getElementById(
    "startBtn"
).onclick=startGame;

document.getElementById(
    "restartBtn"
).onclick=startGame;


/* =========================================
   INITIALIZE
========================================= */

resetPositions();

updateScore();

requestAnimationFrame(loop);

requestAnimationFrame(keyboard);

</script>

</body>
</html>
