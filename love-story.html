<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>❤️ प्रेमकथा पुस्तकालय</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
 margin:0;
 background:#f9e8ec;
 color:#40252d;
 font-family:"Noto Serif Devanagari","Nirmala UI",Georgia,serif;
 transition:.4s;
}

/* Floating hearts */
.hearts{
 position:fixed;
 inset:0;
 overflow:hidden;
 pointer-events:none;
 z-index:-1;
}
.heart{
 position:absolute;
 bottom:-50px;
 animation:float 8s linear forwards;
 opacity:.5;
}
@keyframes float{
 0%{transform:translateY(0) rotate(0);opacity:0}
 15%{opacity:.7}
 100%{transform:translateY(-110vh) rotate(360deg);opacity:0}
}

/* Header */
header{
 text-align:center;
 color:white;
 padding:45px 15px;
 background:linear-gradient(135deg,#7c1636,#d95d7e,#7c1636);
 box-shadow:0 8px 30px #7b244055;
}
header h1{
 margin:0;
 font-size:clamp(38px,8vw,68px);
 text-shadow:0 4px 15px #0005;
}
header p{opacity:.9}

.controls{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:8px;
 margin-top:20px;
}

button{
 border:0;
 border-radius:9px;
 padding:11px 15px;
 background:#fff;
 color:#7b2442;
 font-weight:bold;
 cursor:pointer;
}
button:hover{transform:translateY(-2px)}

/* Search */
.search{
 width:min(700px,92%);
 margin:25px auto 0;
 display:block;
 padding:15px 20px;
 border:0;
 border-radius:30px;
 outline:none;
 font-size:17px;
}

/* Library */
.library{
 width:min(1200px,94%);
 margin:35px auto;
}

.library h2{
 text-align:center;
 color:#9e284c;
 font-size:32px;
}

.filters{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:8px;
 margin:20px 0 30px;
}

/* Book cards */
.books{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:22px;
}

.card{
 background:#fffdfb;
 border:2px solid #e4a7b7;
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 10px 30px #7b244220;
 cursor:pointer;
 transition:.35s;
}

.card:hover{
 transform:translateY(-8px) scale(1.02);
 box-shadow:0 18px 40px #7b244240;
}

.cover{
 height:230px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
 padding:20px;
 color:white;
 background:linear-gradient(145deg,#7c1636,#d95d7e);
}

.cover .emoji{
 font-size:65px;
 margin-bottom:15px;
}

.cover h3{
 margin:0;
 font-size:23px;
}

.card-body{
 padding:17px;
}

.card-body p{
 color:#76515c;
 line-height:1.6;
}

.badge{
 display:inline-block;
 background:#f5d1dc;
 color:#922749;
 padding:5px 9px;
 border-radius:20px;
 font-size:13px;
}

/* Reader */
.reader{
 display:none;
 width:min(1000px,94%);
 margin:35px auto;
}

.book{
 background:#fffdfb;
 border:2px solid #e4a7b7;
 border-radius:18px;
 padding:clamp(25px,6vw,70px);
 box-shadow:0 12px 40px #7b244220;
}

.book-title{
 text-align:center;
 color:#9e284c;
 font-size:clamp(32px,7vw,55px);
}

.subtitle{
 text-align:center;
 color:#b75c76;
 margin-bottom:45px;
}

.chapter-title{
 text-align:center;
 color:#9e284c;
 border-bottom:2px solid #edb7c5;
 padding-bottom:18px;
}

.story{
 font-size:20px;
 line-height:2.05;
}

.story p{
 text-align:justify;
 margin:25px 0;
}

.quote{
 text-align:center!important;
 color:#a52c50;
 font-style:italic;
 font-weight:bold;
 margin:35px 8%!important;
}

.navigation{
 display:flex;
 gap:10px;
 margin-top:55px;
}

.navigation button{
 flex:1;
 background:#a52c50;
 color:white;
}

/* Dark */
body.dark{
 background:#180d12;
 color:#ead6dc;
}

body.dark .card,
body.dark .book{
 background:#25151c;
 border-color:#693143;
}

body.dark .card-body p{
 color:#d5b9c3;
}

body.dark .book-title,
body.dark .chapter-title,
body.dark .library h2{
 color:#f08ba8;
}

body.dark .subtitle{
 color:#d58ba1;
}

/* Mobile */
@media(max-width:700px){
 .books{
  grid-template-columns:repeat(2,1fr);
  gap:12px;
 }
 .cover{
  height:190px;
 }
 .cover .emoji{font-size:45px}
 .cover h3{font-size:18px}
 .story{
  font-size:18px;
  line-height:1.9;
 }
 .story p{text-align:left}
 .navigation{flex-direction:column}
}

@media(max-width:430px){
 .books{grid-template-columns:1fr}
 .cover{height:220px}
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<header>

<h1>❤️ प्रेमकथा पुस्तकालय</h1>

<p>
दस मौलिक प्रेमकथाहरू — एउटा डिजिटल पुस्तक संसार
</p>

<input
 id="search"
 class="search"
 type="search"
 placeholder="🔍 किताब खोज्नुहोस्..."
 oninput="searchBooks()"
>

<div class="controls">
<button onclick="toggleDark()">🌙 Dark Mode</button>
<button onclick="goHome()">🏠 Library</button>
<button onclick="changeFont(1)">A+</button>
<button onclick="changeFont(-1)">A−</button>
<button onclick="saveBookmark()">🔖 Bookmark</button>
<button onclick="continueBook()">📖 Continue</button>
</div>

</header>


<!-- LIBRARY -->

<section class="library" id="library">

<h2>📚 मेरा प्रेमकथाहरू</h2>

<div class="filters">
<button onclick="filterBooks('all')">सबै</button>
<button onclick="filterBooks('Romance')">Romance</button>
<button onclick="filterBooks('Emotional')">Emotional</button>
<button onclick="filterBooks('Cute')">Cute</button>
<button onclick="filterBooks('Long Distance')">Long Distance</button>
</div>

<div class="books" id="books"></div>

</section>


<!-- READER -->

<section class="reader" id="reader">

<div class="book">

<h1 id="bookTitle" class="book-title"></h1>

<div id="bookSubtitle" class="subtitle"></div>

<h2 id="chapterTitle" class="chapter-title"></h2>

<div id="story" class="story"></div>

<div class="navigation">

<button onclick="previousChapter()">
⬅️ अघिल्लो
</button>

<button onclick="nextChapter()">
अर्को ➡️
</button>

</div>

<br>

<button onclick="goHome()" style="width:100%">
🏠 पुस्तकालयमा फर्कनुहोस्
</button>

</div>

</section>

/* =========================================
   VARIABLES
========================================= */

let currentBook=0;
let currentChapter=0;
let font=20;
let currentFilter="all";


/* =========================================
   CREATE LIBRARY
========================================= */

function renderBooks(){

 const area=document.getElementById("books");

 area.innerHTML="";

 books.forEach((book,index)=>{

   const search=
   document.getElementById("search").value.toLowerCase();

   const matchesSearch=
   book.title.toLowerCase().includes(search) ||
   book.desc.toLowerCase().includes(search);

   const matchesFilter=
   currentFilter==="all" ||
   book.category===currentFilter;

   if(!matchesSearch || !matchesFilter)
   return;

   const card=document.createElement("div");

   card.className="card";

   card.innerHTML=`
   <div class="cover">
     <div class="emoji">${book.emoji}</div>
     <h3>${book.title}</h3>
   </div>

   <div class="card-body">
     <span class="badge">${book.category}</span>
     <p>${book.desc}</p>
     <button onclick="openBook(${index})">
       📖 पढ्न सुरु गर्नुहोस्
     </button>
   </div>
   `;

   area.appendChild(card);

 });

}


/* =========================================
   OPEN BOOK
========================================= */

function openBook(index){

 currentBook=index;
 currentChapter=0;

 document.getElementById("library")
 .style.display="none";

 document.getElementById("reader")
 .style.display="block";

 showChapter();

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

}


/* =========================================
   SHOW CHAPTER
========================================= */

function showChapter(){

 const book=books[currentBook];
 const chapter=book.chapters[currentChapter];

 document.getElementById("bookTitle")
 .textContent=book.emoji+" "+book.title;

 document.getElementById("bookSubtitle")
 .textContent=
 book.category+" • "+book.chapters.length+" अध्याय";

 document.getElementById("chapterTitle")
 .textContent=
 "अध्याय "+(currentChapter+1)+" — "+chapter[0];

 document.getElementById("story")
 .innerHTML=chapter[1];

 document.getElementById("story")
 .style.fontSize=font+"px";

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

}


/* =========================================
   NEXT / PREVIOUS
========================================= */

function nextChapter(){

 const book=books[currentBook];

 if(currentChapter < book.chapters.length-1){

   currentChapter++;
   showChapter();

 }else{

   if(currentBook < books.length-1){

     if(confirm(
       "यो किताब पूरा भयो ❤️\n\nअर्को किताब खोल्ने?"
     )){
       openBook(currentBook+1);
     }

   }else{

     alert(
       "🎉 तपाईंले सबै किताब पढिसक्नुभयो!"
     );

   }

 }

}


function previousChapter(){

 if(currentChapter>0){

   currentChapter--;
   showChapter();

 }

}


/* =========================================
   HOME
========================================= */

function goHome(){

 document.getElementById("reader")
 .style.display="none";

 document.getElementById("library")
 .style.display="block";

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

}


/* =========================================
   SEARCH
========================================= */

function searchBooks(){

 renderBooks();

}


/* =========================================
   FILTER
========================================= */

function filterBooks(category){

 currentFilter=category;

 renderBooks();

}


/* =========================================
   DARK MODE
========================================= */

function toggleDark(){

 document.body.classList.toggle("dark");

}


/* =========================================
   FONT SIZE
========================================= */

function changeFont(value){

 font+=value;

 if(font<15) font=15;
 if(font>34) font=34;

 document.getElementById("story")
 .style.fontSize=font+"px";

}


/* =========================================
   BOOKMARK
========================================= */

function saveBookmark(){

 localStorage.setItem(
  "loveBook",
  currentBook
 );

 localStorage.setItem(
  "loveChapter",
  currentChapter
 );

 alert("🔖 Bookmark सुरक्षित भयो!");

}


function continueBook(){

 const b=
 localStorage.getItem("loveBook");

 const c=
 localStorage.getItem("loveChapter");

 if(b!==null){

   currentBook=Number(b);
   currentChapter=Number(c||0);

   document.getElementById("library")
   .style.display="none";

   document.getElementById("reader")
   .style.display="block";

   showChapter();

 }else{

   alert(
    "अहिलेसम्म कुनै Bookmark छैन।"
   );

 }

}


/* =========================================
   FLOATING HEARTS
========================================= */

function createHeart(){

 const heart=
 document.createElement("div");

 heart.className="heart";

 heart.textContent=
 ["❤️","💕","💗","💖","💘","🌹"]
 [Math.floor(Math.random()*6)];

 heart.style.left=
 Math.random()*100+"%";

 heart.style.fontSize=
 (18+Math.random()*25)+"px";

 heart.style.animationDuration=
 (5+Math.random()*6)+"s";

 document.getElementById("hearts")
 .appendChild(heart);

 setTimeout(()=>{
  heart.remove();
 },11000);

}


/* START */

renderBooks();

setInterval(createHeart,700);

</script>
