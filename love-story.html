.hearts{

}

.heart{
    position:absolute;
    bottom:-50px;
    font-size:25px;
    animation:rise linear infinite;
    opacity:.7;
}

@keyframes rise{
    from{
        transform:translateY(0) rotate(0);
        opacity:0;
    }
    20%{

    }
    to{

.search{
