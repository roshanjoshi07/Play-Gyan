<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Temple Runner</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  overflow:hidden;
  background:#07120c;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    linear-gradient(#70b9e0 0%,#c5e7e8 32%,#355e39 32%,#172d19 100%);
}

/* ================= SKY ================= */

.sky{
  position:absolute;
  inset:0 0 55% 0;
  background:
    radial-gradient(circle at 70% 20%,#fff6b5 0 4%,transparent 5%),
    linear-gradient(#63b4df,#c9e8e6);
}

.mountain{
  position:absolute;
  bottom:0;
  width:0;
  height:0;
  border-left:160px solid transparent;
  border-right:160px solid transparent;
  border-bottom:210px solid #315b45;
}

.m1{left:-100px}
.m2{left:30%;transform:scale(1.3)}
.m3{right:-120px;transform:scale(1.1)}

/* ================= TEMPLE ================= */

.temple{
  position:absolute;
  left:50%;
  top:11%;
  transform:translateX(-50%);
  width:230px;
  height:150px;
  z-index:2;
}

.temple-roof{
  position:absolute;
  left:0;
  top:0;
  width:230px;
  height:42px;
  background:#9c6937;
  clip-path:polygon(50% 0,100% 100%,0 100%);
}

.temple-body{
  position:absolute;
  left:35px;
  top:37px;
  width:160px;
  height:113px;
  background:#b98b54;
  border:6px solid #79522e;
}

.temple-door{
  position:absolute;
  left:62px;
  bottom:0;
  width:35px;
  height:65px;
  background:#27180d;
  border-radius:30px 30px 0 0;
}

.pillar{
  position:absolute;
  bottom:0;
  width:18px;
  height:90px;
  background:#d2aa70;
}

.pillar.left{left:43px}
.pillar.right{right:43px}

/* ================= ROAD ================= */

.road{
  position:absolute;
  left:50%;
  top:28%;
  width:100%;
  height:75%;
  transform:translateX(-50%);
  background:
    linear-gradient(
      90deg,
      transparent 0 14%,
      #8e6b3d 14% 16%,
      #51371e 16% 18%,
      #664823 18% 82%,
      #51371e 82% 84%,
      #8e6b3d 84% 86%,
      transparent 86%
    );
  clip-path:polygon(
    42% 0,
    58% 0,
    100% 100%,
    0 100%
  );
  z-index:3;
}

.road-inner{
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      0deg,
      #70502a 0 32px,
      #79572f 33px 35px
    );
  opacity:.55;
  clip-path:polygon(
    42% 0,
    58% 0,
    100% 100%,
    0 100%
  );
}

/* ================= LANE GUIDES ================= */

.lane{
  position:absolute;
  top:28%;
  height:72%;
  width:3px;
  background:#ffffff20;
  z-index:4;
}

.lane.l1{
  left:calc(50% - 9vw);
}

.lane.l2{
  left:50%;
}

.lane.l3{
  left:calc(50% + 9vw);
}

/* ================= WORLD OBJECTS ================= */

.world{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}

.object{
  position:absolute;
  transform:translate(-50%,-50%);
  font-size:42px;
  filter:drop-shadow(0 7px 4px #0008);
}

.tree{
  font-size:70px;
}

.torch{
  font-size:42px;
}

.rock{
  font-size:45px;
}

/* ================= HUD ================= */

.hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  z-index:50;
  display:flex;
  justify-content:space-between;
  gap:7px;
}

.hud-box{
  min-width:82px;
  padding:7px 11px;
  border-radius:12px;
  background:#07130ddd;
  color:#fff;
  border:1px solid #ffffff22;
  box-shadow:0 4px 15px #0006;
  text-align:center;
  font-size:12px;
}

.hud-box b{
  display:block;
  color:#ffd85d;
  font-size:18px;
}

/* ================= PLAYER ================= */

#player{
  position:absolute;
  left:50%;
  bottom:14%;
  width:58px;
  height:100px;
  transform:translateX(-50%);
  z-index:30;
  transition:left .13s ease;
}

.player-shadow{
  position:absolute;
  bottom:-5px;
  left:50%;
  transform:translateX(-50%);
  width:55px;
  height:13px;
  border-radius:50%;
  background:#0008;
  filter:blur(2px);
}

.head{
  position:absolute;
  left:50%;
  top:0;
  transform:translateX(-50%);
  width:30px;
  height:30px;
  border-radius:50%;
  background:#9b5d38;
  border:2px solid #402516;
}

.hair{
  position:absolute;
  left:50%;
  top:-3px;
  transform:translateX(-50%);
  width:32px;
  height:15px;
  border-radius:20px 20px 8px 8px;
  background:#24160f;
}

.body{
  position:absolute;
  left:50%;
  top:28px;
  transform:translateX(-50%);
  width:34px;
  height:42px;
  border-radius:9px 9px 5px 5px;
  background:linear-gradient(90deg,#8a3e20,#d46c2d,#8a3e20);
  border:2px solid #492012;
}

.arm{
  position:absolute;
  top:32px;
  width:12px;
  height:40px;
  border-radius:10px;
  background:#9b5d38;
}

.arm.left{
  left:3px;
  transform:rotate(18deg);
}

.arm.right{
  right:3px;
  transform:rotate(-18deg);
}

.leg{
  position:absolute;
  top:67px;
  width:14px;
  height:34px;
  border-radius:7px;
  background:#222;
}

.leg.left{left:14px}
.leg.right{right:14px}

.runner-run .leg.left{
  animation:runA .15s infinite alternate;
}

.runner-run .leg.right{
  animation:runB .15s infinite alternate;
}

.runner-run .arm.left{
  animation:armA .15s infinite alternate;
}

.runner-run .arm.right{
  animation:armB .15s infinite alternate;
}

@keyframes runA{
  from{transform:rotate(25deg)}
  to{transform:rotate(-25deg)}
}

@keyframes runB{
  from{transform:rotate(-25deg)}
  to{transform:rotate(25deg)}
}

@keyframes armA{
  from{transform:rotate(-25deg)}
  to{transform:rotate(25deg)}
}

@keyframes armB{
  from{transform:rotate(25deg)}
  to{transform:rotate(-25deg)}
}

.jump{
  animation:jump .55s ease-out;
}

@keyframes jump{
  0%{bottom:14%}
  50%{bottom:32%}
  100%{bottom:14%}
}

.slide{
  transform:translateX(-50%) scaleY(.55);
  transform-origin:bottom;
}

/* ================= OBJECTS COMING FROM FRONT ================= */

.obstacle,
.coin,
.power{
  position:absolute;
  z-index:20;
  left:50%;
  top:30%;
  transform:translate(-50%,-50%) scale(.15);
  transition:none;
  pointer-events:none;
}

.obstacle{
  font-size:48px;
  filter:drop-shadow(0 7px 4px #0009);
}

.coin{
  font-size:38px;
  filter:
    drop-shadow(0 0 7px #ffe25b)
    drop-shadow(0 7px 4px #0007);
}

.power{
  font-size:42px;
}

/* ================= GHOST ================= */

#ghost{
  position:absolute;
  left:50%;
  bottom:4%;
  transform:translateX(-50%);
  z-index:29;
  display:none;
  font-size:72px;
  filter:
    drop-shadow(0 0 15px #8b7cff)
    drop-shadow(0 5px 5px #000);
  animation:ghostMove .55s infinite alternate;
}

@keyframes ghostMove{
  from{bottom:3%}
  to{bottom:8%}
}

/* ================= MESSAGE ================= */

#message{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:100;
  width:min(90%,440px);
  padding:25px;
  border-radius:20px;
  background:#06140deF;
  border:1px solid #ffd65a55;
  text-align:center;
  box-shadow:0 15px 50px #0009;
}

#message h1{
  color:#ffd45c;
  margin-bottom:10px;
}

#message p{
  color:#cbded3;
  line-height:1.6;
}

.btn{
  margin-top:15px;
  padding:12px 25px;
  border:0;
  border-radius:12px;
  background:linear-gradient(#ffe77c,#bd8e28);
  color:#171008;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 4px 0 #674b14;
}

.btn:active{
  transform:translateY(2px);
}

/* ================= CONTROLS ================= */

.controls{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:60;
  display:flex;
  gap:9px;
}

.control{
  width:55px;
  height:55px;
  border-radius:50%;
  border:1px solid #ffffff35;
  background:#07180fe8;
  color:#fff;
  font-size:22px;
  box-shadow:0 5px 15px #0008;
}

.control:active{
  background:#b5862c;
}

/* ================= FLASH ================= */

#flash{
  position:absolute;
  inset:0;
  z-index:90;
  background:#ff202033;
  pointer-events:none;
  display:none;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .hud-box{
    min-width:65px;
    padding:6px;
    font-size:10px;
  }

  .hud-box b{
    font-size:15px;
  }

  #player{
    width:48px;
    height:88px;
  }

  .head{
    width:26px;
    height:26px;
  }

  .body{
    width:30px;
    height:38px;
  }

  .road{
    top:29%;
  }

  .lane{
    top:29%;
  }
}
</style>
</head>

<body>

<div id="game">

  <div class="sky"></div>

  <div class="mountain m1"></div>
  <div class="mountain m2"></div>
  <div class="mountain m3"></div>

  <div class="temple">
    <div class="temple-roof"></div>
    <div class="temple-body"></div>
    <div class="temple-door"></div>
    <div class="pillar left"></div>
    <div class="pillar right"></div>
  </div>

  <div class="road">
    <div class="road-inner"></div>
  </div>

  <div class="lane l1"></div>
  <div class="lane l2"></div>
  <div class="lane l3"></div>

  <div class="world" id="world"></div>

  <div id="flash"></div>

  <!-- HUD -->

  <div class="hud">

    <div class="hud-box">
      SCORE
      <b id="score">0</b>
    </div>

    <div class="hud-box">
      COINS
      <b id="coins">0</b>
    </div>

    <div class="hud-box">
      SPEED
      <b id="speed">1.0x</b>
    </div>

    <div class="hud-box">
      DISTANCE
      <b id="distance">0m</b>
    </div>

  </div>


  <!-- PLAYER -->

  <div id="player" class="runner-run">

    <div class="player-shadow"></div>

    <div class="hair"></div>
    <div class="head"></div>

    <div class="body"></div>

    <div class="arm left"></div>
    <div class="arm right"></div>

    <div class="leg left"></div>
    <div class="leg right"></div>

  </div>


  <!-- GHOST CHASER -->

  <div id="ghost">👻</div>


  <!-- MESSAGE -->

  <div id="message">

    <h1>🏛️ TEMPLE RUNNER</h1>

    <p>
      Run through the ancient temple.<br>
      Change lanes, jump over obstacles,<br>
      collect coins and survive as long as possible.
    </p>

    <button class="btn" onclick="startGame()">
      ▶ START RUN
    </button>

  </div>


  <!-- MOBILE CONTROLS -->

  <div class="controls">

    <button
      class="control"
      onclick="moveLeft()">
      ◀
    </button>

    <button
      class="control"
      onclick="jump()">
      ▲
    </button>

    <button
      class="control"
      onclick="slide()">
      ▼
    </button>

    <button
      class="control"
      onclick="moveRight()">
      ▶
    </button>

  </div>

</div>


<script>

/* =====================================================
   TEMPLE RUNNER
   ORIGINAL ENDLESS RUNNER
   ===================================================== */

const world =
  document.getElementById("world");

const player =
  document.getElementById("player");

const ghost =
  document.getElementById("ghost");

const messageBox =
  document.getElementById("message");

const flash =
  document.getElementById("flash");

let running=false;

let gameOver=false;

let lane=1;

let score=0;

let coins=0;

let distance=0;

let speed=0.42;

let objects=[];

let lastTime=0;

let spawnTimer=0;

let worldTimer=0;

let ghostDistance=0;

let audio=null;


/* =====================================================
   AUDIO
   ===================================================== */

function beep(
  frequency=500,
  duration=.08,
  type="sine"
){

  try{

    if(!audio){

      audio =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    const osc =
      audio.createOscillator();

    const gain =
      audio.createGain();

    osc.type=type;

    osc.frequency.value=
      frequency;

    gain.gain.setValueAtTime(
      .08,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();

    osc.stop(
      audio.currentTime+duration
    );

  }catch(e){}

}


/* =====================================================
   START
   ===================================================== */

function startGame(){

  if(!audio){

    try{
      audio =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();
    }catch(e){}

  }

  running=true;

  gameOver=false;

  score=0;

  coins=0;

  distance=0;

  speed=.42;

  lane=1;

  objects=[];

  world.innerHTML="";

  ghost.style.display="none";

  ghostDistance=0;

  messageBox.style.display="none";

  player.classList.add(
    "runner-run"
  );

  updateHUD();

  lastTime=
    performance.now();

  requestAnimationFrame(
    gameLoop
  );

}


/* =====================================================
   GAME LOOP
   ===================================================== */

function gameLoop(time){

  if(!running)
    return;

  const dt =
    Math.min(
      32,
      time-lastTime
    );

  lastTime=time;

  distance +=
    speed*dt*.055;

  score +=
    speed*dt*.025;

  /*
    Gradually increase speed.
  */

  speed +=
    dt*.000008;

  spawnTimer += dt;

  worldTimer += dt;

  /*
    Spawn objects from the FRONT.
    They start far away and move
    toward the player.
  */

  if(
    spawnTimer >
    Math.max(
      550,
      1100-speed*500
    )
  ){

    spawnObject();

    spawnTimer=0;

  }


  updateObjects(dt);

  updateWorld(dt);

  updateHUD();

  requestAnimationFrame(
    gameLoop
  );

}


/* =====================================================
   SPAWN OBJECT
   ===================================================== */

function spawnObject(){

  /*
    Never spawn too many impossible
    obstacles at the same time.
  */

  const random =
    Math.random();

  let type="obstacle";

  if(random<.45)
    type="coin";

  else if(random<.52)
    type="power";

  const object =
    document.createElement("div");

  object.className=type;

  const selectedLane =
    Math.floor(
      Math.random()*3
    );

  /*
    Obstacles:
    jumpable rocks / logs / pillars
  */

  if(type==="obstacle"){

    const choices=[
      "🪨",
      "🪵",
      "🏛️"
    ];

    object.textContent =
      choices[
        Math.floor(
          Math.random()*choices.length
        )
      ];

    object.dataset.kind="obstacle";

  }

  if(type==="coin"){

    object.textContent="🪙";

    object.dataset.kind="coin";

  }

  if(type==="power"){

    object.textContent="⚡";

    object.dataset.kind="power";

  }

  object.dataset.lane=
    selectedLane;

  /*
    Objects begin far away.
    This is the important part:
    they come FROM AHEAD, not from behind.
  */

  object.dataset.z=0;

  world.appendChild(object);

  objects.push(object);

}


/* =====================================================
   UPDATE OBJECTS
   ===================================================== */

function updateObjects(dt){

  for(
    let i=objects.length-1;
    i>=0;
    i--
  ){

    const obj=
      objects[i];

    let z=
      parseFloat(
        obj.dataset.z
      );

    /*
      Increase depth.
      Larger z = closer to player.
    */

    z +=
      speed*
      dt*
      .00082;

    obj.dataset.z=z;

    /*
      Perspective scaling.
    */

    const scale =
      .18+
      z*1.8;

    /*
      Position gets lower as object
      approaches the player.
    */

    const top =
      31+
      z*62;

    /*
      Lane positions become wider
      toward the player.
    */

    const laneIndex =
      Number(
        obj.dataset.lane
      );

    const laneOffset =
      [-1,0,1][laneIndex];

    const x =
      50+
      laneOffset*
      (5+z*22);

    obj.style.left=
      x+"%";

    obj.style.top=
      top+"%";

    obj.style.transform=
      `translate(-50%,-50%)
       scale(${scale})`;

    /*
      Collision zone.
    */

    if(
      z>.86 &&
      z<1.08
    ){

      if(
        laneIndex===lane
      ){

        const kind=
          obj.dataset.kind;

        /*
          Coins are collected.
        */

        if(kind==="coin"){

          coins++;

          score+=50;

          beep(
            850,
            .08,
            "triangle"
          );

          removeObject(i);

          continue;

        }

        /*
          Power gives temporary score boost.
        */

        if(kind==="power"){

          score+=150;

          beep(
            1100,
            .12,
            "square"
          );

          removeObject(i);

          continue;

        }

        /*
          Obstacle collision:
          if player is NOT jumping/sliding.
        */

        if(
          !player.classList.contains(
            "jump"
          ) &&
          !player.classList.contains(
            "slide"
          )
        ){

          hitObstacle();

          return;

        }

      }

    }

    /*
      Remove after passing player.
    */

    if(z>1.18){

      removeObject(i);

    }

  }

}


/* =====================================================
   REMOVE
   ===================================================== */

function removeObject(index){

  const obj=
    objects[index];

  if(obj)
    obj.remove();

  objects.splice(
    index,
    1
  );

}


/* =====================================================
   WORLD ANIMATION
   ===================================================== */

function updateWorld(dt){

  /*
    Small moving dust particles
    to create forward motion.
  */

  if(
    worldTimer>140
  ){

    worldTimer=0;

    const dust=
      document.createElement(
        "div"
      );

    dust.className="object";

    dust.textContent=
      Math.random()<.5
      ? "🌿"
      : "🪨";

    const side =
      Math.random()<.5
      ? -1
      : 1;

    dust.style.left=
      (50+side*
      (25+Math.random()*25))
      +"%";

    dust.style.top=
      (42+Math.random()*35)
      +"%";

    dust.style.fontSize=
      (18+
      Math.random()*22)
      +"px";

    world.appendChild(dust);

    setTimeout(
      ()=>dust.remove(),
      900
    );

  }

}


/* =====================================================
   MOVE LEFT
   ===================================================== */

function moveLeft(){

  if(!running)
    return;

  if(lane>0){

    lane--;

    beep(
      330,
      .06,
      "square"
    );

  }

}


/* =====================================================
   MOVE RIGHT
   ===================================================== */

function moveRight(){

  if(!running)
    return;

  if(lane<2){

    lane++;

    beep(
      330,
      .06,
      "square"
    );

  }

}


/* =====================================================
   JUMP
   ===================================================== */

function jump(){

  if(!running)
    return;

  if(
    player.classList.contains(
      "jump"
    )
  )
    return;

  player.classList.add(
    "jump"
  );

  beep(
    600,
    .08,
    "triangle"
  );

  setTimeout(
    ()=>{
      player.classList.remove(
        "jump"
      );
    },
    550
  );

}


/* =====================================================
   SLIDE
   ===================================================== */

function slide(){

  if(!running)
    return;

  if(
    player.classList.contains(
      "slide"
    )
  )
    return;

  player.classList.add(
    "slide"
  );

  beep(
    250,
    .07,
    "sawtooth"
  );

  setTimeout(
    ()=>{
      player.classList.remove(
        "slide"
      );
    },
    480
  );

}


/* =====================================================
   HIT OBSTACLE
   ===================================================== */

function hitObstacle(){

  if(gameOver)
    return;

  gameOver=true;

  running=false;

  player.classList.remove(
    "runner-run"
  );

  /*
    Red hit flash.
  */

  flash.style.display="block";

  setTimeout(
    ()=>{
      flash.style.display="none";
    },
    180
  );

  beep(
    100,
    .35,
    "sawtooth"
  );

  /*
    Ghost appears from behind.
  */

  ghost.style.display="block";

  ghostDistance=1;

  messageBox.style.display=
    "block";

  messageBox.innerHTML=`

    <h1>👻 CAUGHT!</h1>

    <p>
      The temple guardian caught you.
      <br><br>

      🏆 Score:
      <b>${Math.floor(score)}</b>
      <br>

      🪙 Coins:
      <b>${coins}</b>
      <br>

      📏 Distance:
      <b>${Math.floor(distance)}m</b>
    </p>

    <button
      class="btn"
      onclick="startGame()">
      🔄 RUN AGAIN
    </button>

  `;

}


/* =====================================================
   HUD
   ===================================================== */

function updateHUD(){

  document.getElementById(
    "score"
  ).innerText=
    Math.floor(score);

  document.getElementById(
    "coins"
  ).innerText=
    coins;

  document.getElementById(
    "speed"
  ).innerText=
    (1+
      (speed-.42)*3
    ).toFixed(1)+"x";

  document.getElementById(
    "distance"
  ).innerText=
    Math.floor(distance)+"m";

/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      moveLeft();

    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      moveRight();

    }

    if(
      e.key==="ArrowUp" ||
      e.key===" "
    ){

      e.preventDefault();

      jump();

    }

    if(
      e.key==="ArrowDown" ||
      e.key.toLowerCase()==="s"
    ){

      slide();

    }

  }
);


/* =====================================================
   MOBILE SWIPE
   ===================================================== */

let touchStartX=0;
let touchStartY=0;

document.addEventListener(
  "touchstart",
  e=>{

    const t=
      e.changedTouches[0];

    touchStartX=t.clientX;
    touchStartY=t.clientY;

  },
  {passive:true}
);

document.addEventListener(
  "touchend",
  e=>{

    const t=
      e.changedTouches[0];

    const dx=
      t.clientX-touchStartX;

    const dy=
      t.clientY-touchStartY;

    const ax=
      Math.abs(dx);

    const ay=
      Math.abs(dy);

    /*
      Ignore tiny taps.
    */

    if(
      Math.max(ax,ay)<30
    )
      return;

    if(ax>ay){

      if(dx>0)
        moveRight();
      else
        moveLeft();

    }
    else{

      if(dy<0)
        jump();
      else
        slide();

    }

  },
  {passive:true}
);


/* =====================================================
   PREVENT PAGE SCROLL
   ===================================================== */

document.addEventListener(
  "touchmove",
  e=>{
    e.preventDefault();
  },
  {passive:false}
);

</script>
