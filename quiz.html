<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultimate GK Quiz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    color:white;

    background:
    radial-gradient(
        circle at top,
        #312e81,
        #111827 45%,
        #020617
    );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.game{
    width:min(700px,100%);
}

/* HEADER */

.title{
    text-align:center;
    margin-bottom:20px;
}

.title h1{
    font-size:40px;

    background:
    linear-gradient(
        90deg,
        #22d3ee,
        #818cf8,
        #f472b6
    );

    -webkit-background-clip:text;
    color:transparent;
}

.title p{
    color:#94a3b8;
    margin-top:6px;
}


/* STATS */

.stats{
    display:grid;
    grid-template-columns:
    repeat(3,1fr);

    gap:10px;

    margin-bottom:15px;
}

.stat{
    background:#0f172acc;

    border:1px solid #ffffff15;

    border-radius:16px;

    padding:12px;

    text-align:center;
}

.stat small{
    display:block;
    color:#94a3b8;
}

.stat strong{
    font-size:22px;
}


/* CARD */

.card{
    background:#0f172aee;

    border:
    1px solid #ffffff18;

    border-radius:25px;

    padding:25px;

    box-shadow:
    0 25px 70px #0009;

    animation:
    cardIn .5s ease;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:
        translateY(30px)
        scale(.97);
    }

    to{
        opacity:1;
        transform:
        translateY(0)
        scale(1);
    }
}


/* CATEGORY */

.category{
    text-align:center;

    color:#38bdf8;

    font-weight:bold;

    margin-bottom:15px;
}


/* QUESTION */

.question{
    min-height:130px;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:25px;

    font-weight:bold;

    padding:20px;

    border-radius:20px;

    background:
    linear-gradient(
        145deg,
        #1e293b,
        #111827
    );

    margin-bottom:20px;
}


/* OPTIONS */

.options{
    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:12px;
}

.option{

    min-height:65px;

    border:1px solid #ffffff15;

    border-radius:15px;

    background:#172033;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

    padding:10px;
}

.option:hover{

    transform:
    translateY(-3px);

    background:#263552;

}

.option.correct{

    background:#166534;

    border-color:#22c55e;

    animation:
    correct .4s;
}

.option.wrong{

    background:#7f1d1d;

    border-color:#ef4444;

    animation:
    shake .4s;
}

@keyframes correct{

    50%{
        transform:
        scale(1.06);
    }
}

@keyframes shake{

    20%{
        transform:
        translateX(-8px);
    }

    40%{
        transform:
        translateX(8px);
    }

    60%{
        transform:
        translateX(-5px);
    }

    80%{
        transform:
        translateX(5px);
    }
}


/* MESSAGE */

.message{

    min-height:30px;

    text-align:center;

    margin-top:15px;

    font-weight:bold;
}


/* NEXT */

.next{

    display:none;

    width:100%;

    margin-top:15px;

    padding:14px;

    border:0;

    border-radius:15px;

    color:white;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

.next.show{
    display:block;
}


/* GAME OVER */

.gameover{
    display:none;

    text-align:center;
}

.gameover.show{
    display:block;

    animation:
    cardIn .5s;
}

.gameover .emoji{
    font-size:70px;
}

.gameover h2{
    font-size:38px;

    margin:10px 0;
}

.restart{

    width:100%;

    padding:15px;

    margin-top:20px;

    border:0;

    border-radius:15px;

    background:
    linear-gradient(
        135deg,
        #ec4899,
        #7c3aed
    );

    color:white;

    font-weight:bold;

    font-size:17px;

    cursor:pointer;
}


/* MOBILE */

@media(max-width:550px){

    .title h1{
        font-size:32px;
    }

    .question{
        font-size:21px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .card{
        padding:17px;
    }

}

</style>
</head>

/* =========================================
VARIABLES
========================================= */

let current=0;

let score=0;

let lives=3;

let wrongStreak=0;

let answered=false;


/* =========================================
ELEMENTS
========================================= */

const question=
document.getElementById("question");

const options=
document.getElementById("options");

const category=
document.getElementById("category");

const message=
document.getElementById("message");

const next=
document.getElementById("next");


/* =========================================
SHUFFLE
========================================= */

function shuffle(array){

return array
.map(value=>({
value:value,
sort:Math.random()
}))
.sort((a,b)=>a.sort-b.sort)
.map(({value})=>value);

}


/* =========================================
LOAD QUESTION
========================================= */

function loadQuestion(){

answered=false;

message.textContent="";

next.classList.remove("show");

if(current>=questions.length){

endGame();

return;

}

const item=
questions[current];

category.textContent=
item.cat;

question.textContent=
item.q;

options.innerHTML="";

const answers=
shuffle(item.a);

answers.forEach(answer=>{

const button=
document.createElement("button");

button.className="option";

button.textContent=answer;

button.onclick=()=>{

checkAnswer(
button,
answer,
item.c
);

};

options.appendChild(button);

});

}


/* =========================================
CHECK ANSWER
========================================= */

function checkAnswer(
button,
answer,
correct
){

if(answered)
return;

answered=true;

const all=
document.querySelectorAll(
".option"
);

all.forEach(btn=>{

btn.disabled=true;

if(
btn.textContent===
correct
){

btn.classList.add(
"correct"
);

}

});


if(answer===correct){

button.classList.add(
"correct"
);

score+=10;

wrongStreak=0;

message.style.color=
"#4ade80";

message.textContent=
"🎉 सही उत्तर! +10 Points";

playSound(800);

}

else{

button.classList.add(
"wrong"
);

wrongStreak++;

lives--;

updateLives();

message.style.color=
"#f87171";

message.textContent=
"❌ गलत उत्तर!";

playSound(250);


/*
IMPORTANT:

३ वटा गलत लगातार
भए GAME OVER
*/

if(wrongStreak>=3){

setTimeout(
endGame,
700
);

return;

}

}

document.getElementById(
"score"
).textContent=
score;

document.getElementById(
"wrong"
).textContent=
wrongStreak+" / 3";

next.classList.add("show");

}


/* =========================================
LIVES
========================================= */

function updateLives(){

let hearts="";

for(
let i=0;
i<3;
i++
){

hearts +=
i<lives
?
"❤️"
:
"🖤";

}

document.getElementById(
"lives"
).textContent=
hearts;

}


/* =========================================
NEXT QUESTION
========================================= */

next.onclick=function(){

current++;

loadQuestion();

};


/* =========================================
GAME OVER
========================================= */

function endGame(){

document.getElementById(
"quizCard"
).style.display=
"none";

const over=
document.getElementById(
"gameover"
);

over.classList.add("show");

document.getElementById(
"gameoverText"
).textContent=
`Game Over! तपाईंको Score ${score} हो। तपाईंले लगातार ३ वटा गलत उत्तर दिनुभयो।`;

playSound(150);

}


/* =========================================
RESTART
========================================= */

function restartGame(){

current=0;

score=0;

lives=3;

wrongStreak=0;

answered=false;

document.getElementById(
"score"
).textContent="0";

document.getElementById(
"wrong"
).textContent="0 / 3";

updateLives();

document.getElementById(
"quizCard"
).style.display=
"block";

document.getElementById(
"gameover"
).classList.remove(
"show"
);

loadQuestion();

}


/* =========================================
SOUND
========================================= */

let audioContext;

function playSound(freq){

try{

if(!audioContext){

audioContext=
new(
window.AudioContext ||
window.webkitAudioContext
)();

}

const oscillator=
audioContext.createOscillator();

const gain=
audioContext.createGain();

oscillator.type=
"sine";

oscillator.frequency.value=
freq;

gain.gain.value=
0.06;

oscillator.connect(gain);

gain.connect(
audioContext.destination
);

oscillator.start();

oscillator.stop(
audioContext.currentTime+
0.15
);

}catch(e){}

}


/* =========================================
START
========================================= */

updateLives();

loadQuestion();

</script>
