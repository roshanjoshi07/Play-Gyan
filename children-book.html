<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🌈 बालकथा संसार</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#fff8e8;
    color:#3f3428;
    font-family:"Noto Serif Devanagari","Nirmala UI",Georgia,serif;
}

header{
    text-align:center;
    padding:45px 15px;
    color:white;
    background:linear-gradient(135deg,#ff7eb3,#ffb347,#65d6ff,#83d889);
}

header h1{
    margin:0;
    font-size:clamp(38px,8vw,68px);
    text-shadow:0 4px 12px #0003;
}

header p{
    font-size:18px;
}

.search{
    width:min(700px,92%);
    padding:15px 20px;
    border:0;
    border-radius:30px;
    font-size:17px;
    outline:none;
    margin-top:18px;
}

.controls,.filters{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
}

button{
    border:0;
    padding:11px 15px;
    border-radius:10px;
    background:white;
    color:#554638;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 15px #0002;
}

.library{
    width:min(1200px,94%);
    margin:35px auto;
}

.library h2{
    text-align:center;
    color:#e56b6f;
    font-size:32px;
}

.books{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:22px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 25px #0002;
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.cover{
    height:230px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:20px;
}

.card:nth-child(4n+1) .cover{
    background:linear-gradient(135deg,#ff7eb3,#ff758c);
}

.card:nth-child(4n+2) .cover{
    background:linear-gradient(135deg,#70d6ff,#5b9df9);
}

.card:nth-child(4n+3) .cover{
    background:linear-gradient(135deg,#83d889,#43b883);
}

.card:nth-child(4n) .cover{
    background:linear-gradient(135deg,#ffcf70,#ff9f43);
}

.emoji{
    font-size:65px;
}

.cover h3{
    margin:10px 0 0;
    font-size:22px;
}

.card-body{
    padding:17px;
}

.card-body p{
    line-height:1.7;
    color:#746457;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    background:#fff0c7;
    color:#946615;
    font-size:13px;
}

.card-body button{
    width:100%;
    margin-top:8px;
    background:#fff0c7;
}

.reader{
    display:none;
    width:min(1000px,94%);
    margin:35px auto;
}

.book{
    background:#fff;
    border:3px solid #ffe0a3;
    border-radius:20px;
    padding:clamp(25px,6vw,70px);
    box-shadow:0 10px 40px #0002;
}

.bookTitle{
    text-align:center;
    color:#e56b6f;
    font-size:clamp(32px,7vw,55px);
}

.subtitle{
    text-align:center;
    color:#987d66;
    margin-bottom:45px;
}

.chapterTitle{
    text-align:center;
    color:#428ac2;
    border-bottom:2px dashed #ffd37a;
    padding-bottom:18px;
}

.story{
    font-size:20px;
    line-height:2.05;
}

.story p{
    margin:25px 0;
    text-align:justify;
}

.moral{
    background:#fff3c9;
    border-radius:15px;
    padding:20px;
    text-align:center!important;
    color:#80621d;
    font-weight:bold;
}

.navigation{
    display:flex;
    gap:10px;
    margin-top:50px;
}

.navigation button{
    flex:1;
    background:#65addc;
    color:white;
}

.dark{
    background:#17151b;
    color:#eee;
}

.dark .card,
.dark .book{
    background:#26232d;
    color:#eee;
}

.dark .card-body p,
.dark .subtitle{
    color:#ccc;
}

@media(max-width:700px){

    .books{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .cover{
        height:190px;
    }

    .emoji{
        font-size:45px;
    }

    .cover h3{
        font-size:18px;
    }

    .story{
        font-size:18px;
    }

    .story p{
        text-align:left;
    }

    .navigation{
        flex-direction:column;
    }
}

@media(max-width:430px){

    .books{
        grid-template-columns:1fr;
    }

    .cover{
        height:220px;
    }
}
</style>
</head>

<body>

<header>

<h1>🌈 बालकथा संसार</h1>

<p>📚 बच्चाहरूका लागि रमाइला, लामो र सिकाइ दिने मौलिक कथाहरू</p>

<input
class="search"
id="search"
placeholder="🔍 कथा खोज्नुहोस्..."
oninput="renderBooks()"
>

<div class="controls">

<button onclick="toggleDark()">🌙 Dark</button>

<button onclick="home()">🏠 Library</button>

<button onclick="changeFont(1)">A+</button>

<button onclick="changeFont(-1)">A−</button>

<button onclick="saveBookmark()">🔖 Save</button>

<button onclick="continueReading()">📖 Continue</button>

</div>

</header>


<section class="library" id="library">

<h2>📚 बालबालिकाका पुस्तकहरू</h2>

<div class="filters">

<button onclick="setFilter('all')">सबै</button>
<button onclick="setFilter('Animal')">🐰 जनावर</button>
<button onclick="setFilter('Adventure')">🗺️ Adventure</button>
<button onclick="setFilter('Magic')">🪄 जादु</button>
<button onclick="setFilter('Learning')">🎓 सिकाइ</button>

</div>

<div class="books" id="books"></div>

</section>


<section class="reader" id="reader">

<div class="book">

<h1 id="bookTitle" class="bookTitle"></h1>

<div id="subtitle" class="subtitle"></div>

<h2 id="chapterTitle" class="chapterTitle"></h2>

<div id="story" class="story"></div>

<div class="navigation">

<button onclick="previousChapter()">
⬅️ अघिल्लो अध्याय
</button>

<button onclick="nextChapter()">
अर्को अध्याय ➡️
</button>

</div>

<br>

<button onclick="home()" style="width:100%">
🏠 पुस्तकालयमा फर्कनुहोस्
</button>

</div>

</section>


<script>

/* =========================================
   CHILDREN STORIES
========================================= */

const books=[

{
title:"बुद्धिमान खरायो",
emoji:"🐰",
category:"Animal",
desc:"सानो खरायोले बुद्धि र साहसले जंगललाई ठूलो समस्याबाट बचाउँछ।",

chapters:[

["हरियो जंगल",`
<p>धेरै वर्षअघि एउटा ठूलो र सुन्दर जंगल थियो। जंगल चारैतिर अग्ला रूख, रंगीन फूल र मिठो सुगन्धले भरिएको थियो। बिहान हुँदा चराहरूको आवाजले जंगल गुञ्जिन्थ्यो। खरायोहरू घाँसे मैदानमा खेल्थे, मृगहरू खोलाको पानी पिउँथे र हात्तीहरू ठूलो रूखको छायामा आराम गर्थे।</p>

<p>त्यही जंगलमा चिनु नामको एउटा सानो खरायो बस्थ्यो। चिनु अरू खरायोभन्दा अलि फरक थियो। ऊ धेरै ठूलो वा बलियो थिएन, तर उसको सोच्ने क्षमता निकै राम्रो थियो। कुनै समस्या आयो भने अरू जनावरहरू डराउँदा चिनु शान्त भएर उपाय खोज्थ्यो।</p>

<p>चिनुका धेरै साथीहरू थिए। उसको सबैभन्दा मिल्ने साथी टिमु कछुवा थियो। उनीहरू हरेक दिन जंगल घुम्थे र नयाँ कुरा सिक्थे।</p>
`],

["पानीको समस्या",`
<p>एक वर्ष जंगलमा लामो समयसम्म पानी परेन। खोलाको पानी दिनदिनै घट्दै गयो। चराहरू टाढा उडेर पानी खोज्न थाले। मृगहरू थाक्न थाले। हात्तीहरूले पनि चिन्ता गर्न थाले।</p>

<p>एक दिन सबै जनावरहरू ठूलो बरको रूखमुनि भेला भए। जंगलका वृद्ध हात्तीले भने, “यदि पानीको व्यवस्था भएन भने हाम्रो जंगल सुख्खा हुनेछ।”</p>

<p>सबै जनावर चिन्तित भए। कसैले केही उपाय सोच्न सकेन। चिनु भने चुपचाप सबै कुरा सुनिरहेको थियो।</p>

<p>उसलाई हजुरबुबा खरायोले वर्षौँअघि सुनाएको एउटा पुरानो कुरा सम्झना आयो—जंगलको उत्तरतिर एउटा पुरानो पानीको बाटो थियो।</p>
`],

["चिनुको योजना",`
<p>चिनु अगाडि बढ्यो। “हामीले पुरानो पानीको बाटो खोज्नुपर्छ,” उसले भन्यो।</p>

<p>फ्याउरोले हाँस्दै भन्यो, “तिमी यति सानो छौ, तिमीले त्यो ठूलो जंगलमा बाटो कसरी खोज्छौ?”</p>

<p>चिनुले मुस्कुराउँदै भन्यो, “ठूलो शरीरभन्दा ठूलो विचार महत्वपूर्ण हुन्छ।”</p>

<p>कछुवा टिमु, फ्याउरो र केही चराहरू चिनुसँग जान तयार भए। उनीहरूले खाना र पानी बोकेर यात्रा सुरु गरे।</p>
`],

["जंगलको यात्रा",`
<p>उनीहरू धेरै घण्टा हिँडे। बाटोमा अग्ला रूखहरू, साना खोल्साहरू र ढुंगाले भरिएका बाटाहरू भेटिए। कहिलेकाहीँ उनीहरूलाई बाटो हराएजस्तो लाग्थ्यो।</p>

<p>चिनुले रूखका पात, सूर्यको दिशा र पुराना जनावरका पाइला हेरेर बाटो पहिचान गर्‍यो।</p>

<p>अन्ततः उनीहरूले एउटा पुरानो ढुंगाको पर्खाल देखे। पर्खालको पछाडि पानी बग्ने सानो नहर थियो। तर नहर माटो र ढुंगाले पूरै बन्द भएको थियो।</p>
`],

["सबैको सहयोग",`
<p>चिनुले जंगलमा फर्केर सबै जनावरलाई खबर गर्‍यो। हात्तीहरूले ठूला ढुंगा हटाए। बाँदरहरूले हाँगा काटे। चराहरूले साना ढुंगा हटाए। कछुवाहरूले माटो सफा गरे।</p>

<p>धेरै घण्टासम्म सबैले मिलेर काम गरे। अन्ततः नहर खुल्यो। केही समयपछि चिसो पानी जंगलतिर बग्न थाल्यो।</p>

<p>सबै जनावर खुसीले उफ्रिए।</p>
`],

["जंगल फेरि हरियो",`
<p>केही दिनपछि जंगल फेरि हरियो हुन थाल्यो। फूलहरू फुले। चराहरू फर्किए। खोलामा पानी बढ्यो।</p>

<p>जंगलका सबै जनावरले चिनुलाई धन्यवाद दिए। तर चिनुले भन्यो, “मैले मात्र केही गरेको होइन। हामी सबैले मिलेर काम गरेका हौँ।”</p>
`],

["चिनुको नयाँ जिम्मेवारी",`
<p>त्यस दिनदेखि चिनुलाई जंगलको सानो सल्लाहकार बनाइयो। समस्या आउँदा सबै जनावर उसको कुरा सुन्थे।</p>

<p>चिनुले पनि सबैलाई एउटा कुरा सम्झाइरहन्थ्यो—समस्या ठूलो भए पनि त्यसलाई सानो-सानो भागमा बाँडेर समाधान गर्न सकिन्छ।</p>
`],

["सिकाइ",`
<p class="moral">🌟 सिकाइ: शरीर ठूलो हुनु मात्र शक्ति होइन। बुद्धि, साहस, सहयोग र राम्रो सोचले ठूलो समस्या पनि समाधान गर्न सकिन्छ।</p>
`]

]
},


{
title:"जादुई पेन्सिल",
emoji:"✏️",
category:"Magic",
desc:"एउटा बच्चाले पाएको पेन्सिलले उसको जीवनमा अनौठो परिवर्तन ल्याउँछ।",

chapters:[

["पुरानो दराज",`
<p>निश्चललाई चित्र बनाउन धेरै मन पर्थ्यो। एक दिन विद्यालयको पुरानो पुस्तकालय सफा गर्ने क्रममा उसले एउटा सानो काठको बाकस भेट्यो।</p>

<p>बाकस खोलेपछि त्यसभित्र सुनौलो रंगको एउटा पेन्सिल थियो। पेन्सिलमा सानो अक्षरमा लेखिएको थियो—“यसलाई राम्रो कामका लागि मात्र प्रयोग गर।”</p>
`],

["पहिलो चित्र",`
<p>निश्चलले पेन्सिलले एउटा स्याउ कोर्‍यो। चित्र पूरा हुनेबित्तिकै कागजबाट स्याउ बाहिर निस्कियो।</p>

<p>ऊ अचम्ममा पर्यो। उसले फेरि एउटा फूल कोर्‍यो। फूल पनि वास्तविक भयो।</p>

<p>निश्चलले बुझ्यो—यो साधारण पेन्सिल थिएन।</p>
`],

["लोभ",`
<p>निश्चलले सुरुमा पेन्सिललाई खेलौनाजस्तो प्रयोग गर्‍यो। उसले मिठाई, खेलौना र धेरै रमाइला चीजहरू बनाउन थाल्यो।</p>

<p>तर केही दिनपछि उसले बुझ्यो कि धेरै कुरा पाएपछि पनि मन सधैँ खुसी हुँदैन।</p>
`],

["साथीको समस्या",`
<p>उसको साथी सुमीलाई पढ्नका लागि किताब थिएन। निश्चलले पेन्सिलले किताब बनाउने विचार गर्‍यो।</p>

<p>उसले एउटा राम्रो कथा पुस्तक कोर्‍यो। केही क्षणपछि त्यो वास्तविक किताब बन्यो। सुमी धेरै खुसी भइन्।</p>
`],

["गाउँका बालबालिका",`
<p>निश्चलले गाउँमा धेरै बच्चाहरूसँग किताब नभएको देख्यो। उसले उनीहरूका लागि गणित, विज्ञान, कथा र चित्रका किताबहरू बनाउन थाल्यो।</p>

<p>केही दिनमै गाउँको सानो पुस्तकालय किताबले भरियो।</p>
`],

["पेन्सिल हरायो",`
<p>एक दिन पेन्सिल अचानक हरायो। निश्चलले धेरै खोज्यो तर भेटेन।</p>

<p>ऊ निराश भयो। तर उसको शिक्षकले भने, “तिमीले पेन्सिलभन्दा ठूलो कुरा सिकेका छौ—अरूलाई सहयोग गर्ने बानी।”</p>
`],

["साँचो जादु",`
<p>निश्चलले बुझ्यो कि जादु पेन्सिलमा मात्र थिएन। जादु त उसको सोच र अरूलाई सहयोग गर्ने इच्छामा थियो।</p>
`],

["सिकाइ",`
<p class="moral">🌟 सिकाइ: हामीसँग भएको क्षमता र साधनलाई केवल आफ्नो फाइदाका लागि होइन, अरूलाई सहयोग गर्न पनि प्रयोग गर्नुपर्छ।</p>
`]

]
},


{
title:"सानो साहसी हात्ती",
emoji:"🐘",
category:"Adventure",
desc:"डराउने सानो हात्तीले एक दिन आफ्नो साहस देखाउँछ।",

chapters:[

["टिम्मो",`
<p>टिम्मो एउटा सानो हात्ती थियो। ऊ आफ्ना साथीहरूलाई धेरै माया गर्थ्यो, तर ठूलो आवाजसँग धेरै डराउँथ्यो।</p>

<p>बादल गर्जिँदा ऊ आमाको पछाडि लुक्थ्यो।</p>
`],

["ठूलो हुरी",`
<p>एक दिन जंगलमा अचानक ठूलो हुरी आयो। रूखहरू हल्लिन थाले। चराहरू आफ्नो गुँडतिर फर्किए।</p>

<p>टिम्मोका केही साथीहरू जंगलको अर्को भागमा फसे।</p>

/* =========================================
   VARIABLES
========================================= */

let currentBook=0;
let currentChapter=0;
let filter="all";
let font=20;


/* =========================================
   RENDER BOOKS
========================================= */

function renderBooks(){

    const area=document.getElementById("books");

    area.innerHTML="";

    const search=
    document.getElementById("search")
    .value.toLowerCase();

    books.forEach((book,index)=>{

        const searchMatch=
        book.title.toLowerCase()
        .includes(search) ||
        book.desc.toLowerCase()
        .includes(search);

        const filterMatch=
        filter==="all" ||
        book.category===filter;

        if(!searchMatch || !filterMatch)
        return;

        const card=document.createElement("div");

        card.className="card";

        card.innerHTML=`

        <div class="cover">

            <div class="emoji">
            ${book.emoji}
            </div>

            <h3>
            ${book.title}
            </h3>

        </div>

        <div class="card-body">

            <span class="badge">
            ${book.category}
            </span>

            <p>
            ${book.desc}
            </p>

            <p>
            📖 ${book.chapters.length} अध्याय
            </p>

            <button onclick="openBook(${index})">
            📚 पुस्तक पढ्नुहोस्
            </button>

        </div>
        `;

        area.appendChild(card);

    });
}


/* =========================================
   OPEN BOOK
========================================= */

function openBook(index){

    currentBook=index;
    currentChapter=0;

    document.getElementById("library")
    .style.display="none";

    document.getElementById("reader")
    .style.display="block";

    showChapter();

}


/* =========================================
   SHOW CHAPTER
========================================= */

function showChapter(){

    const book=books[currentBook];

    const chapter=
    book.chapters[currentChapter];

    document.getElementById("bookTitle")
    .textContent=
    book.emoji+" "+book.title;

    document.getElementById("subtitle")
    .textContent=
    book.category+
    " • "+
    book.chapters.length+
    " अध्याय";

    document.getElementById("chapterTitle")
    .textContent=
    "अध्याय "+
    (currentChapter+1)+
    " — "+
    chapter[0];

    document.getElementById("story")
    .innerHTML=chapter[1];

    document.getElementById("story")
    .style.fontSize=font+"px";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================
   NEXT CHAPTER
========================================= */

function nextChapter(){

    const book=books[currentBook];

    if(currentChapter<
    book.chapters.length-1){

        currentChapter++;
        showChapter();

    }else{

        if(currentBook<
        books.length-1){

            if(confirm(
            "🎉 यो पुस्तक समाप्त भयो!\n\nअर्को बालकथा पढ्ने?"
            )){

                openBook(currentBook+1);

            }

        }else{

            alert(
            "🌈 तपाईंले सबै पुस्तक पढिसक्नुभयो!"
            );

        }
    }
}


/* =========================================
   PREVIOUS CHAPTER
========================================= */

function previousChapter(){

    if(currentChapter>0){

        currentChapter--;
        showChapter();

    }
}


/* =========================================
   HOME
========================================= */

function home(){

    document.getElementById("reader")
    .style.display="none";

    document.getElementById("library")
    .style.display="block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================
   FILTER
========================================= */

function setFilter(value){

    filter=value;
    renderBooks();

}


/* =========================================
   DARK MODE
========================================= */

function toggleDark(){

    document.body.classList.toggle("dark");

}


/* =========================================
   FONT SIZE
========================================= */

function changeFont(value){

    font+=value;

    if(font<15)font=15;
    if(font>34)font=34;

    document.getElementById("story")
    .style.fontSize=font+"px";

}


/* =========================================
   BOOKMARK
========================================= */

function saveBookmark(){

    localStorage.setItem(
        "childrenBook",
        currentBook
    );

    localStorage.setItem(
        "childrenChapter",
        currentChapter
    );

    alert("🔖 Bookmark सुरक्षित भयो!");

}


function continueReading(){

    const b=
    localStorage.getItem("childrenBook");

    const c=
    localStorage.getItem("childrenChapter");

    if(b!==null){

        currentBook=Number(b);
        currentChapter=Number(c||0);

        document.getElementById("library")
        .style.display="none";

        document.getElementById("reader")
        .style.display="block";

        showChapter();

    }else{

        alert("📖 अहिलेसम्म कुनै Bookmark छैन।");

    }
}


/* =========================================
   START
========================================= */

renderBooks();

</script>

</html>
