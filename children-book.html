<style>
*{box-sizing:border-box;margin:0;padding:0}

body{

header{

</head>

story:`
<p>
घना जंगलको बीचमा एउटा ठूलो सिंह बस्थ्यो। उसको गर्जन सुन्दा

<p>
सिंह रिसाएर मुसालाई समात्यो। मुसाले डराउँदै भन्यो,

</p>

<p>
मुसा दौडेर आयो र आफ्नो तीखा दाँतले जाल काट्न थाल्यो।

सिंहले मुसालाई हेरेर भन्यो, “आज मैले बुझें, ठूलो शरीर मात्र

</p>

<p>
त्यस दिनदेखि सिंहले जंगलका साना जनावरलाई कहिल्यै हेपेन।
मुसा र सिंह असल साथी बने। जंगलमा पनि एउटा नयाँ कुरा फैलियो—
सहयोग गर्ने मन भएको साथी कहिल्यै सानो हुँदैन।
</p>

<p class="lesson">
🌟 <b>कथाबाट सिकाइ:</b> कसैलाई उसको आकार वा कमजोरी हेरेर

</p>

<p>

</p>

<p>
बाटोमा उसले एउटा बूढो उल्लू भेट्यो। उल्लूले भन्यो,

</p>

<p>
खरायोले कुरा बुझ्यो। उसले चन्द्रमा समात्ने प्रयास छोडेर

</p>

<p>
खरायोले बुझ्यो—चन्द्रमाको सबैभन्दा ठूलो सुन्दरता त्यसलाई
समात्नुमा होइन, त्यसको प्रकाश अरूसँग बाँड्नुमा रहेछ।

story:`

</p>

<p>
उसले नदी, पहाड, घाँसे मैदान र जंगलका बाटाहरू खोज्यो।
बाटोमा उसले धेरै जनावरलाई भेट्यो। सबैले हरिण देखेको थिएनन्।
तर गजराजले खोजी छोडेन।
</p>

<p>
अन्ततः एउटा झाडीभित्रबाट कमजोर आवाज आयो। हरिणको खुट्टा

<p>
दुवै साथी खुसी भए। त्यस दिन उनीहरूले बुझेर कि साँचो मित्रता

</p>

<p class="lesson">

<p>

</p>

<p class="lesson">

</p>
