<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>दिव्य कथा संग्रह</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Noto Serif Devanagari", Georgia, serif;
    background:#160b05;
    color:#32180b;
}

/* HEADER */
header{
    min-height:420px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px 20px;
    background:
        radial-gradient(circle at center,
        #ffe7a0 0%,
        #a94d08 35%,
        #260b02 100%);
    color:white;
}

.om{
    font-size:75px;
    color:#ffd45c;
    text-shadow:0 0 30px #fff1a8;
    animation:pulse 2s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(1);}
    to{transform:scale(1.12);}
}

header h1{
    font-size:clamp(38px,8vw,72px);
    color:#ffe083;
    margin:10px;
}

header p{
    max-width:800px;
    line-height:1.9;
    font-size:18px;
}

/* SEARCH */
.search-box{
    width:min(900px,92%);
    margin:30px auto;
}

.search-box input{
    width:100%;
    padding:18px 25px;
    border:0;
    border-radius:50px;
    font-size:17px;
    outline:none;
}

/* BOOKS */
.library{
    width:min(1150px,94%);
    margin:auto;
    padding-bottom:80px;
}

.library-title{
    color:#ffd76b;
    text-align:center;
    font-size:34px;
    margin:30px;
}

.books{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.book{
    min-height:360px;
    border-radius:22px;
    overflow:hidden;
    background:
        linear-gradient(145deg,#632a07,#261005);
    border:1px solid #b77b21;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
    cursor:pointer;
    transition:.35s;
}

.book:hover{
    transform:translateY(-10px);
}

.book-icon{
    height:200px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:100px;
    background:
        radial-gradient(circle,#ffe29a,#a74b07 60%,#351004);
}

.book-info{
    padding:22px;
    color:white;
}

.book-info h2{
    color:#ffd96b;
    margin-bottom:10px;
}

.book-info p{
    line-height:1.7;
    color:#eee;
}

.read{
    display:inline-block;
    margin-top:15px;
    background:#f1bd43;
    color:#321500;
    padding:10px 20px;
    border-radius:30px;
    font-weight:bold;
}

/* READER */
.reader{
    display:none;
    background:#756149;
    min-height:100vh;
    padding:20px 10px 80px;
}

.reader-top{
    width:min(900px,96%);
    margin:auto;
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:20px;
}

.btn{
    border:0;
    background:#351406;
    color:#ffd765;
    padding:12px 20px;
    border-radius:30px;
    cursor:pointer;
    font-size:15px;
}

/* PAPER */
.paper{
    width:min(900px,96%);
    margin:auto;
    background:
        linear-gradient(#fffdf4,#fff7db);
    padding:clamp(30px,7vw,80px);
    box-shadow:0 20px 70px rgba(0,0,0,.55);
    position:relative;
}

.paper:before{
    content:"";
    position:absolute;
    inset:15px;
    border:2px solid #c99938;
    pointer-events:none;
}

.story-title{
    text-align:center;
    color:#7b3105;
    font-size:clamp(32px,6vw,52px);
    margin-bottom:10px;
}

.story-intro{
    text-align:center;
    color:#886b40;
    margin-bottom:45px;
}

.story{
    font-size:19px;
    line-height:2.15;
    text-align:justify;
}

.story p{
    margin-bottom:25px;
    text-indent:42px;
}

.story .chapter{
    text-align:center;
    text-indent:0;
    font-size:30px;
    color:#8c3708;
    margin:55px 0 28px;
    font-weight:bold;
}

.story .quote{
    text-align:center;
    text-indent:0;
    padding:22px;
    margin:30px 0;
    background:#fff0b8;
    border-left:5px solid #c18a20;
    color:#61310d;
    font-style:italic;
}

.story .note{
    text-indent:0;
    padding:18px;
    background:#f8e8c4;
    border-radius:10px;
    font-size:15px;
}

footer{
    text-align:center;
    padding:30px;
    color:#ffe9a3;
    background:#210c03;
}

@media(max-width:600px){
    .story{
        font-size:17px;
        line-height:2;
    }

    .paper{
        padding:35px 25px;
    }

    .story p{
        text-indent:25px;
    }
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home">

<header>
    <div class="om">ॐ</div>
    <h1>दिव्य कथा संग्रह</h1>
    <p>
        भगवान् तथा देवी–देवतासँग सम्बन्धित
        प्रसिद्ध धार्मिक तथा पुराणिक कथाहरूको
        विस्तृत नेपाली पुनर्कथन।
    </p>
</header>

<div class="search-box">
    <input
        id="search"
        type="text"
        placeholder="🔎 भगवानको नाम खोज्नुहोस्..."
    >
</div>

<section class="library">
    <h2 class="library-title">📚 धार्मिक पुस्तकालय</h2>
    <div class="books" id="books"></div>
</section>

<footer>
    🙏 श्रद्धा • ज्ञान • धर्म • संस्कार 🙏
</footer>

</div>


<!-- READER -->
<div id="reader" class="reader">

    <div class="reader-top">
        <button class="btn" onclick="backHome()">
            ← पुस्तकालय
        </button>

        <button class="btn" onclick="window.scrollTo({
            top:0,
            behavior:'smooth'
        })">
            ↑ माथि
        </button>
    </div>

    <article class="paper">

        <h1 id="storyTitle" class="story-title"></h1>

        <div class="story-intro">
            विस्तृत धार्मिक कथा
        </div>

        <div id="story" class="story"></div>

    </article>

</div>


<script>

/* =========================================================
   STORIES
========================================================= */

const books = [

/* ================= KRISHNA ================= */

{
name:"श्रीकृष्ण",
icon:"🦚",
description:
"श्रीकृष्णको जन्मदेखि बाल्यकाल, गोकुल, वृन्दावन, मथुरा र कंस वधपछिको जीवनसम्मको क्रमिक कथा।",

story:`

<div class="chapter">
अध्याय १ — मथुरामा कृष्णको जन्म
</div>

<p>
प्राचीन समयमा मथुरा नगरीमा उग्रसेन नामका राजा थिए।
पछि उनका पुत्र कंसले सत्ता आफ्नो हातमा लिए। कंस अत्यन्त शक्तिशाली
तर कठोर स्वभावका शासक थिए। उनी आफ्ना विरोधीहरूदेखि डराउँथे र
आफ्नो शक्ति जोगाउन कठोर निर्णय लिन्थे।
</p>

<p>
कंसकी बहिनी देवकीको विवाह वसुदेवसँग भयो। विवाहपछि कंस आफैं
उनीहरूलाई घरतर्फ पुर्‍याउन गइरहेका थिए। त्यसै समयमा आकाशवाणी भयो
कि देवकीको आठौँ सन्तान कंसको मृत्युको कारण बन्नेछ।
</p>

<p>
यो सुनेपछि कंस भयभीत भए। उनले देवकी र वसुदेवलाई बन्दी बनाए।
देवकीका सन्तान जन्मिँदै गए र कंसले उनीहरूलाई मार्दै गए।
</p>

<p>
समय बित्दै गयो। अन्ततः देवकीको आठौँ सन्तान जन्मिने रात आयो।
धार्मिक परम्पराअनुसार त्यस रात कारागारमा अद्भुत घटना भयो।
श्रीकृष्णको जन्म भयो।
</p>

<p>
वसुदेवले बालकलाई सुरक्षित राख्न गोकुल लैजाने निर्णय गरे।
कथाअनुसार कारागारका ढोकाहरू खुले र पहरेदारहरू निदाए।
वसुदेव बालक कृष्णलाई लिएर यमुनातर्फ गए।
</p>

<p>
यमुनाको किनार पार गर्दै उनी गोकुल पुगे।
त्यहाँ नन्द र यशोदाको घरमा कृष्णलाई राखियो।
यसरी कृष्णको बाल्यकाल गोकुलमा सुरु भयो।
</p>


<div class="chapter">
अध्याय २ — गोकुलको बाल्यकाल
</div>

<p>
गोकुलमा कृष्णलाई सबैले अत्यन्त माया गर्थे।
नन्द उनका पालनकर्ता पिता र यशोदा उनकी पालनकर्ता माता बन्नुभयो।
कृष्ण अरू बालबालिकासँग खेल्थे, गाईबस्तुसँग रमाउँथे र
आफ्नो बालसुलभ व्यवहारले सम्पूर्ण गोकुललाई आनन्दित बनाउँथे।
</p>

<p>
कृष्णको बाल्यकालसँग माखन र दहीसँग सम्बन्धित धेरै प्रसिद्ध
कथाहरू जोडिएका छन्। कृष्ण साथीहरूसँग मिलेर घरघरमा माखन खोज्ने
गर्थे भन्ने कथा भक्तिपरम्परामा लोकप्रिय छ।
</p>

<p>
यशोदाले कृष्णलाई कहिलेकाहीँ सम्झाउने र बाँध्ने प्रयास गर्नुहुन्थ्यो।
तर कृष्णको बालस्वरूपप्रतिको माया यति गहिरो थियो कि उहाँका
साना-साना शरारतहरू पनि गोकुलवासीका लागि आनन्दको विषय बन्थे।
</p>


<div class="chapter">
अध्याय ३ — पूतनाको प्रसंग
</div>

<p>
कंसले कृष्ण जीवित रहेको कुरा थाहा पाएपछि उनलाई मार्न विभिन्न
उपाय खोज्न थाले। त्यसै क्रममा पूतना नामकी राक्षसीलाई बालकृष्णलाई
हानि पुर्‍याउन पठाइएको कथा पाइन्छ।
</p>

<p>
पूतना सुन्दर स्त्रीको रूप लिएर गोकुल पुगिन्।
उनले बालकृष्णलाई आफ्नो काखमा लिन खोजिन्।
तर कृष्णले उनको वास्तविक स्वरूप चिने।
कथाअनुसार कृष्णले उनको विषको प्रभावलाई नष्ट गरे।
</p>

<p>
यस घटनापछि गोकुलवासीहरू कृष्णको असाधारण शक्तिबारे अझ आश्चर्यचकित भए।
</p>


<div class="chapter">
अध्याय ४ — कालिय नाग
</div>

<p>
यमुनाको एउटा भागमा कालिय नामको विशाल नाग बसेको कथा प्रसिद्ध छ।
उसको विषका कारण पानी र वरपरको वातावरण दूषित भएको मानिन्थ्यो।
गोकुलका मानिसहरू त्यस ठाउँबाट डराउँथे।
</p>

<p>
एक दिन कृष्ण त्यही क्षेत्रमा पुगे। कृष्ण यमुनामा प्रवेश गरे र
कालियसँग सामना भयो।
धार्मिक कथाअनुसार कृष्णले कालियलाई पराजित गरे र उसको फणमाथि
नृत्य गर्नुभयो।
</p>

<p>
कालियकी पत्नीहरूले कृष्णसँग क्षमा मागेपछि कृष्णले कालियलाई
त्यहाँबाट टाढा जान आदेश दिनुभयो।
यसरी यमुनाको संकट समाप्त भएको कथा वर्णित छ।
</p>


<div class="chapter">
अध्याय ५ — गोवर्धन पर्वत
</div>

<p>
गोकुल र वृन्दावनमा वर्षा र प्रकृतिसँग मानिसहरूको जीवन गहिरो रूपमा
जोडिएको थियो। कृष्णले प्रकृति, गाई, पर्वत र आफ्नो समुदायको
महत्वबारे मानिसहरूलाई सम्झाउनुभयो भन्ने कथा पाइन्छ।
</p>

<p>
त्यसपछि ठूलो वर्षा भएको र मानिसहरू संकटमा परेको कथा आउँछ।
कृष्णले गोवर्धन पर्वत उठाएर मानिस तथा गाईबस्तुलाई त्यसको
आश्रयमा राखेको प्रसिद्ध धार्मिक कथा छ।
</p>

<p>
यस घटनापछि कृष्णलाई गोकुलवासीहरूले अझ ठूलो श्रद्धाका साथ हेर्न थाले।
</p>


<div class="chapter">
अध्याय ६ — वृन्दावनका दिनहरू
</div>

<p>
कृष्णको जीवनको वृन्दावनसँग जोडिएको भाग प्रेम, भक्ति, संगीत,
गाई चराउने जीवन र गोप–गोपिनीहरूको धार्मिक भावनाले भरिएको
कथाका रूपमा वर्णन गरिन्छ।
</p>

<p>
कृष्ण बाँसुरी बजाउँथे भन्ने कथा अत्यन्त प्रसिद्ध छ।
उनको बाँसुरीको धुन सुनेर मानिसहरू आकर्षित हुने र कृष्णप्रति
भक्ति व्यक्त गर्ने प्रसंगहरू विभिन्न भक्तिपरम्परामा पाइन्छन्।
</p>

<p>
यी कथाहरूलाई केवल मनोरञ्जनका रूपमा मात्र होइन,
ईश्वरप्रतिको प्रेम र भक्तिको प्रतीकका रूपमा पनि व्याख्या गरिन्छ।
</p>


<div class="chapter">
अध्याय ७ — मथुरातर्फ यात्रा
</div>

<p>
समय बित्दै जाँदा कृष्ण र बलरामको मथुरासँग सम्बन्धित अर्को चरण सुरु भयो।
कंसलाई कृष्णको अस्तित्व र उनको बढ्दो शक्तिबारे जानकारी थियो।
त्यसैले कंसले कृष्णलाई मथुरा बोलाउने योजना बनाए।
</p>

<p>
कृष्ण मथुरा पुगेपछि त्यहाँको वातावरण गम्भीर थियो।
कंसले विभिन्न उपायबाट कृष्णलाई रोक्ने प्रयास गरे।
तर कृष्ण र बलरामले ती बाधाहरू पार गरे।
</p>


<div class="chapter">
अध्याय ८ — कंसको अन्त्य
</div>

<p>
अन्ततः कृष्ण र कंस आमनेसामने भए।
कथाअनुसार कंसले आफ्नो शक्ति प्रयोग गरे तर कृष्णले उनलाई पराजित गर्नुभयो।
यसरी कंसको अत्याचारको अन्त्य भयो।
</p>

<p>
कंसको अन्त्यपछि कृष्णले आफ्ना माता–पिता देवकी र वसुदेवलाई
बन्दी अवस्थाबाट मुक्त गराउनुभयो।
उग्रसेनलाई पुनः राजगद्दीमा स्थापित गरिएको कथा पनि परम्परामा पाइन्छ।
</p>


<div class="chapter">
अध्याय ९ — कंस वधपछि कृष्ण
</div>

<p>
कंसको अन्त्य भएपछि कृष्णको जीवन समाप्त भएको थिएन।
बरु उहाँको जीवनको अर्को महत्वपूर्ण चरण सुरु भयो।
मथुरामा राज्यको व्यवस्था पुनःस्थापित गर्न र आफ्ना परिवार तथा
समुदायको सुरक्षा गर्न कृष्णले महत्वपूर्ण भूमिका खेल्नुभयो।
</p>

<p>
मथुरामा लगातार आउने संकटहरूका कारण यदुवंशीहरूलाई सुरक्षित ठाउँमा
स्थानान्तरण गर्ने निर्णय भयो। त्यसपछि समुद्रको किनारमा
द्वारका नगरी स्थापना भएको धार्मिक परम्परा पाइन्छ।
</p>

<p>
द्वारका कृष्णको जीवनको महत्वपूर्ण केन्द्र बन्यो।
त्यहाँबाट उहाँले आफ्नो परिवार र राज्यको व्यवस्थापन गर्नुभयो।

/* =========================================================
   SHOW BOOKS
========================================================= */

const booksContainer =
document.getElementById("books");

function displayBooks(list){

    booksContainer.innerHTML="";

    list.forEach(book=>{

        const card=document.createElement("div");

        card.className="book";

        card.innerHTML=`
            <div class="book-icon">
                ${book.icon}
            </div>

            <div class="book-info">

                <h2>
                    ${book.name}
                </h2>

                <p>
                    ${book.description}
                </p>

                <span class="read">
                    📖 पुस्तक खोल्नुहोस्
                </span>

            </div>
        `;

        card.onclick=()=>{
            openBook(book);
        };

        booksContainer.appendChild(card);

    });
}


/* =========================================================
   OPEN BOOK
========================================================= */

function openBook(book){

    document.getElementById("home")
        .style.display="none";

    document.getElementById("reader")
        .style.display="block";

    document.getElementById("storyTitle")
        .textContent=
        book.icon+" "+book.name;

    document.getElementById("story")
        .innerHTML=book.story;

    window.scrollTo(0,0);
}


/* =========================================================
   BACK HOME
========================================================= */

function backHome(){

    document.getElementById("reader")
        .style.display="none";

    document.getElementById("home")
        .style.display="block";

    window.scrollTo(0,0);
}


/* =========================================================
   SEARCH
========================================================= */

document.getElementById("search")
.addEventListener("input",function(){

    const text=
        this.value.toLowerCase().trim();

    const result=
        books.filter(book=>
            book.name.toLowerCase()
            .includes(text)
        );

    displayBooks(result);

});


/* START */

displayBooks(books);

</script>
