<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Flying Bird — GameBook GK Hub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

body{
    font-family:Arial,sans-serif;
    background:#050816;
    color:white;
    overflow:hidden;
    height:100vh;
}

.game-wrap{
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

canvas{
    display:block;
    background:#62c8ff;
    touch-action:none;
}

/* ---------------- HUD ---------------- */

.hud{
    position:fixed;
    top:15px;
    left:0;
    right:0;
    z-index:10;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 18px;

    pointer-events:none;
}

.hud-box{
    padding:9px 15px;
    border-radius:15px;

    background:rgba(0,0,0,.35);
    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.18);

    box-shadow:
        0 8px 25px rgba(0,0,0,.2);
}

.hud small{
    display:block;
    color:#dbeafe;
    font-size:10px;
}

.hud strong{
    font-size:20px;
}

/* ---------------- SCREEN ---------------- */

.screen{
    position:fixed;
    inset:0;

    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.35);
    backdrop-filter:blur(5px);

    transition:.4s;
}

.screen.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.panel{
    width:min(90%,420px);

    padding:35px 25px;

    text-align:center;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(15,23,42,.95),
            rgba(30,41,59,.9)
        );

    border:
        1px solid rgba(255,255,255,.15);

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);

    animation:
        panelIn .6s ease;
}

@keyframes panelIn{

    from{
        opacity:0;
        transform:
            translateY(30px)
            scale(.85);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.bird-logo{
    font-size:70px;

    animation:
        birdFloat
        1.5s
        ease-in-out
        infinite;
}

@keyframes birdFloat{

    0%,100%{
        transform:translateY(0) rotate(-3deg);
    }

    50%{
        transform:translateY(-12px) rotate(4deg);
    }
}

.panel h1{
    font-size:38px;
    margin:10px 0;

    background:
        linear-gradient(
            90deg,
            #38bdf8,
            #a78bfa,
            #f472b6
        );

    -webkit-background-clip:text;
    color:transparent;
}

.panel p{
    color:#94a3b8;
    line-height:1.6;
    margin:12px 0 25px;
}

.play-btn{
    width:100%;

    padding:16px;

    border:0;
    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #9333ea
        );

    color:white;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 12px 35px rgba(59,130,246,.3);

    transition:.25s;
}

.play-btn:hover{
    transform:
        translateY(-3px)
        scale(1.02);
}

.controls{
    margin-top:18px;

    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.control{
    padding:8px 12px;

    border-radius:10px;

    background:rgba(255,255,255,.07);

    color:#cbd5e1;

    font-size:12px;
}

/* ---------------- PAUSE ---------------- */

.pause-btn{
    position:fixed;

    right:15px;
    top:15px;

    z-index:15;

    width:42px;
    height:42px;

    border:1px solid rgba(255,255,255,.2);

    border-radius:50%;

    background:rgba(0,0,0,.35);

    color:white;

    font-size:18px;

    cursor:pointer;
}

/* ---------------- MOBILE ---------------- */

@media(max-width:600px){

    .panel h1{
        font-size:32px;
    }

    .bird-logo{
        font-size:60px;
    }

}

</style>
</head>

<body>

<div class="game-wrap">
    <canvas id="game"></canvas>
</div>


<!-- HUD -->

<div class="hud">

    <div class="hud-box">
        <small>SCORE</small>
        <strong id="score">0</strong>
    </div>

    <div class="hud-box">
        <small>BEST</small>
        <strong id="best">0</strong>
    </div>

</div>


<!-- PAUSE -->

<button
class="pause-btn"
id="pauseBtn">

⏸

</button>


<!-- START SCREEN -->

<div class="screen" id="startScreen">

    <div class="panel">

        <div class="bird-logo">
            🐦
        </div>

        <h1>Flying Bird</h1>

        <p>
            Fly through the pipes,
            collect coins and beat
            your highest score!
        </p>

        <button
        class="play-btn"
        id="startBtn">

            🚀 START GAME

        </button>

        <div class="controls">

            <span class="control">
                📱 Tap
            </span>

            <span class="control">
                🖱 Click
            </span>

            <span class="control">
                ⌨️ Space
            </span>

        </div>

    </div>

</div>


<!-- GAME OVER -->

<div
class="screen hidden"
id="gameOverScreen">

    <div class="panel">

        <div class="bird-logo">
            💥
        </div>

        <h1>Game Over</h1>

        <p>
            Your Score:
            <strong id="finalScore">
                0
            </strong>
            <br>

            Best Score:
            <strong id="finalBest">
                0
            </strong>
        </p>

        <button
        class="play-btn"
        id="restartBtn">

            🔄 PLAY AGAIN

        </button>

    </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


let W;
let H;
let scale = 1;


function resize(){

    W =
        Math.min(
            window.innerWidth,
            650
        );

    H =
        window.innerHeight;

    canvas.width =
        W;

    canvas.height =
        H;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   GAME VARIABLES
===================================================== */

let bird;

let pipes = [];

let coins = [];

let particles = [];

let clouds = [];

let score = 0;

let best =
    Number(
        localStorage.getItem(
            "flyingBirdBest"
        )
    ) || 0;

let running = false;

let paused = false;

let gameSpeed = 3;

let frame = 0;

let groundHeight = 75;


/* =====================================================
   UI
===================================================== */

const scoreEl =
    document.getElementById(
        "score"
    );

const bestEl =
    document.getElementById(
        "best"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const gameOverScreen =
    document.getElementById(
        "gameOverScreen"
    );

const finalScore =
    document.getElementById(
        "finalScore"
    );

const finalBest =
    document.getElementById(
        "finalBest"
    );


bestEl.textContent =
    best;


/* =====================================================
   BIRD
===================================================== */

function createBird(){

    return {

        x:W * .25,

        y:H * .45,

        radius:18,

        velocity:0,

        gravity:.42,

        jump:-7.5,

        rotation:0

    };

}


/* =====================================================
   CLOUDS
===================================================== */

function createCloud(){

    return {

        x:W + Math.random()*200,

        y:
            60 +
            Math.random() *
            (H * .45),

        size:
            30 +
            Math.random()*35,

        speed:
            .25 +
            Math.random()*.45

    };

}


for(
    let i=0;
    i<7;
    i++
){

    clouds.push({

        x:
            Math.random()*W,

        y:
            60 +
            Math.random()*
            (H*.45),

        size:
            25 +
            Math.random()*40,

        speed:
            .2 +
            Math.random()*.4

    });

}


/* =====================================================
   RESET GAME
===================================================== */

function resetGame(){

    bird =
        createBird();

    pipes = [];

    coins = [];

    particles = [];

    score = 0;

    frame = 0;

    gameSpeed = 3;

    running = true;

    paused = false;

    scoreEl.textContent =
        "0";

    pauseBtn.textContent =
        "⏸";

}


/* =====================================================
   START
===================================================== */

function startGame(){

    resetGame();

    startScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    if(!running)
        return;

    running = false;

    createExplosion(
        bird.x,
        bird.y,
        25
    );

    if(score > best){

        best = score;

        localStorage.setItem(
            "flyingBirdBest",
            best
        );

    }

    finalScore.textContent =
        score;

    finalBest.textContent =
        best;

    bestEl.textContent =
        best;

    setTimeout(
        () => {

            gameOverScreen
                .classList
                .remove("hidden");

        },
        450
    );

}


/* =====================================================
   JUMP
===================================================== */

function jump(){

    if(!running){

        return;

    }

    if(paused){

        return;

    }

    bird.velocity =
        bird.jump;

    createJumpParticles();

}


/* =====================================================
   CREATE PIPES
===================================================== */

function createPipe(){

    const gap =
        Math.max(
            145,
            190 -
            score * 1.2
        );

    const minTop = 90;

    const maxTop =
        H -
        groundHeight -
        gap -
        90;

    const top =
        minTop +
        Math.random() *
        Math.max(
            1,
            maxTop-minTop
        );


    pipes.push({

        x:W + 30,

        width:70,

        top:top,

        gap:gap,

        passed:false

    });


    /*
     * Coin appears in the gap.
     */

    coins.push({

        x:
            W + 65,

        y:
            top +
            gap/2,

        radius:11,

        collected:false,

        rotation:0

    });

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticle(
    x,
    y,
    type="normal"
){

    particles.push({

        x:x,

        y:y,

        vx:
            (Math.random()-.5)
            * 4,

        vy:
            (Math.random()-.5)
            * 4,

        life:1,

        size:
            type === "coin"
            ? 4
            : 3 +
              Math.random()*4

    });

}


function createJumpParticles(){

    for(
        let i=0;
        i<5;
        i++
    ){

        createParticle(
            bird.x-10,
            bird.y+8
        );

    }

}


function createExplosion(
    x,
    y,
    amount
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)
                * 9,

            vy:
                (Math.random()-.5)
                * 9,

            life:1,

            size:
                3 +
                Math.random()*6

        });

    }

}


/* =====================================================
   UPDATE
===================================================== */

function update(){

    if(!running || paused)
        return;


    frame++;


    /*
     * Bird physics
     */

    bird.velocity +=
        bird.gravity;

    bird.y +=
        bird.velocity;

    bird.rotation =
        Math.min(
            Math.max(
                bird.velocity * .08,
                -.4
            ),
            1
        );


    /*
     * Pipe generation
     */

    if(
        frame % 105 === 0
    ){

        createPipe();

    }


    /*
     * Move pipes
     */

    pipes.forEach(
        pipe => {

            pipe.x -=
                gameSpeed;


            /*
             * Score
             */

            if(
                !pipe.passed &&
                pipe.x +
                pipe.width <
                bird.x
            ){

                pipe.passed = true;

                score++;

                scoreEl.textContent =
                    score;

                createScoreParticles(
                    bird.x,
                    bird.y
                );


                /*
                 * Slowly increase speed
                 */

                gameSpeed =
                    Math.min(
                        5.5,
                        3 +
                        score * .035
                    );

            }

        }
    );


    /*
     * Move coins
     */

    coins.forEach(
        coin => {

            coin.x -=
                gameSpeed;

            coin.rotation +=
                .08;


            const distance =
                Math.hypot(
                    bird.x -
                    coin.x,

                    bird.y -
                    coin.y
                );


            if(
                distance <
                bird.radius +
                coin.radius
            ){

                if(!coin.collected){

                    coin.collected = true;

                    score++;

                    scoreEl.textContent =
                        score;

                    for(
                        let i=0;
                        i<10;
                        i++
                    ){

                        createParticle(
                            coin.x,
                            coin.y,
                            "coin"
                        );

                    }

                }

            }

        }
    );


    /*
     * Remove old pipes
     */

    pipes =
        pipes.filter(
            pipe =>
                pipe.x >
                -pipe.width-20
        );


    coins =
        coins.filter(
            coin =>
                coin.x > -30 &&
                !coin.collected
        );


    /*
     * Clouds
     */

    clouds.forEach(
        cloud => {

            cloud.x -=
                cloud.speed;

            if(
                cloud.x <
                -cloud.size*3
            ){

                cloud.x =
                    W +
                    cloud.size*2;

            }

        }
    );


    /*
     * Particles
     */

    particles.forEach(
        particle => {

            particle.x +=
                particle.vx;

            particle.y +=
                particle.vy;

            particle.life -=
                .025;

        }
    );


    particles =
        particles.filter(
            p =>
                p.life > 0
        );


    /*
     * Collision
     */

    checkCollision();

}


/* =====================================================
   SCORE PARTICLES
===================================================== */

function createScoreParticles(
    x,
    y
){

    for(
        let i=0;
        i<12;
        i++
    ){

        createParticle(
            x,
            y
        );

    }

}


/* =====================================================
   COLLISION
===================================================== */

function checkCollision(){

    /*
     * Ground
     */

    if(
        bird.y +
        bird.radius >
        H -
        groundHeight
    ){

        gameOver();

        return;

    }


    /*
     * Ceiling
     */

    if(
        bird.y -
        bird.radius <
        0
    ){

        gameOver();

        return;

    }


    /*
     * Pipes
     */

    for(
        const pipe of pipes
    ){

        const hitX =
            bird.x +
            bird.radius >
            pipe.x &&

            bird.x -
            bird.radius <
            pipe.x +
            pipe.width;


        if(!hitX)
            continue;


        const hitTop =
            bird.y -
            bird.radius <
            pipe.top;


        const hitBottom =
            bird.y +
            bird.radius >
            pipe.top +
            pipe.gap;


        if(
            hitTop ||
            hitBottom
        ){

            gameOver();

            return;

        }

    }

}


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#38bdf8"
    );

    gradient.addColorStop(
        .55,
        "#7dd3fc"
    );

    gradient.addColorStop(
        1,
        "#d9f99d"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
     * Sun
     */

    ctx.beginPath();

    ctx.arc(
        W*.8,
        H*.18,
        55,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "rgba(255,245,157,.8)";

    ctx.fill();


    /*
     * Clouds
     */

    clouds.forEach(
        cloud => {

            drawCloud(
                cloud.x,
                cloud.y,
                cloud.size
            );

        }
    );


    /*
     * Ground
     */

    ctx.fillStyle =
        "#65a30d";

    ctx.fillRect(
        0,
        H-groundHeight,
        W,
        groundHeight
    );


    ctx.fillStyle =
        "#84cc16";

    ctx.fillRect(
        0,
        H-groundHeight,
        W,
        12
    );

}


/* =====================================================
   CLOUD
===================================================== */

function drawCloud(
    x,
    y,
    size
){

    ctx.save();

    ctx.fillStyle =
        "rgba(255,255,255,.82)";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size*.55,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+size*.55,
        y-10,
        size*.7,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+size*1.1,
        y,
        size*.5,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =====================================================
   DRAW PIPE
===================================================== */

function drawPipe(
    pipe
){

    const x =
        pipe.x;

    const w =
        pipe.width;

    /*
     * Top pipe
     */

    drawSinglePipe(
        x,
        0,
        w,
        pipe.top,
        true
    );


    /*
     * Bottom pipe
     */

    drawSinglePipe(
        x,
        pipe.top +
        pipe.gap,
        w,
        H -
        groundHeight -
        pipe.top -
        pipe.gap,
        false
    );

}


function drawSinglePipe(
    x,
    y,
    width,
    height,
    top
){

    const gradient =
        ctx.createLinearGradient(
            x,
            0,
            x+width,
            0
        );

    gradient.addColorStop(
        0,
        "#166534"
    );

    gradient.addColorStop(
        .35,
        "#22c55e"
    );

    gradient.addColorStop(
        .7,
        "#4ade80"
    );

    gradient.addColorStop(
        1,
        "#15803d"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    /*
     * Pipe cap
     */

    const capHeight =
        25;

    const capWidth =
        width + 12;

    const capX =
        x - 6;

    let capY;


    if(top){

        capY =
            height -
            capHeight;

    }else{

        capY =
            y;

    }


    ctx.fillRect(
        capX,
        capY,
        capWidth,
        capHeight
    );


    /*
     * Highlight
     */

    ctx.fillStyle =
        "rgba(255,255,255,.18)";

    ctx.fillRect(
        x+10,
        y,
        8,
        height
    );

}


/* =====================================================
   DRAW BIRD
===================================================== */

function drawBird(){

    ctx.save();

    ctx.translate(
        bird.x,
        bird.y
    );

    ctx.rotate(
        bird.rotation
    );


    /*
     * Shadow
     */

    ctx.shadowColor =
        "rgba(0,0,0,.25)";

    ctx.shadowBlur =
        12;

    ctx.shadowOffsetY =
        5;


    /*
     * Body
     */

    const gradient =
        ctx.createLinearGradient(
            -20,
            -20,
            20,
            20
        );

    gradient.addColorStop(
        0,
        "#fde047"
    );

    gradient.addColorStop(
        1,
        "#f97316"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        bird.radius,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur =
        0;


    /*
     * Wing
     */

    ctx.save();

    ctx.rotate(
        Math.sin(
            frame*.25
        )*.25
    );

    ctx.fillStyle =
        "#fbbf24";

    ctx.beginPath();

    ctx.ellipse(
        -7,
        7,
        14,
        7,
        -.35,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();


    /*
     * Eye
     */

    ctx.fillStyle =
        "white";

    ctx.beginPath();

    ctx.arc(
        7,
        -7,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#111827";

    ctx.beginPath();

    ctx.arc(
        9,
        -7,
        2.5,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
     * Beak
     */

    ctx.fillStyle =
        "#ef4444";

    ctx.beginPath();

    ctx.moveTo(
        15,
        0
    );

    ctx.lineTo(
        29,
        5
    );

    ctx.lineTo(
        15,
        9
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();

}


/* =====================================================
   DRAW COIN
===================================================== */

function drawCoin(
    coin
){

    ctx.save();

    ctx.translate(
        coin.x,
        coin.y
    );

    const scaleX =
        Math.cos(
            coin.rotation
        );

    ctx.scale(
        scaleX,
        1
    );


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        coin.radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "#facc15";

    ctx.fill();


    ctx.strokeStyle =
        "#f59e0b";

    ctx.lineWidth =
        3;

    ctx.stroke();


    ctx.fillStyle =
        "#fff7ae";

    ctx.font =
        "bold 12px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "$",
        0,
        1
    );


    ctx.restore();

}


/* =====================================================
   DRAW PARTICLES
===================================================== */

function drawParticles(){

    particles.forEach(
        particle => {

            ctx.save();

            ctx.globalAlpha =
                particle.life;

            ctx.fillStyle =
                "#ffffff";

            ctx.beginPath();

            ctx.arc(
                particle.x,
                particle.y,
                particle.size,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.restore();

        }
    );

}


/* =====================================================
   MAIN DRAW
===================================================== */

function draw(){

    drawBackground();


    pipes.forEach(
        pipe => {

            drawPipe(pipe);

        }
    );


    coins.forEach(
        coin => {

            drawCoin(coin);

        }
    );


    drawParticles();


    if(bird){

        drawBird();

    }


    /*
     * Pause overlay
     */

    if(paused){

        ctx.fillStyle =
            "rgba(0,0,0,.25)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 32px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "PAUSED",
            W/2,
            H/2
        );

    }

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(){

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   PAUSE
===================================================== */

const pauseBtn =
    document.getElementById(
        "pauseBtn"
    );


pauseBtn.addEventListener(
    "click",
    () => {

        if(!running)
            return;


        paused =
            !paused;


        pauseBtn.textContent =
            paused
            ? "▶"
            : "⏸";

    }
);


/* =====================================================
   BUTTONS
===================================================== */

document
.getElementById("startBtn")
.addEventListener(
    "click",
    startGame
);


document
.getElementById("restartBtn")
.addEventListener(
    "click",
    startGame
);


/* =====================================================
   TOUCH
===================================================== */

canvas.addEventListener(
    "pointerdown",
    (event) => {

        event.preventDefault();

        jump();

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    (event) => {

        if(
            event.code === "Space" ||
            event.code === "ArrowUp"
        ){

            event.preventDefault();

            jump();

        }


        if(
            event.code === "KeyP"
        ){

            if(running){

                paused =
                    !paused;

                pauseBtn.textContent =
                    paused
                    ? "▶"
                    : "⏸";

            }

        }

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

bird =
    createBird();


/*
 * Start animation loop.
 */

gameLoop();

</script>

</body>
</html>
