<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Fruit Cutter - GameBook</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:none;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at 20% 20%,#193b4f,transparent 35%),
        radial-gradient(circle at 80% 80%,#4c174b,transparent 35%),
        linear-gradient(135deg,#020617,#07111f,#16091b);
    color:white;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* ==============================
   BACKGROUND
============================== */

.bg-circle{
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    opacity:.18;
    animation:float 7s infinite ease-in-out;
}

.c1{
    width:220px;
    height:220px;
    background:#22d3ee;
    left:-70px;
    top:10%;
}

.c2{
    width:300px;
    height:300px;
    background:#ec4899;
    right:-100px;
    bottom:-80px;
    animation-delay:2s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-30px);
    }
}

/* ==============================
   TOP UI
============================== */

.topbar{
    position:absolute;
    z-index:20;
    top:12px;
    left:50%;
    transform:translateX(-50%);

    width:min(900px,94%);

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.stat{
    min-width:105px;
    padding:10px 15px;

    border-radius:15px;

    background:rgba(15,23,42,.7);
    border:1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(12px);

    text-align:center;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}

.stat small{
    display:block;
    color:#94a3b8;
    font-size:11px;
}

.stat strong{
    font-size:22px;
}

button{
    border:0;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.pause{
    padding:12px 17px;
    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );
}

/* ==============================
   CANVAS
============================== */

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* ==============================
   START SCREEN
============================== */

.screen{
    position:absolute;
    z-index:50;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.55);
    backdrop-filter:blur(9px);

    transition:.35s;
}

.screen.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.card{
    width:min(430px,90%);
    padding:35px 25px;

    text-align:center;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(15,23,42,.96),
            rgba(30,41,59,.94)
        );

    border:1px solid rgba(255,255,255,.1);

    box-shadow:
        0 30px 100px rgba(0,0,0,.65);

    animation:cardIn .55s ease;
}

.card h1{
    font-size:clamp(38px,10vw,60px);

    background:
        linear-gradient(
            90deg,
            #4ade80,
            #facc15,
            #fb7185
        );

    -webkit-background-clip:text;
    color:transparent;
}

.card p{
    color:#aab7ca;
    margin:12px 0 22px;
    line-height:1.6;
}

.start-btn{
    width:100%;
    padding:16px;

    border-radius:18px;

    font-size:17px;

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #0891b2
        );

    box-shadow:
        0 10px 30px rgba(16,185,129,.25);
}

.start-btn:active{
    transform:scale(.96);
}

.instructions{
    margin-top:18px;
    padding:14px;

    border-radius:15px;

    background:rgba(255,255,255,.05);

    color:#cbd5e1;
    font-size:13px;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:scale(.75) translateY(30px);
    }

    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

/* ==============================
   COMBO
============================== */

#combo{
    position:absolute;
    z-index:15;

    left:50%;
    top:22%;

    transform:translateX(-50%) scale(.5);

    font-size:42px;
    font-weight:900;

    opacity:0;

    text-shadow:
        0 4px 20px rgba(0,0,0,.7);

    pointer-events:none;
}

#combo.show{
    animation:comboPop .7s ease;
}

@keyframes comboPop{
    0%{
        opacity:0;
        transform:translateX(-50%) scale(.4);
    }

    30%{
        opacity:1;
        transform:translateX(-50%) scale(1.25);
    }

    70%{
        opacity:1;
        transform:translateX(-50%) scale(1);
    }

    100%{
        opacity:0;
        transform:translateX(-50%) scale(1.3);
    }
}

/* ==============================
   KNIFE TRAIL
============================== */

.knife-trail{
    position:absolute;
    z-index:10;

    height:5px;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            white,
            #67e8f9,
            white,
            transparent
        );

    box-shadow:
        0 0 10px #fff,
        0 0 25px #22d3ee;

    pointer-events:none;

    transform-origin:left center;
}

/* ==============================
   GAME OVER
============================== */

#gameOver h2{
    font-size:38px;
    margin-bottom:10px;
}

.final-score{
    font-size:25px;
    color:#facc15;
    margin:15px 0;
}

</style>
</head>

<body>

<div id="game">

    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>

    <!-- TOP UI -->

    <div class="topbar">

        <div class="stat">
            <small>SCORE</small>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <small>LEVEL</small>
            <strong id="level">1</strong>
        </div>

        <div class="stat">
            <small>LIVES</small>
            <strong id="lives">❤️❤️❤️</strong>
        </div>

        <button
            class="pause"
            id="pauseBtn">
            ⏸
        </button>

    </div>

    <!-- GAME CANVAS -->

    <canvas id="canvas"></canvas>

    <!-- COMBO -->

    <div id="combo">
        🔥 COMBO!
    </div>

    <!-- START -->

    <div
        id="startScreen"
        class="screen">

        <div class="card">

            <h1>🍉</h1>

            <h2>
                FRUIT CUTTER
            </h2>

            <p>
                Grab your knife and slice
                the fruits before they fall!
            </p>

            <button
                id="startBtn"
                class="start-btn">

                🔪 START CUTTING

            </button>

            <div class="instructions">

                🖐️ Mobile:
                Swipe your finger across fruits

                <br><br>

                🖱️ PC:
                Drag your mouse to slice

                <br><br>

                💣 Don't cut the bombs!

            </div>

        </div>

    </div>

    <!-- GAME OVER -->

    <div
        id="gameOver"
        class="screen hide">

        <div class="card">

            <h2>
                💥 GAME OVER
            </h2>

            <div class="final-score">

                Score:
                <span id="finalScore">
                    0
                </span>

            </div>

            <p id="bestText">
                Great slicing!
            </p>

            <button
                id="restartBtn"
                class="start-btn">

                🔄 PLAY AGAIN

            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext("2d");


let W =
    canvas.width =
    innerWidth;

let H =
    canvas.height =
    innerHeight;


function resize(){

    W =
        canvas.width =
        innerWidth;

    H =
        canvas.height =
        innerHeight;

}


addEventListener(
    "resize",
    resize
);


/* =====================================================
   GAME VARIABLES
===================================================== */

let fruits = [];

let particles = [];

let splashes = [];

let gameRunning = false;

let paused = false;

let score = 0;

let lives = 3;

let level = 1;

let combo = 0;

let lastSlice = 0;

let spawnTimer = 0;

let knifeX = 0;

let knifeY = 0;

let oldKnifeX = 0;

let oldKnifeY = 0;

let cutting = false;

let gameTime = 0;


/* =====================================================
   FRUIT TYPES
===================================================== */

const fruitTypes = [

    {
        name:"watermelon",
        emoji:"🍉",
        color:"#16a34a",
        inner:"#fb7185",
        radius:38,
        points:15
    },

    {
        name:"apple",
        emoji:"🍎",
        color:"#dc2626",
        inner:"#fecaca",
        radius:34,
        points:10
    },

    {
        name:"orange",
        emoji:"🍊",
        color:"#f97316",
        inner:"#fed7aa",
        radius:32,
        points:10
    },

    {
        name:"lemon",
        emoji:"🍋",
        color:"#eab308",
        inner:"#fef08a",
        radius:30,
        points:12
    },

    {
        name:"kiwi",
        emoji:"🥝",
        color:"#65a30d",
        inner:"#bef264",
        radius:31,
        points:12
    },

    {
        name:"peach",
        emoji:"🍑",
        color:"#fb7185",
        inner:"#fed7aa",
        radius:33,
        points:13
    }

];


/* =====================================================
   BOMB
===================================================== */

function createBomb(){

    return {

        x:
            Math.random()*W,

        y:
            H+60,

        vx:
            (Math.random()-.5)
            * (2+level*.15),

        vy:
            -(11+Math.random()*5),

        gravity:
            .22,

        radius:34,

        type:"bomb",

        rotation:
            Math.random()*Math.PI,

        rotSpeed:
            (Math.random()-.5)*.08

    };

}


/* =====================================================
   FRUIT
===================================================== */

function createFruit(){

    const type =
        fruitTypes[
            Math.floor(
                Math.random()*
                fruitTypes.length
            )
        ];


    return {

        x:
            50+
            Math.random()*
            Math.max(
                100,
                W-100
            ),

        y:
            H+60,

        vx:
            (Math.random()-.5)
            *
            (3+level*.3),

        vy:
            -(11+
            Math.random()*4+
            level*.35),

        gravity:
            .22+
            level*.01,

        radius:
            type.radius,

        type:type,

        rotation:
            Math.random()*
            Math.PI*2,

        rotSpeed:
            (Math.random()-.5)
            *.08,

        sliced:false

    };

}


/* =====================================================
   SPAWN
===================================================== */

function spawn(){

    /*
     * More fruits as level rises.
     */

    const count =
        Math.random() <
        Math.min(
            .35,
            level*.025
        )
        ? 2
        : 1;


    for(
        let i=0;
        i<count;
        i++
    ){

        fruits.push(
            createFruit()
        );

    }


    /*
     * Bomb chance
     */

    if(
        level>=2 &&
        Math.random()<
        .10+level*.005
    ){

        fruits.push(
            createBomb()
        );

    }

}


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function drawBackground(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
     * soft grid
     */

    ctx.save();

    ctx.globalAlpha=.07;

    ctx.strokeStyle="#fff";

    ctx.lineWidth=1;


    const gap=50;


    for(
        let x=0;
        x<W;
        x+=gap
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,H);

        ctx.stroke();

    }


    for(
        let y=0;
        y<H;
        y+=gap
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(W,y);

        ctx.stroke();

    }


    ctx.restore();

}


/* =====================================================
   DRAW FRUIT
===================================================== */

function drawFruit(f){

    ctx.save();

    ctx.translate(
        f.x,
        f.y
    );

    ctx.rotate(
        f.rotation
    );


    if(
        f.type==="bomb"
    ){

        drawBomb();

    }else{

        /*
         * Outer glow
         */

        ctx.shadowBlur=25;

        ctx.shadowColor=
            f.type.color;


        /*
         * Fruit body
         */

        const grad =
            ctx.createRadialGradient(
                -f.radius*.3,
                -f.radius*.4,
                2,
                0,
                0,
                f.radius
            );


        grad.addColorStop(
            0,
            "#ffffff"
        );

        grad.addColorStop(
            .12,
            f.type.color
        );

        grad.addColorStop(
            1,
            "#111827"
        );


        ctx.fillStyle =
            grad;


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            f.radius,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
         * Fruit inner
         */

        ctx.shadowBlur=0;

        ctx.fillStyle =
            f.type.inner;

        ctx.globalAlpha=.65;

        ctx.beginPath();

        ctx.arc(
            -f.radius*.12,
            -f.radius*.1,
            f.radius*.62,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.globalAlpha=1;


        /*
         * Fruit highlight
         */

        ctx.fillStyle="#fff";

        ctx.globalAlpha=.35;

        ctx.beginPath();

        ctx.ellipse(
            -f.radius*.3,
            -f.radius*.4,
            f.radius*.18,
            f.radius*.1,
            -.5,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.globalAlpha=1;


        /*
         * emoji detail
         */

        ctx.font =
            `${f.radius*1.25}px Arial`;

        ctx.textAlign="center";

        ctx.textBaseline="middle";

        ctx.fillText(
            f.type.emoji,
            0,
            2
        );

    }


    ctx.restore();

}


/* =====================================================
   BOMB DRAW
===================================================== */

function drawBomb(){

    ctx.shadowBlur=25;

    ctx.shadowColor="#ef4444";


    ctx.fillStyle="#111827";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        34,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    ctx.strokeStyle="#64748b";

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        29,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
     * Fuse
     */

    ctx.strokeStyle="#f59e0b";

    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        15,
        -25
    );

    ctx.quadraticCurveTo(
        30,
        -45,
        23,
        -55
    );

    ctx.stroke();


    /*
     * Fire
     */

    ctx.fillStyle="#f97316";

    ctx.beginPath();

    ctx.arc(
        23,
        -56,
        8+
        Math.sin(
            gameTime*.03
        )*3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.font="25px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
        "💣",
        0,
        0
    );

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(
    x,
    y,
    color
){

    for(
        let i=0;
        i<22;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)
                *10,

            vy:
                (Math.random()-.5)
                *10,

            life:
                1,

            size:
                2+
                Math.random()*5,

            color:color

        });

    }

}


/* =====================================================
   DRAW PARTICLES
===================================================== */

function drawParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;

        p.vy += .2;

        p.life -= .025;


        if(
            p.life<=0
        ){

            particles.splice(
                i,
                1
            );

            continue;

        }


        ctx.save();

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            p.color;

        ctx.shadowBlur=10;

        ctx.shadowColor =
            p.color;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

    }

}


/* =====================================================
   SLASH FRUIT
===================================================== */

function sliceFruit(
    f
){

    f.sliced=true;


    score +=
        f.type.points *
        Math.max(
            1,
            combo
        );


    combo++;

    lastSlice =
        Date.now();


    updateUI();


    createParticles(
        f.x,
        f.y,
        f.type.color
    );


    createFruitSplash(
        f
    );


    sliceSound();


    if(
        combo>=3
    ){

        showCombo();

    }


    /*
     * Level
     */

    const newLevel =
        Math.floor(
            score/150
        )+1;


    if(
        newLevel>level
    ){

        level =
            newLevel;

        levelSound();

    }

}


/* =====================================================
   FRUIT SPLASH
===================================================== */

function createFruitSplash(
    f
){

    for(
        let i=0;
        i<12;
        i++
    ){

        splashes.push({

            x:f.x,

            y:f.y,

            vx:
                (Math.random()-.5)
                *8,

            vy:
                (Math.random()-.5)
                *8,

            life:1,

            color:
                f.type.inner,

            size:
                3+
                Math.random()*5

        });

    }

}


/* =====================================================
   DRAW SPLASH
===================================================== */

function drawSplashes(){

    for(
        let i=splashes.length-1;
        i>=0;
        i--
    ){

        const s =
            splashes[i];


        s.x += s.vx;

        s.y += s.vy;

        s.vy += .15;

        s.life -= .035;


        if(
            s.life<=0
        ){

            splashes.splice(
                i,
                1
            );

            continue;

        }


        ctx.save();

        ctx.globalAlpha =
            s.life;

        ctx.fillStyle =
            s.color;

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

    }

}


/* =====================================================
   SLICE DETECTION
===================================================== */

function lineCircleHit(
    x1,
    y1,
    x2,
    y2,
    cx,
    cy,
    radius
){

    const dx =
        x2-x1;

    const dy =
        y2-y1;


    const length2 =
        dx*dx+
        dy*dy;


    if(
        length2===0
    ){

        return (
            Math.hypot(
                x1-cx,
                y1-cy
            )<=radius
        );

    }


    let t =
        (
            (cx-x1)*dx+
            (cy-y1)*dy
        ) /
        length2;


    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const px =
        x1+t*dx;

    const py =
        y1+t*dy;


    return (
        Math.hypot(
            px-cx,
            py-cy
        )<=radius
    );

}


/* =====================================================
   SLICE CHECK
===================================================== */

function checkSlice(){

    for(
        let i=fruits.length-1;
        i>=0;
        i--
    ){

        const f =
            fruits[i];


        if(
            f.sliced
        )
            continue;


        if(
            lineCircleHit(
                oldKnifeX,
                oldKnifeY,
                knifeX,
                knifeY,
                f.x,
                f.y,
                f.radius
            )
        ){

            /*
             * Bomb
             */

            if(
                f.type==="bomb"
            ){

                bombHit();

                fruits.splice(
                    i,
                    1
                );

                continue;

            }


            sliceFruit(f);


            /*
             * remove after small delay
             */

            setTimeout(
                ()=>{

                    const index =
                        fruits.indexOf(f);

                    if(index!==-1){

                        fruits.splice(
                            index,
                            1
                        );

                    }

                },
                80
            );

        }

    }

}


/* =====================================================
   KNIFE TRAIL
===================================================== */

function drawKnife(){

    if(!cutting)
        return;


    ctx.save();

    ctx.strokeStyle=
        "rgba(255,255,255,.9)";

    ctx.lineWidth=5;

    ctx.lineCap="round";

    ctx.shadowBlur=20;

    ctx.shadowColor="#22d3ee";


    ctx.beginPath();

    ctx.moveTo(
        oldKnifeX,
        oldKnifeY
    );

    ctx.lineTo(
        knifeX,
        knifeY
    );

    ctx.stroke();


    /*
     * Knife blade at cursor
     */

    const angle =
        Math.atan2(
            knifeY-oldKnifeY,
            knifeX-oldKnifeX
        );


    ctx.translate(
        knifeX,
        knifeY
    );

    ctx.rotate(
        angle
    );


    /*
     * Handle
     */

    ctx.fillStyle="#111827";

    ctx.fillRect(
        -8,
        -6,
        30,
        12
    );


    /*
     * Knife blade
     */

    const gradient =
        ctx.createLinearGradient(
            15,
            0,
            85,
            0
        );


    gradient.addColorStop(
        0,
        "#cbd5e1"
    );

    gradient.addColorStop(
        .5,
        "#fff"
    );

    gradient.addColorStop(
        1,
        "#64748b"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.moveTo(
        18,
        -8
    );

    ctx.lineTo(
        82,
        0
    );

    ctx.lineTo(
        18,
        8
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();

}


/* =====================================================
   UPDATE
===================================================== */

function update(){

    if(
        !gameRunning ||
        paused
    )
        return;


    gameTime++;


    /*
     * Spawn
     */

    spawnTimer--;


    const spawnRate =
        Math.max(
            25,
            65-level*2
        );


    if(
        spawnTimer<=0
    ){

        spawn();

        spawnTimer =
            spawnRate;

    }


    /*
     * Fruits
     */

    for(
        let i=fruits.length-1;
        i>=0;
        i--
    ){

        const f =
            fruits[i];


        f.x += f.vx;

        f.y += f.vy;

        f.vy += f.gravity;

        f.rotation +=
            f.rotSpeed;


        /*
         * Remove below screen
         */

        if(
            f.y >
            H+100
        ){

            /*
             * Only normal fruit
             */

            if(
                f.type!=="bomb" &&
                !f.sliced
            ){

                loseLife();

            }


            fruits.splice(
                i,
                1
            );

        }

    }


    /*
     * Combo timeout
     */

    if(
        Date.now()-lastSlice >
        1800
    ){

        combo=0;

    }


    checkSlice();

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    drawBackground();


    fruits.forEach(
        drawFruit
    );


    drawSplashes();

    drawParticles();

    drawKnife();

}


/* =====================================================
   LOOP
===================================================== */

function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );

}


loop();


/* =====================================================
   POINTER
===================================================== */

function pointerPosition(
    e
){

    const rect =
        canvas.getBoundingClientRect();


    if(
        e.touches
    ){

        knifeX =
            e.touches[0].clientX -
            rect.left;

        knifeY =
            e.touches[0].clientY -
            rect.top;

    }else{

        knifeX =
            e.clientX -
            rect.left;

        knifeY =
            e.clientY -
            rect.top;

    }

}


canvas.addEventListener(
    "pointerdown",
    e=>{

        if(
            !gameRunning ||
            paused
        )
            return;


        initAudio();

        pointerPosition(e);

        oldKnifeX =
            knifeX;

        oldKnifeY =
            knifeY;

        cutting=true;

    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(!cutting)
            return;


        oldKnifeX =
            knifeX;

        oldKnifeY =
            knifeY;


        pointerPosition(e);


        checkSlice();

    }
);


function stopCut(){

    cutting=false;

}


canvas.addEventListener(
    "pointerup",
    stopCut
);

canvas.addEventListener(
    "pointercancel",
    stopCut
);

canvas.addEventListener(
    "pointerleave",
    stopCut
);


/* =====================================================
   MISS / LIFE
===================================================== */

function loseLife(){

    if(!gameRunning)
        return;


    lives--;

    combo=0;

    missSound();

    updateUI();


    if(
        lives<=0
    ){

        endGame();

    }

}


/* =====================================================
   BOMB
===================================================== */

function bombHit(){

    lives--;

    combo=0;

    bombSound();

    createParticles(
        knifeX,
        knifeY,
        "#ef4444"
    );


    /*
     * Screen flash
     */

    document.body.animate(
        [
            {
                filter:"brightness(1)"
            },
            {
                filter:"brightness(2)"
            },
            {
                filter:"brightness(1)"
            }
        ],
        {
            duration:300
        }
    );


    updateUI();


    if(
        lives<=0
    ){

        endGame();

    }

}


/* =====================================================
   UI
===================================================== */

function updateUI(){

    document.getElementById(
        "score"
    ).textContent =
        score;


    document.getElementById(
        "level"
    ).textContent =
        level;


    document.getElementById(
        "lives"
    ).textContent =
        "❤️".repeat(
            Math.max(
                0,
                lives
            )
        );

}


function showCombo(){

    const el =
        document.getElementById(
            "combo"
        );


    el.textContent =
        `🔥 ${combo}x COMBO!`;


    el.classList.remove(
        "show"
    );


    void el.offsetWidth;


    el.classList.add(
        "show"
    );

}


/* =====================================================
   GAME START
===================================================== */

function startGame(){

    initAudio();


    fruits=[];

    particles=[];

    splashes=[];

    score=0;

    lives=3;

    level=1;

    combo=0;

    spawnTimer=10;

    gameTime=0;

    gameRunning=true;

    paused=false;


    updateUI();


    document
        .getElementById(
            "startScreen"
        )
        .classList
        .add("hide");

}


/* =====================================================
   END GAME
===================================================== */

function endGame(){

    gameRunning=false;

    paused=false;

    cutting=false;


    document.getElementById(
        "finalScore"
    ).textContent =
        score;


    const oldBest =
        Number(
            localStorage.getItem(
                "fruitBest"
            ) || 0
        );


    if(
        score>oldBest
    ){

        localStorage.setItem(
            "fruitBest",
            score
        );


        document.getElementById(
            "bestText"
        ).textContent =
            "🏆 New High Score!";

    }else{

        document.getElementById(
            "bestText"
        ).textContent =
            `Best Score: ${oldBest}`;

    }


    document
        .getElementById(
            "gameOver"
        )
        .classList
        .remove("hide");

}


/* =====================================================
   PAUSE
===================================================== */

document
.getElementById(
    "pauseBtn"
)
.addEventListener(
    "click",
    ()=>{

        if(!gameRunning)
            return;


        paused=!paused;


        document.getElementById(
            "pauseBtn"
        ).textContent =
            paused
            ? "▶"
            : "⏸";

    }
);


/* =====================================================
   BUTTONS
===================================================== */

document
.getElementById(
    "startBtn"
)
.addEventListener(
    "click",
    startGame
);


document
.getElementById(
    "restartBtn"
)
.addEventListener(
    "click",
    ()=>{

        document
            .getElementById(
                "gameOver"
            )
            .classList
            .add("hide");


        startGame();

    }
);


/* =====================================================
   SOUND ENGINE
===================================================== */

let audio =
    null;


function audioInit(){

    if(!audio){

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

}


function tone(
    freq,
    duration,
    type="sine",
    volume=.08
){

    audioInit();


    if(
        audio.state==="suspended"
    ){

        audio.resume();

    }


    const osc =
        audio.createOscillator();

    const gain =
        audio.createGain();


    osc.type =
        type;

    osc.frequency.value =
        freq;


    gain.gain.setValueAtTime(
        .001,
        audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        volume,
        audio.currentTime+.01
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime+
        duration
    );


    osc.connect(gain);

    gain.connect(
        audio.destination
    );


    osc.start();

    osc.stop(
        audio.currentTime+
        duration+
        .03
    );

}


/* =====================================================
   SLICE SOUND
===================================================== */

function sliceSound(){

    tone(
        900,
        .05,
        "triangle",
        .06
    );


    setTimeout(
        ()=>{
            tone(
                1300,
                .06,
                "triangle",
                .05
            );
        },
        30
    );

}


/* =====================================================
   MISS SOUND
===================================================== */

function missSound(){

    tone(
        180,
        .18,
        "sawtooth",
        .07
    );

}


/* =====================================================
   BOMB SOUND
===================================================== */

function bombSound(){

    tone(
        80,
        .35,
        "sawtooth",
        .15
    );


    setTimeout(
        ()=>{
            tone(
                50,
                .3,
                "square",
                .1
            );
        },
        100
    );

}


/* =====================================================
   LEVEL SOUND
===================================================== */

function levelSound(){

    tone(
        500,
        .1
    );


    setTimeout(
        ()=>{
            tone(
                700,
                .1
            );
        },
        100
    );


    setTimeout(
        ()=>{
            tone(
                1000,
                .2
            );
        },
        200
    );

}


/* =====================================================
   INITIAL UI
===================================================== */

updateUI();

</script>
