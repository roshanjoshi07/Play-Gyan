<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Fruit Cutter</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    font-family:Arial,sans-serif;
    background:#020617;
}

body{
    color:white;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 50% 25%,
        #164e63,
        #07111f 45%,
        #020617 100%
    );
}

.glow{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    filter:blur(110px);
    opacity:.13;
    pointer-events:none;
}

.glow1{
    background:#06b6d4;
    left:-170px;
    top:-120px;
}

.glow2{
    background:#9333ea;
    right:-170px;
    bottom:-120px;
}

/* HUD */

.hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    z-index:20;

    display:flex;
    justify-content:space-between;
}

.hud-box{
    min-width:100px;
    padding:9px 16px;

    text-align:center;

    border-radius:16px;

    background:rgba(15,23,42,.78);
    border:1px solid rgba(255,255,255,.13);

    backdrop-filter:blur(10px);

    box-shadow:0 10px 30px #0006;
}

.hud-box small{
    display:block;
    color:#94a3b8;
    font-size:10px;
}

.hud-box strong{
    font-size:22px;
}

/* CANVAS */

canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:5;

    cursor:crosshair;
}

/* SCREENS */

.screen{
    position:absolute;
    inset:0;
    z-index:100;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:rgba(2,6,23,.78);
    backdrop-filter:blur(12px);
}

.hidden{
    display:none !important;
}

.card{
    width:min(440px,100%);

    padding:35px 25px;

    text-align:center;

    border-radius:30px;

    background:
    linear-gradient(
        145deg,
        rgba(15,23,42,.98),
        rgba(30,41,59,.96)
    );

    border:1px solid rgba(255,255,255,.12);

    box-shadow:0 30px 100px #0009;

    animation:cardIn .5s ease;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:scale(.8) translateY(30px);
    }

    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.icon{
    font-size:75px;

    animation:float 1.7s ease-in-out infinite;
}

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

.card h1{
    font-size:38px;

    background:
    linear-gradient(
        90deg,
        #22d3ee,
        #a855f7,
        #facc15
    );

    -webkit-background-clip:text;
    color:transparent;
}

.card p{
    color:#94a3b8;
    line-height:1.7;
    margin:15px 0 25px;
}

.start-btn{
    width:100%;
    padding:16px;

    border:0;
    border-radius:18px;

    color:white;
    font-size:17px;
    font-weight:bold;

    background:
    linear-gradient(
        135deg,
        #0891b2,
        #7c3aed
    );

    box-shadow:0 12px 35px #7c3aed55;

    cursor:pointer;
}

.start-btn:active{
    transform:scale(.97);
}

/* SCORE POPUP */

#message{
    position:absolute;

    left:50%;
    top:43%;

    z-index:40;

    transform:translate(-50%,-50%);

    font-size:42px;
    font-weight:900;

    opacity:0;

    pointer-events:none;

    text-shadow:0 5px 20px #000;
}

#message.show{
    animation:scorePop .7s ease;
}

@keyframes scorePop{

    0%{
        opacity:0;
        transform:
        translate(-50%,-30%)
        scale(.5);
    }

    25%{
        opacity:1;
        transform:
        translate(-50%,-50%)
        scale(1.2);
    }

    100%{
        opacity:0;
        transform:
        translate(-50%,-75%)
        scale(1);
    }
}

/* MOBILE */

@media(max-width:600px){

    .hud{
        top:8px;
        left:8px;
        right:8px;
    }

    .hud-box{
        min-width:82px;
        padding:7px 11px;
    }

    .hud-box strong{
        font-size:18px;
    }

    .card h1{
        font-size:32px;
    }

}
</style>
</head>

<body>

<div id="game">

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<!-- HUD -->

<div class="hud">

    <div class="hud-box">
        <small>SCORE</small>
        <strong id="score">0</strong>
    </div>

    <div class="hud-box">
        <small>BEST</small>
        <strong id="best">0</strong>
    </div>

</div>


<!-- GAME -->

<canvas id="canvas"></canvas>

<div id="message">+10</div>


<!-- START SCREEN -->

<div id="startScreen" class="screen">

    <div class="card">

        <div class="icon">🍉</div>

        <h1>Fruit Cutter</h1>

        <p>
            👆 Finger swipe गरेर फल काट्नुहोस्!<br><br>

            🍎 Fruit = +10 Score<br>
            💣 Bomb लाई छोयो = Game Over<br>
            ⏱️ No Timer<br>
            🎯 Fruit छुट्दा कुनै penalty छैन
        </p>

        <button
            class="start-btn"
            id="startBtn">

            🎮 START GAME

        </button>

    </div>

</div>


<!-- GAME OVER -->

<div
id="gameOver"
class="screen hidden">

    <div class="card">

        <div class="icon">💥</div>

        <h1>GAME OVER</h1>

        <p>

            💣 You touched the bomb!

            <br><br>

            Score:
            <strong id="finalScore">0</strong>

            <br>

            Best:
            <strong id="finalBest">0</strong>

        </p>

        <button
            class="start-btn"
            id="restartBtn">

            🔄 PLAY AGAIN

        </button>

    </div>

</div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    const dpr =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );

    canvas.width =
    W * dpr;

    canvas.height =
    H * dpr;

    canvas.style.width =
    W + "px";

    canvas.style.height =
    H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   GAME VARIABLES
===================================================== */

let fruits = [];

let particles = [];

let trail = [];

let score = 0;

let best =
Number(
    localStorage.getItem(
        "fruitCutterBest"
    ) || 0
);

let playing = false;

let spawnTimer = 0;

let lastTime = 0;


/* =====================================================
   FRUIT TYPES
===================================================== */

const fruitTypes = [

    {
        emoji:"🍎",
        color:"#ef4444"
    },

    {
        emoji:"🍊",
        color:"#fb923c"
    },

    {
        emoji:"🍉",
        color:"#22c55e"
    },

    {
        emoji:"🍍",
        color:"#facc15"
    },

    {
        emoji:"🍋",
        color:"#fde047"
    },

    {
        emoji:"🍇",
        color:"#a855f7"
    },

    {
        emoji:"🍑",
        color:"#fb7185"
    },

    {
        emoji:"🥝",
        color:"#84cc16"
    }

];


/* =====================================================
   CREATE FRUIT
===================================================== */

function createFruit(){

    const type =
    fruitTypes[
        Math.floor(
            Math.random() *
            fruitTypes.length
        )
    ];

    const size =
    38 +
    Math.random() * 18;

    fruits.push({

        x:
        60 +
        Math.random() *
        (W - 120),

        y:
        H + 70,

        vx:
        (Math.random() - .5) * 4,

        vy:
        -(10 + Math.random() * 5),

        gravity:.25,

        size:size,

        type:type,

        rotation:
        Math.random() * Math.PI * 2,

        rotationSpeed:
        (Math.random() - .5) * .08,

        bomb:false,

        sliced:false

    });

}


/* =====================================================
   CREATE BOMB
===================================================== */

function createBomb(){

    fruits.push({

        x:
        60 +
        Math.random() *
        (W - 120),

        y:
        H + 70,

        vx:
        (Math.random() - .5) * 4,

        vy:
        -(10 + Math.random() * 5),

        gravity:.25,

        size:46,

        rotation:
        Math.random() * 6,

        rotationSpeed:
        (Math.random() - .5) * .08,

        bomb:true,

        sliced:false

    });

}


/* =====================================================
   SPAWN
===================================================== */

function spawn(){

    createFruit();

    if(
        Math.random() < .35
    ){

        createFruit();

    }

    /*
       Bomb chance gradually increases,
       but there is no timer.
    */

    if(
        Math.random() < .12
    ){

        createBomb();

    }

}


/* =====================================================
   DRAW FRUIT
===================================================== */

function drawFruit(f){

    ctx.save();

    ctx.translate(
        f.x,
        f.y
    );

    ctx.rotate(
        f.rotation
    );

    ctx.textAlign =
    "center";

    ctx.textBaseline =
    "middle";

    ctx.font =
    `${f.size}px Arial`;

    ctx.shadowBlur = 20;

    if(f.bomb){

        ctx.shadowColor =
        "#ef4444";

        ctx.fillText(
            "💣",
            0,
            0
        );

    }else{

        ctx.shadowColor =
        f.type.color;

        ctx.fillText(
            f.type.emoji,
            0,
            0
        );

    }

    ctx.restore();

}


/* =====================================================
   UPDATE FRUITS
===================================================== */

function updateFruits(dt){

    for(
        let i = fruits.length - 1;
        i >= 0;
        i--
    ){

        const f =
        fruits[i];

        f.x +=
        f.vx * dt;

        f.y +=
        f.vy * dt;

        f.vy +=
        f.gravity * dt;

        f.rotation +=
        f.rotationSpeed * dt;


        /*
           IMPORTANT:
           Missing fruit does nothing.
        */

        if(
            f.y > H + 120
        ){

            fruits.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   SWIPE TRAIL
===================================================== */

function drawTrail(){

    if(
        trail.length < 2
    )
        return;

    ctx.save();

    ctx.lineCap =
    "round";

    ctx.lineJoin =
    "round";

    /*
       Outer glow
    */

    ctx.shadowColor =
    "#67e8f9";

    ctx.shadowBlur =
    22;

    ctx.strokeStyle =
    "rgba(103,232,249,.9)";

    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(
        trail[0].x,
        trail[0].y
    );

    for(
        let i = 1;
        i < trail.length;
        i++
    ){

        ctx.lineTo(
            trail[i].x,
            trail[i].y
        );

    }

    ctx.stroke();


    /*
       Bright center
    */

    ctx.shadowBlur = 0;

    ctx.strokeStyle =
    "#ffffff";

    ctx.lineWidth = 2.5;

    ctx.beginPath();

    ctx.moveTo(
        trail[0].x,
        trail[0].y
    );

    for(
        let i = 1;
        i < trail.length;
        i++
    ){

        ctx.lineTo(
            trail[i].x,
            trail[i].y
        );

    }

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   DISTANCE FROM POINT TO LINE
===================================================== */

function pointLineDistance(
    px,
    py,
    x1,
    y1,
    x2,
    y2
){

    const A =
    px - x1;

    const B =
    py - y1;

    const C =
    x2 - x1;

    const D =
    y2 - y1;

    const dot =
    A * C +
    B * D;

    const len =
    C * C +
    D * D;

    let t =
    len === 0
    ? -1
    : dot / len;

    t =
    Math.max(
        0,
        Math.min(
            1,
            t
        )
    );

    const xx =
    x1 + t * C;

    const yy =
    y1 + t * D;

    const dx =
    px - xx;

    const dy =
    py - yy;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =====================================================
   CHECK SWIPE
===================================================== */

function checkSwipe(){

    if(
        trail.length < 2
    )
        return;

    const p1 =
    trail[
        trail.length - 2
    ];

    const p2 =
    trail[
        trail.length - 1
    ];


    for(
        let i = fruits.length - 1;
        i >= 0;
        i--
    ){

        const f =
        fruits[i];

        if(
            f.sliced
        )
            continue;


        const distance =
        pointLineDistance(
            f.x,
            f.y,
            p1.x,
            p1.y,
            p2.x,
            p2.y
        );


        /*
           Swipe must pass through
           fruit.
        */

        if(
            distance <
            f.size * .65
        ){

            if(f.bomb){

                hitBomb(
                    f,
                    i
                );

            }else{

                cutFruit(
                    f,
                    i
                );

            }

        }

    }

}


/* =====================================================
   CUT FRUIT
===================================================== */

function cutFruit(
    fruit,
    index
){

    fruit.sliced =
    true;

    score += 10;

    if(
        score > best
    ){

        best =
        score;

        localStorage.setItem(
            "fruitCutterBest",
            best
        );

    }


    document.getElementById(
        "score"
    ).textContent =
    score;

    document.getElementById(
        "best"
    ).textContent =
    best;


    /*
       Fruit particles
    */

    createParticles(
        fruit.x,
        fruit.y,
        fruit.type.color,
        28
    );


    fruits.splice(
        index,
        1
    );


    sliceSound();


    showMessage(
        "+10",
        "#67e8f9"
    );

}


/* =====================================================
   BOMB
===================================================== */

function hitBomb(
    bomb,
    index
){

    /*
       ONE TOUCH = GAME OVER
    */

    createParticles(
        bomb.x,
        bomb.y,
        "#ef4444",
        70
    );

    bombSound();

    fruits.splice(
        index,
        1
    );

    showMessage(
        "💣 BOOM!",
        "#ef4444"
    );

    setTimeout(
        gameOver,
        250
    );

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(
    x,
    y,
    color,
    amount
){

    for(
        let i = 0;
        i < amount;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
            (Math.random() - .5)
            * 12,

            vy:
            (Math.random() - .5)
            * 12,

            life:1,

            size:
            2 +
            Math.random() * 6,

            color:color

        });

    }

}


function updateParticles(dt){

    for(
        let i = particles.length - 1;
        i >= 0;
        i--
    ){

        const p =
        particles[i];

        p.x +=
        p.vx * dt;

        p.y +=
        p.vy * dt;

        p.vy +=
        .35 * dt;

        p.life -=
        .025 * dt;

        if(
            p.life <= 0
        ){

            particles.splice(
                i,
                1
            );

        }

    }

}


function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha =
        p.life;

        ctx.fillStyle =
        p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    ctx.globalAlpha = 1;

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    fruits.forEach(
        drawFruit
    );

    drawParticles();

    drawTrail();

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(time){

    if(!lastTime)
        lastTime = time;

    const dt =
    Math.min(
        (time - lastTime) / 16.67,
        2
    );

    lastTime = time;


    if(playing){

        spawnTimer += dt;


        /*
           This is NOT a timer.
           It only controls fruit spawning.
        */

        const spawnSpeed =
        Math.max(
            30,
            62 -
            score * .08
        );


        if(
            spawnTimer >
            spawnSpeed
        ){

            spawn();

            spawnTimer = 0;

        }


        updateFruits(dt);

        updateParticles(dt);

    }


    draw();

    requestAnimationFrame(
        loop
    );

}


/* =====================================================
   POINTER / FINGER
===================================================== */

let slicing = false;


/*
   Convert screen position
   to canvas position.
*/

function getPosition(e){

    const rect =
    canvas.getBoundingClientRect();

    return {

        x:
        e.clientX -
        rect.left,

        y:
        e.clientY -
        rect.top

    };

}


/*
   START SWIPE
*/

canvas.addEventListener(
    "pointerdown",
    function(e){

        if(!playing)
            return;

        slicing = true;

        trail = [];

        const p =
        getPosition(e);

        trail.push(p);

    }
);


/*
   MOVE FINGER
*/

canvas.addEventListener(
    "pointermove",
    function(e){

        if(
            !slicing ||
            !playing
        )
            return;

        const p =
        getPosition(e);

        trail.push(p);


        /*
           Keep only recent
           swipe positions.
        */

        if(
            trail.length > 14
        ){

            trail.shift();

        }


        checkSwipe();

    }
);


/*
   END SWIPE
*/

function endSwipe(){

    slicing = false;

    trail = [];

}

canvas.addEventListener(
    "pointerup",
    endSwipe
);

canvas.addEventListener(
    "pointercancel",
    endSwipe
);

canvas.addEventListener(
    "pointerleave",
    endSwipe
);


/* =====================================================
   GAME START
===================================================== */

function startGame(){

    score = 0;

    fruits = [];

    particles = [];

    trail = [];

    spawnTimer = 0;

    lastTime = 0;

    playing = true;


    document.getElementById(
        "score"
    ).textContent = "0";

    document.getElementById(
        "best"
    ).textContent = best;


    document.getElementById(
        "startScreen"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "gameOver"
    ).classList.add(
        "hidden"
    );

    startSound();

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    playing = false;

    fruits = [];

    particles = [];

    trail = [];


    document.getElementById(
        "finalScore"
    ).textContent =
    score;

    document.getElementById(
        "finalBest"
    ).textContent =
    best;


    document.getElementById(
        "gameOver"
    ).classList.remove(
        "hidden"
    );


    gameOverSound();

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    color
){

    const message =
    document.getElementById(
        "message"
    );

    message.textContent =
    text;

    message.style.color =
    color;

    message.classList.remove(
        "show"
    );

    void message.offsetWidth;

    message.classList.add(
        "show"
    );

}


/* =====================================================
   SOUND
===================================================== */

let audioCtx = null;


function audio(){

    if(!audioCtx){

        audioCtx =
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(
        audioCtx.state ===
        "suspended"
    ){

        audioCtx.resume();

    }

}


function tone(
    frequency,
    duration,
    type="sine",
    volume=.07
){

    audio();

    const osc =
    audioCtx.createOscillator();

    const gain =
    audioCtx.createGain();

    osc.type =
    type;

    osc.frequency.value =
    frequency;

    gain.gain.setValueAtTime(
        .001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime + .02
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime +
        duration
    );

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime +
        duration +
        .03
    );

}


function startSound(){

    tone(500,.1);

    setTimeout(
        () => tone(700,.1),
        100
    );

    setTimeout(
        () => tone(1000,.18),
        200
    );

}


function sliceSound(){

    tone(
        850,
        .05,
        "triangle",
        .08
    );

    setTimeout(
        () => {

            tone(
                1250,
                .08,
                "triangle",
                .06
            );

        },
        40
    );

}


function bombSound(){

    tone(
        100,
        .4,
        "sawtooth",
        .13
    );

    setTimeout(
        () => {

            tone(
                55,
                .5,
                "square",
                .1
            );

        },
        100
    );

}


function gameOverSound(){

    tone(
        350,
        .15
    );

    setTimeout(
        () => tone(240,.18),
        150
    );

    setTimeout(
        () => tone(120,.4),
        300
    );

}


/* =====================================================
   BUTTONS
===================================================== */

document.getElementById(
    "startBtn"
).addEventListener(
    "click",
    startGame
);

document.getElementById(
    "restartBtn"
).addEventListener(
    "click",
    startGame
);


/* =====================================================
   INITIAL
===================================================== */

document.getElementById(
    "best"
).textContent =
best;

requestAnimationFrame(
    loop
);

</script>
