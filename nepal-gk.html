/* =====================================================
   DISPLAY

const box = document.getElementById("questions");

function displayQuestions(list){

    box.innerHTML = "";

    if(list.length === 0){
        box.innerHTML =
        '<div class="no-result">कुनै प्रश्न भेटिएन। अर्को शब्द खोज्नुहोस्।</div>';
        return;
    }

    let category = "";

    list.forEach((item,index)=>{

        if(item[0] !== category){

            category = item[0];

            const heading = document.createElement("div");

            heading.className = "category";

            heading.innerHTML = `
                <div class="category-bar"></div>
                <h2>${category}</h2>
            `;

            box.appendChild(heading);
        }

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="question">
                <span class="qno">
                    प्रश्न ${index + 1}:
                </span>
                ${item[1]}
            </div>

            <div class="answer">
                <span>उत्तर:</span>
                ${item[2]}
            </div>
        `;

        box.appendChild(card);
    });
}

displayQuestions(questions);


/* =====================================================
   SEARCH
===================================================== */

function searchQuestions(){

    const value =
        document
        .getElementById("searchBox")
        .value
        .toLowerCase()
        .trim();

    if(!value){
        displayQuestions(questions);
        return;
    }

    const result = questions.filter(item =>
        item[0].toLowerCase().includes(value) ||
        item[1].toLowerCase().includes(value) ||
        item[2].toLowerCase().includes(value)
    );

    displayQuestions(result);
}
