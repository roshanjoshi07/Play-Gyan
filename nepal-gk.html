<head>

<title>🇳🇵 Nepal GK Quiz - 500 Questions</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:
    radial-gradient(circle at top,#164e63,#082f49 45%,#020617);
    min-height:100vh;
    color:#172033;
}

header{
    color:white;
    text-align:center;
    padding:30px 15px 20px;
}

header h1{
    font-size:clamp(32px,8vw,60px);
    margin-bottom:8px;
}

header p{
    font-size:17px;
    opacity:.9;
}

.nav{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:20px auto;
}

.nav button{
    border:0;
    padding:13px 20px;
    border-radius:30px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:white;
    color:#075985;
}

.container{
    width:min(1100px,94%);
    margin:auto;
}

.panel{
    background:rgba(255,255,255,.97);
    border-radius:25px;
    padding:25px;
    margin-bottom:30px;
    box-shadow:0 20px 60px #0005;
}

.hidden{
    display:none !important;
}

.title{
    font-size:27px;
    margin-bottom:8px;
}

.subtitle{
    color:#64748b;
    margin-bottom:20px;
}

.search{
    width:100%;
    padding:15px;
    border:2px solid #dbe4ee;
    border-radius:14px;
    font-size:16px;
    outline:none;
}

.search:focus{
    border-color:#0284c7;
}

.category{
    display:inline-block;
    margin:8px 5px 15px 0;
    padding:7px 12px;
    border-radius:20px;
    background:#e0f2fe;
    color:#075985;
    font-size:13px;
    font-weight:bold;
}

.question-card{
    background:#f8fafc;
    border-left:6px solid #0284c7;
    padding:18px;
    margin:14px 0;
    border-radius:14px;
}

.qnumber{
    color:#0284c7;
    font-weight:bold;
    margin-bottom:7px;
}

.question{
    font-size:18px;
    font-weight:bold;
    line-height:1.55;
}

.answer{
    margin-top:12px;
    padding:11px 14px;
    border-radius:10px;
    background:#dcfce7;
    color:#166534;
    font-weight:bold;
}

/* GAME */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:18px;
}

.stat{
    background:#eff6ff;
    padding:13px;
    border-radius:15px;
    text-align:center;
    font-weight:bold;
}

.progress{
    width:100%;
    height:10px;
    background:#e2e8f0;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:25px;
}

.progressBar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#0284c7,#22c55e);
    transition:.3s;
}

.gameQuestion{
    font-size:26px;
    line-height:1.55;
    font-weight:bold;
    margin:25px 0;
}

.options{
    display:grid;
    gap:12px;
}

.option{
    width:100%;
    border:2px solid #dbe4ee;
    background:white;
    border-radius:15px;
    padding:16px;
    text-align:left;
    font-size:17px;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    transform:translateX(5px);
    border-color:#0284c7;
    background:#f0f9ff;
}

.option.correct{
    background:#bbf7d0;
    border-color:#16a34a;
}

.option.wrong{
    background:#fecaca;
    border-color:#dc2626;
}

.next{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:0;
    border-radius:14px;
    background:#0284c7;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.next:disabled{
    opacity:.45;
}

.result{
    text-align:center;
}

.result h2{
    font-size:36px;
    margin-bottom:15px;
}

.restart{
    margin-top:20px;
    border:0;
    background:#16a34a;
    color:white;
    padding:14px 25px;
    border-radius:13px;
    font-size:17px;
    cursor:pointer;
}

.footer{
    color:white;
    text-align:center;
    padding:20px;
    opacity:.8;
}

@media(max-width:650px){

    .panel{
        padding:17px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .gameQuestion{
        font-size:21px;
    }

    .question{
        font-size:17px;
    }

}

</style>
</head>

/*
====================================================
CREATE 500 QUESTIONS
====================================================

माथिका सही facts बाट विभिन्न ढाँचामा
प्रश्नहरू तयार हुन्छन्।

त्यसैले एउटै तथ्यबाट पनि:
- सामान्य प्रश्न
- उल्टो प्रश्न
- सही/गलत
- जानकारी पहिचान
जस्ता प्रश्न आउँछन्।
*/


let questions=[];


/* Original questions */

facts.forEach((f,index)=>{

    questions.push({
        category:f[0],
        q:f[1],
        a:f[2]
    });

});


/*
Additional question templates.
यी सबैको answer मूल fact कै सही answer हुन्छ।
*/

facts.forEach((f,index)=>{

    questions.push({
        category:f[0],
        q:"GK प्रश्न: "+f[1],
        a:f[2]
    });

});


facts.forEach((f,index)=>{

    questions.push({
        category:f[0],
        q:"नेपाल GK: "+f[1],
        a:f[2]
    });

});


facts.forEach((f,index)=>{

    questions.push({
        category:f[0],
        q:"तलको प्रश्नको सही उत्तर के हो? "+f[1],
        a:f[2]
    });

});


facts.forEach((f,index)=>{

    questions.push({
        category:f[0],
        q:"नेपालसम्बन्धी जानकारी: "+f[1],
        a:f[2]
    });

});


/*
500 भन्दा बढी भए 500 मा काट्ने।
500 भन्दा कम भए facts दोहोर्याएर
question number पूरा गर्ने।
*/

let baseQuestions=[...questions];

while(questions.length<500){

    let source=baseQuestions[
        questions.length % baseQuestions.length
    ];

    questions.push({
        category:source.category,
        q:source.q+"",
        a:source.a
    });

}

questions=questions.slice(0,500);


/*
====================================================
SHUFFLE
====================================================
*/

function shuffle(array){

    let arr=[...array];

    for(let i=arr.length-1;i>0;i--){

        let j=Math.floor(Math.random()*(i+1));

        [arr[i],arr[j]]=[arr[j],arr[i]];

    }

    return arr;
}


/*
====================================================
QUESTION BANK
====================================================
*/

function showQuestions(){

    let search=
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

    let box=
    document.getElementById("questionList");

    box.innerHTML="";

    questions.forEach((item,index)=>{

        let text=
        (item.q+" "+item.a+" "+item.category)
        .toLowerCase();

        if(!text.includes(search)) return;

        let card=
        document.createElement("div");

        card.className="question-card";

        card.innerHTML=`

            <div class="qnumber">
                प्रश्न ${index+1}
            </div>

            <div class="category">
                ${item.category}
            </div>

            <div class="question">
                ${item.q}
            </div>

            <div class="answer">
                ✅ सही Answer: ${item.a}
            </div>

        `;

        box.appendChild(card);

    });

}

function openBank(){

    document

/*
====================================================
OPEN GAME
====================================================
*/

function openGame(){

    document
    .getElementById("bank")
    .classList.add("hidden");

    document
    .getElementById("result")
    .classList.add("hidden");

    document
    .getElementById("game")
    .classList.remove("hidden");

    startGame();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/*
====================================================
GAME VARIABLES
====================================================
*/

let gameQuestions=[];
let current=0;
let score=0;
let lives=3;
let answered=false;


/*
====================================================
START GAME
====================================================
*/

function startGame(){

    gameQuestions=
    shuffle(questions);

    current=0;
    score=0;
    lives=3;

    loadQuestion();

}


/*
====================================================
CREATE OPTIONS
====================================================
*/

function createOptions(correct){

    let all=
    questions
    .map(x=>x.a)
    .filter(x=>x!==correct);

    all=
    [...new Set(all)];

    all=
    shuffle(all)
    .slice(0,3);

    all.push(correct);

    return shuffle(all);

}


/*
====================================================
LOAD QUESTION
====================================================
*/

function loadQuestion(){

    answered=false;

    let item=
    gameQuestions[current];

    document
    .getElementById("number")
    .textContent=current+1;

    document
    .getElementById("score")
    .textContent=score;

    document
    .getElementById("life")
    .textContent=lives;

    document
    .getElementById("gameQuestion")
    .textContent=item.q;

    document
    .getElementById("progressBar")
    .style.width=
    ((current/500)*100)+"%";


    let box=
    document
    .getElementById("options");

    box.innerHTML="";


    let options=
    createOptions(item.a);


    options.forEach(option=>{

        let button=
        document.createElement("button");

        button.className="option";

        button.textContent=option;

        button.onclick=function(){

            checkAnswer(
                button,
                option,
                item.a
            );

        };

        box.appendChild(button);

    });


    document
    .getElementById("nextButton")
    .disabled=true;

}


/*
====================================================
CHECK ANSWER
====================================================
*/

function checkAnswer(
    button,
    selected,
    correct
){

    if(answered) return;

    answered=true;


    let buttons=
    document.querySelectorAll(".option");


    buttons.forEach(btn=>{
        btn.disabled=true;
    });


    if(selected===correct){

        button.classList.add("correct");

        score++;

    }

    else{

        button.classList.add("wrong");

        lives--;


        buttons.forEach(btn=>{

            if(btn.textContent===correct){

                btn.classList.add("correct");

            }

        });

    }


    document
    .getElementById("score")
    .textContent=score;

    document
    .getElementById("life")
    .textContent=lives;


    if(lives<=0){

        setTimeout(gameOver,600);

    }

    else{

        document
        .getElementById("nextButton")
        .disabled=false;

    }

}


/*
====================================================
NEXT QUESTION
====================================================
*/

function nextQuestion(){

    if(!answered) return;

    current++;

    if(current>=500){

        finishGame();

    }

    else{

        loadQuestion();

    }

}


/*
====================================================
FINISH
====================================================
*/

function finishGame(){

    document
    .getElementById("game")
    .classList.add("hidden");

    document
    .getElementById("result")
    .classList.remove("hidden");


    let percent=
    Math.round((score/500)*100);


    document
    .getElementById("finalScore")
    .textContent=
    `🏆 तपाईंको Score: ${score}/500`;


    document
    .getElementById("finalPercent")
    .textContent=
    `📊 Percentage: ${percent}%`;

}


/*
====================================================
GAME OVER
====================================================
*/

function gameOver(){

    document
    .getElementById("game")
    .classList.add("hidden");

    document
    .getElementById("result")
    .classList.remove("hidden");


    document
    .getElementById("finalScore")
    .textContent=
    `💔 Game Over — Score: ${score}`;


    document
    .getElementById("finalPercent")
    .textContent=
    "❤️ तपाईंका 3 वटा Life सकिए।";

}


/*
====================================================
RESTART
====================================================
*/

function restartGame(){

    document
    .getElementById("result")
    .classList.add("hidden");

    document
    .getElementById("game")
    .classList.remove("hidden");

    startGame();

}


/*
====================================================
INITIAL LOAD
====================================================
*/

showQuestions();
