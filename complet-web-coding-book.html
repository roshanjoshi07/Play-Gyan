/* =====================================================
   VARIABLES
===================================================== */

let current = 0;

const classNumber =
document.getElementById("classNumber");

const classTitle =
document.getElementById("classTitle");

const content =
document.getElementById("content");

const classButtons =
document.getElementById("classButtons");

const backBtn =
document.getElementById("backBtn");

const nextBtn =
document.getElementById("nextBtn");


/* =====================================================
   CREATE BUTTONS
===================================================== */

classes.forEach((item,index)=>{

    const button =
    document.createElement("button");

    button.textContent =
    index === classes.length - 1
    ? "FINAL"
    : index + 1;

    button.onclick =
    function(){

        loadClass(index);

    };

    classButtons.appendChild(button);

});


/* =====================================================
   LOAD CLASS
===================================================== */

function loadClass(index){

    current = index;

    classNumber.textContent =
    index === classes.length - 1
    ? "FINAL LESSON"
    : "CLASS " + (index + 1);

    classTitle.textContent =
    classes[index].title;

    content.innerHTML =
    classes[index].content;

    document
    .querySelectorAll(
        ".buttons button"
    )
    .forEach((button,i)=>{

        button.classList.toggle(
            "active",
            i === current
        );

    });

    backBtn.disabled =
    current === 0;

    nextBtn.disabled =
    current === classes.length - 1;

    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =====================================================
   NEXT
===================================================== */

function nextClass(){

    if(
        current <
        classes.length - 1
    ){

        loadClass(
            current + 1
        );

    }

}


/* =====================================================
   BACK
===================================================== */

function previousClass(){

    if(current > 0){

        loadClass(
            current - 1
        );

    }

}


/* =====================================================
   HOME
===================================================== */

function goHome(){

    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =====================================================
   START
===================================================== */

loadClass(0);

</script>

</body>
</html>
