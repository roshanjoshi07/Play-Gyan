/* =====================================================

let current = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const title =
document.getElementById(
    "chapterTitle"
);

const label =
document.getElementById(
    "chapterLabel"
);

const story =
document.getElementById(
    "story"
);

const chapterButtons =
document.getElementById(
    "chapterButtons"
);

const backBtn =
document.getElementById(
    "backBtn"
);

const nextBtn =
document.getElementById(
    "nextBtn"
);


/* =====================================================
   CHAPTER BUTTONS
===================================================== */

chapters.forEach(
    (chapter,index)=>{

        const button =
        document.createElement(
            "button"
        );

        button.textContent =
        index + 1;

        button.onclick =
        ()=>loadChapter(index);

        chapterButtons.appendChild(
            button
        );

    }
);


/* =====================================================
   LOAD CHAPTER
===================================================== */

function loadChapter(index){

    current = index;

    label.textContent =
        "CHAPTER " + (index + 1);

    title.textContent =
        chapters[index].title;

    story.innerHTML =
        chapters[index].story;

    document
        .querySelectorAll(
            ".chapter-buttons button"
        )
        .forEach(
            (button,i)=>{

                button.classList.toggle(
                    "active",
                    i === current
                );

            }
        );

    backBtn.disabled =
        current === 0;

    nextBtn.disabled =
        current === chapters.length - 1;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   NEXT
===================================================== */

function nextChapter(){

    if(
        current <
        chapters.length - 1
    ){

        loadChapter(
            current + 1
        );

    }

}


/* =====================================================
   BACK
===================================================== */

function previousChapter(){

    if(current > 0){

        loadChapter(
            current - 1
        );

    }

}


/* =====================================================
   HOME
===================================================== */

function goHome(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   LIVE CODE RUNNER
===================================================== */

function runCode(){

    const code =
        document.getElementById(
            "codeEditor"
        ).value;

    const preview =
        document.getElementById(
            "preview"
        );

    preview.srcdoc = code;

}


/* =====================================================
   START
===================================================== */

loadChapter(0);

</script>

</body>
