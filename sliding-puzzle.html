<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sliding Puzzle</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    padding: 15px;
}

.game {
    width: 100%;
    max-width: 500px;
    text-align: center;
}

h1 {
    font-size: 34px;
    margin-bottom: 8px;
}

.subtitle {
    color: #ccc;
    margin-bottom: 20px;
}

.top {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

select {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
}

.info {
    display: flex;
    justify-content: space-between;
    background: rgba(255,255,255,0.12);
    padding: 14px 18px;
    border-radius: 14px;
    margin-bottom: 15px;
}

.board {
    width: 100%;
    aspect-ratio: 1;
    display: grid;
    gap: 7px;
    padding: 7px;
    background: rgba(0,0,0,0.4);
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
}

.tile {
    border: none;
    border-radius: 12px;
    background: linear-gradient(145deg, #00c6ff, #0072ff);
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 10px rgba(0,0,0,0.3);
    transition: transform 0.12s, filter 0.12s;
}

.tile:hover {
    transform: scale(0.94);
    filter: brightness(1.2);
}

.tile:active {
    transform: scale(0.88);
}

.empty {
    background: transparent;
    box-shadow: none;
    cursor: default;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 13px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.shuffle {
    background: #00e676;
    color: #111;
}

.reset {
    background: #ffca28;
    color: #111;
}

.btn:hover {
    transform: translateY(-2px);
}

.message {
    min-height: 30px;
    margin-top: 18px;
    font-size: 19px;
    font-weight: bold;
    color: #00ffb3;
}

@media(max-width: 400px) {

    h1 {
        font-size: 28px;
    }

    .board {
        gap: 4px;
        padding: 5px;
    }

    .tile {
        border-radius: 8px;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>🧩 Sliding Puzzle</h1>

    <p class="subtitle">
        नम्बरहरूलाई सही क्रममा मिलाउनुहोस्
    </p>

    <!-- Puzzle Size -->
    <div class="top">

        <select id="size" onchange="newGame()">
            <option value="3">3 × 3</option>
            <option value="4" selected>4 × 4</option>
            <option value="5">5 × 5</option>
            <option value="6">6 × 6</option>
            <option value="7">7 × 7</option>
            <option value="8">8 × 8</option>
        </select>

    </div>

    <!-- Information -->
    <div class="info">

        <span>
            🔢 Numbers:
            <b id="numbers">15</b>
        </span>

        <span>
            👣 Moves:
            <b id="moves">0</b>
        </span>

    </div>

    <!-- Puzzle Board -->
    <div id="board" class="board"></div>

    <!-- Buttons -->
    <div class="buttons">

        <button class="btn shuffle" onclick="newGame()">
            🔀 Shuffle
        </button>

        <button class="btn reset" onclick="resetGame()">
            🔄 Reset
        </button>

    </div>

    <div id="message" class="message"></div>

</div>


<script>

let size = 4;
let total = 16;

let puzzle = [];

let moves = 0;


// ======================================
// GET SIZE
// ======================================

function getSize() {

    size = Number(
        document.getElementById("size").value
    );

    total = size * size;

}


// ======================================
// CREATE SOLVED PUZZLE
// ======================================

function createSolvedPuzzle() {

    let array = [];

    for(let i = 1; i < total; i++) {

        array.push(i);

    }

    // Empty space
    array.push(0);

    return array;

}


// ======================================
// DRAW PUZZLE
// ======================================

function drawPuzzle() {

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    board.style.gridTemplateColumns =
        `repeat(${size}, 1fr)`;


    puzzle.forEach((number, index) => {

        const tile =
            document.createElement("button");

        tile.className = "tile";


        // Empty space
        if(number === 0) {

            tile.classList.add("empty");

        }

        else {

            tile.textContent = number;

            tile.onclick = function() {

                moveTile(index);

            };


            // Automatic font size
            if(size <= 3) {

                tile.style.fontSize = "30px";

            }

            else if(size <= 4) {

                tile.style.fontSize = "27px";

            }

            else if(size <= 5) {

                tile.style.fontSize = "22px";

            }

            else if(size <= 6) {

                tile.style.fontSize = "18px";

            }

            else {

                tile.style.fontSize = "14px";

            }

        }


        board.appendChild(tile);

    });


    document.getElementById("moves")
        .textContent = moves;


    document.getElementById("numbers")
        .textContent = total - 1;

}


// ======================================
// FIND EMPTY SPACE
// ======================================

function getEmpty() {

    return puzzle.indexOf(0);

}


// ======================================
// CHECK ADJACENT TILE
// ======================================

function isAdjacent(a, b) {

    const rowA =
        Math.floor(a / size);

    const colA =
        a % size;


    const rowB =
        Math.floor(b / size);

    const colB =
        b % size;


    return (
        Math.abs(rowA - rowB) +
        Math.abs(colA - colB)
    ) === 1;

}


// ======================================
// MOVE TILE
// ======================================

function moveTile(index) {

    const empty =
        getEmpty();


    // Tile is not next to empty space
    if(!isAdjacent(index, empty)) {

        return;

    }


    // Swap
    [
        puzzle[index],
        puzzle[empty]

    ] = [

        puzzle[empty],
        puzzle[index]

    ];


    // Unlimited moves
    moves++;


    drawPuzzle();


    // Check winning
    if(checkWin()) {

        document.getElementById("message")
            .textContent =
            "🎉 Congratulations! You Win!";

    }

}


// ======================================
// CHECK WIN
// ======================================

function checkWin() {

    for(let i = 0; i < total - 1; i++) {

        if(puzzle[i] !== i + 1) {

            return false;

        }

    }


    return puzzle[total - 1] === 0;

}


// ======================================
// SHUFFLE PUZZLE
// ======================================

function shufflePuzzle() {

    puzzle =
        createSolvedPuzzle();


    let previous = -1;


    // More size = more shuffle
    const shuffleCount =
        Math.max(500, total * 50);


    for(let i = 0; i < shuffleCount; i++) {

        const empty =
            getEmpty();


        let possible = [];


        for(let j = 0; j < total; j++) {

            if(
                isAdjacent(j, empty) &&
                j !== previous
            ) {

                possible.push(j);

            }

        }


        const random =
            possible[
                Math.floor(
                    Math.random() *
                    possible.length
                )
            ];


        [
            puzzle[random],
            puzzle[empty]

        ] = [

            puzzle[empty],
            puzzle[random]

        ];


        previous = empty;

    }

}


// ======================================
// NEW GAME
// ======================================

function newGame() {

    getSize();

    moves = 0;

    document.getElementById("message")
        .textContent = "";


    shufflePuzzle();

    drawPuzzle();

}


// ======================================
// RESET GAME
// ======================================

function resetGame() {

    getSize();

    moves = 0;

    document.getElementById("message")
        .textContent = "";


    puzzle =
        createSolvedPuzzle();


    drawPuzzle();

}


// ======================================
// START GAME
// ======================================

newGame();

</script>

</body>
</html>
