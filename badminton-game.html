<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Badminton Smash</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    background:#071b25;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        linear-gradient(
            #64c9ed 0%,
            #b4e4e7 42%,
            #3d9a72 43%,
            #176347 100%
        );
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

/* HUD */

.hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    z-index:10;
    display:flex;
    justify-content:center;
    pointer-events:none;
}

.scoreboard{
    display:flex;
    align-items:center;
    gap:22px;
    padding:10px 22px;
    border-radius:20px;
    color:white;
    background:rgba(0,30,40,.55);
    backdrop-filter:blur(10px);
    box-shadow:0 8px 25px #0005;
}

.score{
    text-align:center;
    min-width:80px;
}

.score small{
    display:block;
    opacity:.7;
    font-size:11px;
}

.score strong{
    font-size:30px;
}

.vs{
    color:#ffe052;
    font-weight:bold;
}

/* Buttons */

.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:18px;
    z-index:12;
    display:flex;
    justify-content:center;
    gap:10px;
}

button{
    border:0;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.control{
    width:62px;
    height:58px;
    border-radius:18px;
    background:#002b35aa;
    border:1px solid #ffffff44;
    backdrop-filter:blur(8px);
    font-size:24px;
}

.hit{
    width:85px;
    background:linear-gradient(
        135deg,
        #ffb52e,
        #ef5b25
    );
}

.control:active{
    transform:scale(.9);
}

.pause{
    position:absolute;
    right:15px;
    top:72px;
    z-index:12;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#002b35aa;
    font-size:18px;
}

/* Start / Game Over */

.screen{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    color:white;
    background:rgba(0,25,35,.48);
    backdrop-filter:blur(4px);
}

.screen h1{
    font-size:clamp(42px,10vw,75px);
    text-shadow:0 8px 25px #0008;
    margin:8px 0;
}

.screen p{
    margin-bottom:24px;
    opacity:.9;
}

.start{
    padding:16px 35px;
    border-radius:40px;
    background:#ffd044;
    color:#173033;
    font-size:18px;
    box-shadow:0 8px 25px #0006;
}

.hidden{
    display:none!important;
}

.tip{
    position:absolute;
    bottom:88px;
    left:0;
    right:0;
    z-index:8;
    text-align:center;
    color:white;
    opacity:.65;
    font-size:12px;
}

@media(max-width:600px){
    .scoreboard{
        gap:12px;
        padding:8px 14px;
    }

    .score{
        min-width:65px;
    }

    .score strong{
        font-size:25px;
    }

    .control{
        width:55px;
        height:53px;
    }

    .hit{
        width:75px;
    }
}
</style>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div class="hud">

            <small>YOU</small>

        </div>

        <div class="vs">VS</div>

        <div class="score">
            <small>CPU</small>
            <strong id="cpuScore">0</strong>

</div>

<button class="pause" id="pause">Ⅱ</button>

</div>


<!-- START -->

<div class="screen" id="startScreen">

    <div style="font-size:70px">

    </div>

    <h1>Badminton Smash</h1>

    <p>

    </p>

    </button>

    </div>

    </h1>

        Final Score:
        <b id="finalScore">0 - 0</b>
    </p>

        PLAY AGAIN
    </button>

</div>

</div>


<script>

/* =====================================================
   BADMINTON SMASH
===================================================== */

const canvas=
document.getElementById("canvas");

const ctx=
canvas.getContext("2d");

let W=0;
let H=0;
let dpr=1;

function resize(){

    W=innerWidth;
    H=innerHeight;

    dpr=
    Math.min(
        devicePixelRatio||1,
        2
    );

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}

resize();

addEventListener(
    "resize",
    resize
);


/* =====================================================
   GAME STATE
===================================================== */

let running=false;
let paused=false;

let playerScore=0;
let cpuScore=0;

let playerX=0;
let cpuX=0;

let playerVX=0;

let shuttle={
    x:0,
    y:0,
    vx:0,
    vy:0,
    lastHit:"player"
};

let particles=[];

let keys={
    left:false,
    right:false
};

let frame=0;


/* =====================================================
   AUDIO
===================================================== */

let audio=null;

function initAudio(){

    if(!audio){

        audio=
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(
        audio.state==="suspended"
    ){
        audio.resume();
    }
}

function sound(
    frequency,
    duration=.1,
    type="sine",
    volume=.05
){

    if(!audio)return;

    const osc=
    audio.createOscillator();

    const gain=
    audio.createGain();

    osc.type=type;

    osc.frequency.value=
    frequency;

    gain.gain.value=
    volume;

    osc.connect(gain);

    gain.connect(
        audio.destination
    );

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime+duration
    );

    osc.stop(
        audio.currentTime+duration
    );
}


/* =====================================================
   COURT
===================================================== */

function court(){

    const top=H*.25;
    const bottom=H*.87;
    const left=W*.08;
    const right=W*.92;

    /* Floor */

    ctx.fillStyle="#247c58";

    ctx.fillRect(
        0,
        H*.43,
        W,
        H*.57
    );

    /* Court */

    ctx.strokeStyle=
        "rgba(255,255,255,.9)";

    ctx.lineWidth=3;

    ctx.strokeRect(
        left,
        top,
        right-left,
        bottom-top
    );

    /* Center line */

    ctx.beginPath();

    ctx.moveTo(
        W/2,
        top
    );

    ctx.lineTo(
        W/2,
        bottom
    );

    ctx.stroke();

    /* Service lines */

    ctx.beginPath();

    ctx.moveTo(
        left,
        H*.55
    );

    ctx.lineTo(
        right,
        H*.55
    );

    ctx.stroke();

    /* Net */

    const netY=H*.48;

    ctx.fillStyle=
        "rgba(20,30,30,.3)";

    ctx.fillRect(
        W*.495,
        netY-50,
        W*.01,
        100
    );

    ctx.strokeStyle=
        "#ffffffaa";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        W/2,
        netY-55
    );

    ctx.lineTo(
        W/2,
        netY+55
    );

    ctx.stroke();

    /* Net mesh */

    ctx.strokeStyle=
        "rgba(255,255,255,.25)";

    ctx.lineWidth=1;

    for(
        let y=netY-50;
        y<netY+50;
        y+=8
    ){

        ctx.beginPath();

        ctx.moveTo(
            W*.48,
            y
        );

        ctx.lineTo(
            W*.52,
            y
        );

        ctx.stroke();

    }

}


/* =====================================================
   BACKGROUND
===================================================== */

function background(){

    const sky=
    ctx.createLinearGradient(
        0,0,0,H
    );

    sky.addColorStop(
        0,
        "#6bd2f0"
    );

    sky.addColorStop(
        .42,
        "#d5f0e7"
    );

    sky.addColorStop(
        .43,
        "#247c58"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,0,W,H
    );

    /* Lights */

    for(
        let i=0;
        i<6;
        i++
    ){

        const x=
        i*W/5;

        ctx.fillStyle=
        "rgba(255,255,255,.2)";

        ctx.beginPath();

        ctx.arc(
            x,
            H*.12,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =====================================================
   PLAYER
===================================================== */

function drawPlayer(){

    const y=
        H*.75;

    ctx.save();

    ctx.translate(
        playerX,
        y
    );

    const bob=
        Math.sin(frame*.18)*3;

    ctx.translate(
        0,
        bob
    );


    /* Shadow */

    ctx.fillStyle=
        "#0005";

    ctx.beginPath();

    ctx.ellipse(
        0,
        6,
        28,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Legs */

    ctx.strokeStyle=
        "#17242a";

    ctx.lineWidth=9;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        -7,
        -30
    );

    ctx.lineTo(
        -17,
        0
    );

    ctx.moveTo(
        7,
        -30
    );

    ctx.lineTo(
        17,
        0
    );

    ctx.stroke();


    /* Body */

    ctx.fillStyle=
        "#1565c0";

    ctx.beginPath();

    ctx.roundRect(
        -20,
        -88,
        40,
        60,
        12
    );

    ctx.fill();


    /* Arms */

    ctx.strokeStyle=
        "#c98260";

    ctx.lineWidth=8;

    ctx.beginPath();

    ctx.moveTo(
        -17,
        -70
    );

    ctx.lineTo(
        -38,
        -47
    );

    ctx.moveTo(
        17,
        -70
    );

    ctx.lineTo(
        37,
        -50
    );

    ctx.stroke();


    /* Head */

    ctx.fillStyle=
        "#c98260";

    ctx.beginPath();

    ctx.arc(
        0,
        -106,
        18,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Hair */

    ctx.fillStyle="#202020";

    ctx.beginPath();

    ctx.arc(
        0,
        -112,
        19,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /* Racket */

    ctx.strokeStyle=
        "#d7e6ef";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.ellipse(
        42,
        -73,
        16,
        22,
        -.5,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        34,
        -57
    );

    ctx.lineTo(
        23,
        -37
    );

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   CPU
===================================================== */

function drawCPU(){

    const y=
        H*.32;

    ctx.save();

    ctx.translate(
        cpuX,
        y
    );

    const bob=
        Math.sin(frame*.16+2)*3;

    ctx.translate(
        0,
        bob
    );

    /* Shadow */

    ctx.fillStyle="#0005";

    ctx.beginPath();

    ctx.ellipse(
        0,
        7,
        28,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Legs */

    ctx.strokeStyle=
        "#182329";

    ctx.lineWidth=9;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
        -7,
        0
    );

    ctx.lineTo(
        -17,
        30
    );

    ctx.moveTo(
        7,
        0
    );

    ctx.lineTo(
        17,
        30
    );

    ctx.stroke();


    /* Body */

    ctx.fillStyle=
        "#e74c3c";

    ctx.beginPath();

    ctx.roundRect(
        -20,
        -60,
        40,
        60,
        12
    );

    ctx.fill();


    /* Head */

    ctx.fillStyle=
        "#c98260";

    ctx.beginPath();

    ctx.arc(
        0,
        -78,
        18,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Hair */

    ctx.fillStyle=
        "#1c1c1c";

    ctx.beginPath();

    ctx.arc(
        0,
        -84,
        19,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /* Racket */

    ctx.strokeStyle=
        "#e9f4ff";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.ellipse(
        -40,
        -42,
        16,
        22,
        .5,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        -31,
        -25
    );

    ctx.lineTo(
        -22,
        -5
    );

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   SHUTTLE
===================================================== */

function drawShuttle(){

    ctx.save();

    ctx.translate(
        shuttle.x,
        shuttle.y
    );

    const angle=
        Math.atan2(
            shuttle.vy,
            shuttle.vx
        );

    ctx.rotate(
        angle
    );

    /* Speed trail */

    if(
        Math.abs(
            shuttle.vx
        )+
        Math.abs(
            shuttle.vy
        )>8
    ){

        ctx.strokeStyle=
            "rgba(255,255,255,.35)";

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.moveTo(
            -25,
            0
        );

        ctx.lineTo(
            -5,
            0
        );

        ctx.stroke();

    }


    /* Cork */

    ctx.fillStyle=
        "#f5d58c";

    ctx.beginPath();

    ctx.arc(
        8,
        0,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Feathers */

    ctx.fillStyle=
        "#ffffff";

    ctx.beginPath();

    ctx.moveTo(
        3,
        -4
    );

    ctx.lineTo(
        -22,
        -15
    );

    ctx.lineTo(
        -17,
        0
    );

    ctx.lineTo(
        -22,
        15
    );

    ctx.lineTo(
        3,
        4
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

}


/* =====================================================
   PLAYER HIT
===================================================== */

function playerHit(){

    if(
        !running ||
        paused
    )return;

    const distance=
        Math.abs(
            shuttle.x-playerX
        );

    if(
        shuttle.y>H*.58 &&
        distance<90
    ){

        shuttle.vx=
            (shuttle.x-playerX)*.08;

        shuttle.vy=
            -13;

        shuttle.lastHit=
            "player";

        burst(
            shuttle.x,
            shuttle.y,
            12,
            "#ffffff"
        );

        sound(
            850,
            .09,
            "square",
            .06
        );

    }

}


/* =====================================================
   CPU AI
===================================================== */

function updateCPU(){

    const target=
        shuttle.x;

    cpuX +=
        (target-cpuX)*.035;

    cpuX=
        Math.max(
            W*.15,
            Math.min(
                W*.85,
                cpuX
            )
        );

}


/* =====================================================
   SHUTTLE PHYSICS
===================================================== */

function updateShuttle(){

    shuttle.x+=
        shuttle.vx;

    shuttle.y+=
        shuttle.vy;

    shuttle.vy+=
        .35;

    /* Side walls */

    if(
        shuttle.x<20 ||
        shuttle.x>W-20
    ){

        shuttle.vx*=-.85;

        shuttle.x=
            Math.max(
                20,
                Math.min(
                    W-20,
                    shuttle.x
                )
            );

    }


    /* CPU hit */

    if(
        shuttle.lastHit==="player" &&
        shuttle.y<H*.43 &&
        shuttle.y>H*.25 &&
        Math.abs(
            shuttle.x-cpuX
        )<80
    ){

        shuttle.vy=
            11;

        shuttle.vx=
            (shuttle.x-cpuX)*.09;

        shuttle.lastHit=
            "cpu";

        sound(
            700,
            .08,
            "square",
            .05
        );

        burst(
            shuttle.x,
            shuttle.y,
            8,
            "#ffffff"
        );

    }


    /* Player hit zone */

    if(
        shuttle.lastHit==="cpu" &&
        shuttle.y>H*.57 &&
        shuttle.y<H*.79 &&
        Math.abs(
            shuttle.x-playerX
        )<80
    ){

        /* Automatic defense if player doesn't hit */

        shuttle.vy=
            -11;

        shuttle.vx=
            (shuttle.x-playerX)*.08;

        shuttle.lastHit=
            "player";

        sound(
            650,
            .08,
            "square",
            .04
        );

    }


    /* Point */

    if(
        shuttle.y>H+40
    ){

        cpuScore++;

        point(
            "cpu"
        );

    }

    if(
        shuttle.y<-40
    ){

        playerScore++;

        point(
            "player"
        );

    }

}


/* =====================================================
   POINT
===================================================== */

function point(winner){

    updateScore();

    if(
        playerScore>=11 ||
        cpuScore>=11
    ){

        endMatch();

        return;

    }

    sound(
        winner==="player"
        ? 1000
        : 150,
        .25,
        winner==="player"
        ? "sine"
        : "sawtooth",
        .06
    );

    setTimeout(
        serve,
        700
    );

}


/* =====================================================
   SERVE
===================================================== */

function serve(){

    if(
        !running
    )return;

    shuttle.x=
        Math.random()<
        .5
        ? W*.35
        : W*.65;

    shuttle.y=
        H*.45;

    shuttle.vx=
        (Math.random()-.5)*5;

    shuttle.vy=
        -10;

    shuttle.lastHit=
        "player";

}


/* =====================================================
   SCORE
===================================================== */

function updateScore(){

    document.getElementById(
        "playerScore"
    ).textContent=
        playerScore;

    document.getElementById(
        "cpuScore"
    ).textContent=
        cpuScore;

}


/* =====================================================
   PARTICLES
===================================================== */

function burst(
    x,
    y,
    amount,
    color
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*6,

            vy:
                (Math.random()-.5)*6,

            life:1,

            size:
                2+
                Math.random()*4,

            color:color

        });

    }

}

function updateParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];

        p.x+=p.vx;

        p.y+=p.vy;

        p.life-=.04;

        if(
            p.life<=0
        ){

            particles.splice(
                i,
                1
            );

        }

    }

}

function drawParticles(){

    particles.forEach(
        p=>{

            ctx.globalAlpha=
                p.life;

            ctx.fillStyle=
                p.color;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI*2
            );

            ctx.fill();

        }
    );

    ctx.globalAlpha=1;

}


/* =====================================================
   UPDATE
===================================================== */

function update(){

    if(
        !running ||
        paused
    )return;

    frame++;

    updatePlayer();

    updateCPU();

    updateShuttle();

    updateParticles();

}


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function updatePlayer(){

    if(keys.left)
        playerVX=-8;

    else if(keys.right)
        playerVX=8;

    else
        playerVX*=.8;

    playerX+=
        playerVX;

    playerX=
        Math.max(
            W*.08,
            Math.min(
                W*.92,
                playerX
            )
        );

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    background();

    court();

    drawCPU();

    drawPlayer();

    drawShuttle();

    drawParticles();

}


/* =====================================================
   LOOP
===================================================== */

function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );

}

loop();


/* =====================================================
   START MATCH
===================================================== */

function startGame(){

    initAudio();

    running=true;
    paused=false;

    playerScore=0;
    cpuScore=0;

    playerX=W*.3;
    cpuX=W*.7;

    updateScore();

    document.getElementById(
        "startScreen"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "gameOver"
    ).classList.add(
        "hidden"
    );

    serve();

    sound(
        550,
        .12,
        "sine",
        .05
    );

}


/* =====================================================
   END MATCH
===================================================== */

function endMatch(){

    running=false;

    const win=
        playerScore>
        cpuScore;

    document.getElementById(
        "winner"
    ).textContent=
        win
        ? "🏆 YOU WIN!"
        : "🤖 CPU WINS!";

    document.getElementById(
        "finalScore"
    ).textContent=
        playerScore+
        " - "+
        cpuScore;

    document.getElementById(
        "gameOver"
    ).classList.remove(
        "hidden"
    );

    sound(
        win ? 1000 : 120,
        .4,
        win ? "sine" : "sawtooth",
        .08
    );

}


/* =====================================================
   BUTTONS
===================================================== */

document.getElementById(
    "start"
).onclick=
startGame;

document.getElementById(
    "restart"
).onclick=
startGame;


/* LEFT */

document.getElementById(
    "left"
).addEventListener(
    "pointerdown",
    ()=>{
        keys.left=true;
    }
);

document.getElementById(
    "left"
).addEventListener(
    "pointerup",
    ()=>{
        keys.left=false;
    }
);


/* RIGHT */

document.getElementById(
    "right"
).addEventListener(
    "pointerdown",
    ()=>{
        keys.right=true;
    }
);

document.getElementById(
    "right"
).addEventListener(
    "pointerup",
    ()=>{
        keys.right=false;
    }
);


/* HIT */

document.getElementById(
    "hit"
).addEventListener(
    "pointerdown",
    playerHit
);


/* =====================================================
   PAUSE
===================================================== */

document.getElementById(
    "pause"
).onclick=
()=>{

    if(!running)
        return;

    paused=!paused;

    document.getElementById(
        "pause"
    ).textContent=
        paused
        ? "▶"
        : "Ⅱ";

};


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key==="a"
        )
            keys.left=true;

        if(
            e.key==="ArrowRight" ||
            e.key==="d"
        )
            keys.right=true;

        if(
            e.code==="Space"
        )
            playerHit();

        if(
            e.key==="p" ||
            e.key==="P"
        ){

            if(running)
                paused=!paused;

        }

    }
);

window.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key==="a"
        )
            keys.left=false;

        if(
            e.key==="ArrowRight" ||
            e.key==="d"
        )
            keys.right=false;

    }
);


/* =====================================================
   MOBILE SWIPE
===================================================== */

let sx=0;
let sy=0;

canvas.addEventListener(
    "touchstart",
    e=>{

        sx=
            e.touches[0].clientX;

        sy=
            e.touches[0].clientY;

    },
    {passive:true}
);

canvas.addEventListener(
    "touchend",
    e=>{

        const x=
            e.changedTouches[0].clientX;

        const y=
            e.changedTouches[0].clientY;

        const dx=x-sx;
        const dy=y-sy;

        if(
            Math.abs(dx)>35
        ){

            if(dx>0)
                keys.right=true;
            else
                keys.left=true;

            setTimeout(
                ()=>{
                    keys.right=false;
                    keys.left=false;
                },
                180
            );

        }else{

            playerHit();

        }

    },
    {passive:true}
);

</script>
