<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Neon Tic Tac Toe</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:white;
    background:#020617;
}

#game{
    min-height:100vh;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 50% 20%,
        #312e81 0%,
        #111827 45%,
        #020617 100%
    );
}

/* BACKGROUND */

.bg-circle{
    position:absolute;
    border-radius:50%;
    filter:blur(3px);
    opacity:.22;
    pointer-events:none;
}

.c1{
    width:300px;
    height:300px;
    background:#06b6d4;
    top:-120px;
    left:-100px;
    animation:float1 7s infinite alternate;
}

.c2{
    width:350px;
    height:350px;
    background:#ec4899;
    right:-150px;
    bottom:-150px;
    animation:float2 8s infinite alternate;
}

@keyframes float1{
    to{
        transform:translate(80px,100px);
    }
}

@keyframes float2{
    to{
        transform:translate(-70px,-80px);
    }
}

/* MAIN */

.container{
    width:min(500px,100%);
    position:relative;
    z-index:5;
}

.title{
    text-align:center;
    margin-bottom:15px;
}

.title h1{
    font-size:clamp(32px,8vw,48px);

    background:
    linear-gradient(
        90deg,
        #22d3ee,
        #818cf8,
        #f472b6
    );

    -webkit-background-clip:text;
    color:transparent;

    animation:titleGlow 2s infinite alternate;
}

@keyframes titleGlow{
    from{
        filter:drop-shadow(0 0 3px #22d3ee);
    }
    to{
        filter:drop-shadow(0 0 15px #ec4899);
    }
}

.title p{
    color:#94a3b8;
    margin-top:5px;
}

/* SCORE */

.scoreboard{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.score-box{
    padding:12px 5px;
    text-align:center;
    border-radius:16px;

    background:#0f172acc;
    border:1px solid #ffffff16;

    backdrop-filter:blur(10px);
}

.score-box small{
    display:block;
    color:#94a3b8;
    font-size:10px;
    margin-bottom:4px;
}

.score-box strong{
    font-size:25px;
}

/* SETTINGS */

.settings{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

select,
.action-btn{
    flex:1;

    padding:12px;

    border:1px solid #ffffff18;
    border-radius:14px;

    color:white;
    background:#0f172add;

    outline:none;
    cursor:pointer;
}

select option{
    color:white;
    background:#111827;
}

/* BOARD */

.board-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1/1;

    padding:10px;

    border-radius:28px;

    background:
    linear-gradient(
        145deg,
        #ffffff12,
        #ffffff05
    );

    border:1px solid #ffffff18;

    box-shadow:
    0 25px 80px #0009,
    inset 0 0 40px #ffffff05;
}

.board{
    width:100%;
    height:100%;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);

    gap:9px;
}

.cell{
    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    border:0;
    border-radius:18px;

    background:
    linear-gradient(
        145deg,
        #172554,
        #0f172a
    );

    color:white;

    cursor:pointer;

    box-shadow:
    inset 0 0 15px #ffffff05;

    transition:
    transform .15s,
    background .2s,
    box-shadow .2s;
}

.cell:hover{
    transform:scale(.97);

    background:
    linear-gradient(
        145deg,
        #1e3a8a,
        #172554
    );
}

.cell:active{
    transform:scale(.92);
}

.cell.x{
    color:#22d3ee;

    text-shadow:
    0 0 10px #22d3ee,
    0 0 30px #22d3ee;
}

.cell.o{
    color:#f472b6;

    text-shadow:
    0 0 10px #f472b6,
    0 0 30px #f472b6;
}

.mark{
    font-size:clamp(48px,15vw,85px);
    font-weight:900;

    animation:
    markIn .3s cubic-bezier(.17,.67,.3,1.4);
}

@keyframes markIn{
    from{
        opacity:0;
        transform:scale(.2) rotate(-30deg);
    }

    to{
        opacity:1;
        transform:scale(1) rotate(0);
    }
}

/* WINNING CELL */

.cell.winner{
    animation:
    winnerPulse .65s infinite alternate;

    background:
    linear-gradient(
        145deg,
        #14532d,
        #166534
    );
}

@keyframes winnerPulse{
    from{
        box-shadow:
        inset 0 0 10px #22c55e,
        0 0 5px #22c55e;
    }

    to{
        box-shadow:
        inset 0 0 30px #22c55e,
        0 0 30px #22c55e;
    }
}

/* STATUS */

.status{
    margin-top:15px;

    padding:13px;

    text-align:center;

    border-radius:16px;

    color:#cbd5e1;

    background:#0f172acc;
    border:1px solid #ffffff12;
}

.status span{
    font-weight:bold;
    color:#22d3ee;
}

/* BUTTON */

.new-game{
    width:100%;
    margin-top:12px;

    padding:14px;

    border:0;
    border-radius:17px;

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #7c3aed,
        #db2777
    );

    background-size:200% 200%;

    box-shadow:
    0 10px 30px #4f46e555;

    animation:gradientMove 4s infinite alternate;
}

@keyframes gradientMove{
    to{
        background-position:100% 50%;
    }
}

.new-game:active{
    transform:scale(.97);
}

/* WIN MESSAGE */

.overlay{
    position:fixed;
    inset:0;

    z-index:100;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:#020617bb;

    backdrop-filter:blur(15px);

    opacity:0;
    pointer-events:none;

    transition:.3s;
}

.overlay.show{
    opacity:1;
    pointer-events:auto;
}

.result{
    width:min(390px,100%);

    text-align:center;

    padding:35px 25px;

    border-radius:30px;

    background:
    linear-gradient(
        145deg,
        #111827,
        #1e293b
    );

    border:1px solid #ffffff18;

    box-shadow:
    0 30px 100px #000b;

    transform:scale(.7);

    transition:.4s;
}

.overlay.show .result{
    transform:scale(1);
}

.result-icon{
    font-size:70px;

    animation:
    resultFloat 1.5s infinite alternate;
}

@keyframes resultFloat{
    to{
        transform:translateY(-10px) scale(1.05);
    }
}

.result h2{
    font-size:35px;
    margin:10px 0;

    background:
    linear-gradient(
        90deg,
        #22d3ee,
        #f472b6
    );

    -webkit-background-clip:text;
    color:transparent;
}

.result p{
    color:#94a3b8;
    margin-bottom:20px;
}

.result button{
    width:100%;
    padding:14px;

    border:0;
    border-radius:16px;

    background:#2563eb;

    color:white;

    font-weight:bold;
    font-size:16px;

    cursor:pointer;
}

/* MOBILE */

@media(max-width:430px){

    #game{
        padding:12px;
    }

    .title{
        margin-bottom:10px;
    }

    .title h1{
        font-size:35px;
    }

    .score-box{
        padding:8px 3px;
    }

    .score-box strong{
        font-size:21px;
    }

    .cell{
        border-radius:14px;
    }

}
</style>
</head>

<body>

<div id="game">

    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>

    <div class="container">

        <div class="title">

            <h1>⭕ TIC TAC TOE ❌</h1>

            <p>
                Neon Battle • Play Against AI
            </p>

        </div>


        <!-- SCORE -->

        <div class="scoreboard">

            <div class="score-box">

                <small>YOU ❌</small>

                <strong id="playerScore">
                    0
                </strong>

            </div>

            <div class="score-box">

                <small>DRAW 🤝</small>

                <strong id="drawScore">
                    0
                </strong>

            </div>

            <div class="score-box">

                <small>AI ⭕</small>

                <strong id="aiScore">
                    0
                </strong>

            </div>

        </div>


        <!-- SETTINGS -->

        <div class="settings">

            <select id="difficulty">

                <option value="easy">
                    🟢 Easy AI
                </option>

                <option value="medium">
                    🟡 Medium AI
                </option>

                <option value="hard">
                    🔴 Hard AI
                </option>

            </select>

            <button
            class="action-btn"
            id="soundBtn">

                🔊 Sound ON

            </button>

        </div>


        <!-- BOARD -->

        <div class="board-wrap">

            <div
            class="board"
            id="board">

            </div>

        </div>


        <!-- STATUS -->

        <div
        class="status"
        id="status">

            Your turn —
            <span>Place X</span>

        </div>


        <button
        class="new-game"
        id="newGame">

            🔄 NEW GAME

        </button>

    </div>

</div>


<!-- RESULT -->

<div
class="overlay"
id="overlay">

    <div class="result">

        <div
        class="result-icon"
        id="resultIcon">

            🏆

        </div>

        <h2 id="resultTitle">
            YOU WIN!
        </h2>

        <p id="resultText">
            Great game!
        </p>

        <button
        id="againBtn">

            🎮 PLAY AGAIN

        </button>

    </div>

</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const board =
document.getElementById("board");

const statusText =
document.getElementById("status");

const difficulty =
document.getElementById("difficulty");

const overlay =
document.getElementById("overlay");

const resultTitle =
document.getElementById("resultTitle");

const resultText =
document.getElementById("resultText");

const resultIcon =
document.getElementById("resultIcon");


/* =========================================
   GAME DATA
========================================= */

let cells =
Array(9).fill("");

let currentPlayer =
"X";

let gameActive =
true;

let soundOn =
true;

let playerScore=0;
let aiScore=0;
let drawScore=0;


/* =========================================
   WINNING PATTERNS
========================================= */

const wins=[

    [0,1,2],
    [3,4,5],
    [6,7,8],

    [0,3,6],
    [1,4,7],
    [2,5,8],

    [0,4,8],
    [2,4,6]

];


/* =========================================
   AUDIO
========================================= */

let audioCtx=null;

function audio(){

    if(!audioCtx){

        audioCtx=
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(
        audioCtx.state==="suspended"
    ){

        audioCtx.resume();

    }
}


function tone(
    frequency,
    duration,
    type="sine",
    volume=.06
){

    if(!soundOn)
        return;

    audio();

    const osc=
    audioCtx.createOscillator();

    const gain=
    audioCtx.createGain();

    osc.type=type;

    osc.frequency.value=
    frequency;

    gain.gain.setValueAtTime(
        .001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.02
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+
        duration
    );

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime+
        duration+.03
    );

}


function clickSound(){

    tone(
        650,
        .06,
        "square",
        .045
    );

}


function aiSound(){

    tone(
        400,
        .08,
        "triangle",
        .05
    );

}


function winSound(){

    tone(
        600,
        .1
    );

    setTimeout(
        ()=>tone(
            800,
            .1
        ),
        100
    );

    setTimeout(
        ()=>tone(
            1100,
            .25
        ),
        200
    );

}


function loseSound(){

    tone(
        350,
        .15
    );

    setTimeout(
        ()=>tone(
            220,
            .3
        ),
        150
    );

}


function drawSound(){

    tone(
        500,
        .1
    );

    setTimeout(
        ()=>tone(
            500,
            .1
        ),
        130
    );

}


/* =========================================
   CREATE BOARD
========================================= */

function createBoard(){

    board.innerHTML="";

    cells.forEach(
        (value,index)=>{

            const cell=
            document.createElement("button");

            cell.className=
            "cell";

            cell.dataset.index=
            index;

            cell.addEventListener(
                "click",
                playerMove
            );

            if(value){

                addMark(
                    cell,
                    value
                );

            }

            board.appendChild(cell);

        }
    );

}


/* =========================================
   ADD MARK
========================================= */

function addMark(
    cell,
    mark
){

    cell.classList.add(
        mark.toLowerCase()
    );

    const span=
    document.createElement("span");

    span.className="mark";

    span.textContent=
    mark==="X" ? "×" : "○";

    cell.appendChild(span);

}


/* =========================================
   PLAYER MOVE
========================================= */

function playerMove(e){

    if(
        !gameActive ||
        currentPlayer!=="X"
    )
        return;

    const index=
    Number(
        e.currentTarget.dataset.index
    );

    if(
        cells[index]!==""
    )
        return;

    cells[index]="X";

    clickSound();

    createBoard();

    const result=
    checkWinner(
        cells
    );

    if(result){

        finishGame(
            result
        );

        return;

    }

    currentPlayer="O";

    statusText.innerHTML=
    "AI is thinking... <span>🤖</span>";

    setTimeout(
        aiMove,
        400
    );

}


/* =========================================
   AI MOVE
========================================= */

function aiMove(){

    if(!gameActive)
        return;

    let move;

    const level=
    difficulty.value;


    if(level==="easy"){

        move=
        randomMove();

    }

    else if(level==="medium"){

        /*
          Medium:
          70% strategic,
          30% random
        */

        if(
            Math.random()<.7
        ){

            move=
            bestStrategicMove();

        }else{

            move=
            randomMove();

        }

    }

    else{

        move=
        minimaxMove();

    }


    if(
        move===undefined ||
        move===null
    ){

        move=
        randomMove();

    }


    cells[move]="O";

    aiSound();

    createBoard();


    const result=
    checkWinner(
        cells
    );

    if(result){

        finishGame(
            result
        );

        return;

    }


    currentPlayer="X";

    statusText.innerHTML=
    "Your turn — <span>Place X</span>";

}


/* =========================================
   RANDOM MOVE
========================================= */

function randomMove(){

    const empty=
    cells
    .map(
        (v,i)=>
        v==="" ? i : null
    )
    .filter(
        v=>v!==null
    );

    if(!empty.length)
        return null;

    return empty[
        Math.floor(
            Math.random()*
            empty.length
        )
    ];

}


/* =========================================
   STRATEGIC AI
========================================= */

function bestStrategicMove(){

    /* WIN */

    for(
        const pattern of wins
    ){

        const [
            a,b,c
        ]=pattern;

        const values=[
            cells[a],
            cells[b],
            cells[c]
        ];

        if(
            values.filter(
                v=>v==="O"
            ).length===2 &&
            values.includes("")
        ){

            return pattern[
                values.indexOf("")
            ];

        }

    }


    /* BLOCK PLAYER */

    for(
        const pattern of wins
    ){

        const [
            a,b,c
        ]=pattern;

        const values=[
            cells[a],
            cells[b],
            cells[c]
        ];

        if(
            values.filter(
                v=>v==="X"
            ).length===2 &&
            values.includes("")
        ){

            return pattern[
                values.indexOf("")
            ];

        }

    }


    /* CENTER */

    if(
        cells[4]===""
    ){

        return 4;

    }


    /* CORNERS */

    const corners=[
        0,2,6,8
    ];

    const freeCorners=
    corners.filter(
        i=>cells[i]===""
    );

    if(freeCorners.length){

        return freeCorners[
            Math.floor(
                Math.random()*
                freeCorners.length
            )
        ];

    }


    return randomMove();

}


/* =========================================
   HARD AI - MINIMAX
========================================= */

function minimaxMove(){

    let bestScore=
    -Infinity;

    let move;

    for(
        let i=0;
        i<9;
        i++
    ){

        if(
            cells[i]===""
        ){

            cells[i]="O";

            const score=
            minimax(
                cells,
                false
            );

            cells[i]="";

            if(
                score>bestScore
            ){

                bestScore=score;
                move=i;

            }

        }

    }

    return move;

}


function minimax(
    boardState,
    maximizing
){

    const result=
    checkWinner(
        boardState
    );


    if(result){

        if(
            result.winner==="O"
        )
            return 10;

        if(
            result.winner==="X"
        )
            return -10;

        return 0;

    }


    if(maximizing){

        let best=
        -Infinity;

        for(
            let i=0;
            i<9;
            i++
        ){

            if(
                boardState[i]===""
            ){

                boardState[i]="O";

                best=
                Math.max(
                    best,
                    minimax(
                        boardState,
                        false
                    )
                );

                boardState[i]="";

            }

        }

        return best;

    }


    let best=
    Infinity;

    for(
        let i=0;
        i<9;
        i++
    ){

        if(
            boardState[i]===""
        ){

            boardState[i]="X";

            best=
            Math.min(
                best,
                minimax(
                    boardState,
                    true
                )
            );

            boardState[i]="";

        }

    }

    return best;

}


/* =========================================
   CHECK WINNER
========================================= */

function checkWinner(
    boardState
){

    for(
        const pattern of wins
    ){

        const [
            a,b,c
        ]=pattern;

        if(
            boardState[a] &&
            boardState[a]===
            boardState[b] &&
            boardState[a]===
            boardState[c]
        ){

            return {

                winner:
                boardState[a],

                pattern:
                pattern

            };

        }

    }


    if(
        boardState.every(
            cell=>cell!==""
        )
    ){

        return {

            winner:"draw",

            pattern:[]

        };

    }


    return null;

}


/* =========================================
   FINISH GAME
========================================= */

function finishGame(
    result
){

    gameActive=false;

    currentPlayer=null;


    if(
        result.winner==="X"
    ){

        playerScore++;

        winSound();

        showResult(
            "🏆",
            "YOU WIN!",
            "Amazing! You defeated the AI."
        );

    }

    else if(
        result.winner==="O"
    ){

        aiScore++;

        loseSound();

        showResult(
            "🤖",
            "AI WINS!",
            "The AI got you this time."
        );

    }

    else{

        drawScore++;

        drawSound();

        showResult(
            "🤝",
            "DRAW!",
            "Nobody won this round."
        );

    }


    updateScore();


    /* Winning animation */

    if(
        result.pattern
    ){

        result.pattern.forEach(
            index=>{

                const cell=
                board.children[index];

                if(cell){

                    cell.classList.add(
                        "winner"
                    );

                }

            }
        );

    }

}


/* =========================================
   RESULT
========================================= */

function showResult(
    icon,
    title,
    text
){

    resultIcon.textContent=
    icon;

    resultTitle.textContent=
    title;

    resultText.textContent=
    text;

    setTimeout(
        ()=>{
            overlay.classList.add(
                "show"
            );
        },
        500
    );

}


/* =========================================
   NEW GAME
========================================= */

function newGame(){

    cells=
    Array(9).fill("");

    currentPlayer="X";

    gameActive=true;

    overlay.classList.remove(
        "show"
    );

    statusText.innerHTML=
    "Your turn — <span>Place X</span>";

    createBoard();

}


/* =========================================
   SCORE
========================================= */

function updateScore(){

    document.getElementById(
        "playerScore"
    ).textContent=
    playerScore;

    document.getElementById(
        "aiScore"
    ).textContent=
    aiScore;

    document.getElementById(
        "drawScore"
    ).textContent=
    drawScore;

}


/* =========================================
   SOUND BUTTON
========================================= */

document.getElementById(
    "soundBtn"
).addEventListener(
    "click",
    function(){

        soundOn=!soundOn;

        this.textContent=
        soundOn
        ? "🔊 Sound ON"
        : "🔇 Sound OFF";

        if(soundOn){

            tone(
                700,
                .08
            );

        }

    }
);


/* =========================================
   BUTTONS
========================================= */

document.getElementById(
    "newGame"
).addEventListener(
    "click",
    newGame
);

document.getElementById(
    "againBtn"
).addEventListener(
    "click",
    newGame
);


/* =========================================
   DIFFICULTY CHANGE
========================================= */

difficulty.addEventListener(
    "change",
    function(){

        newGame();

    }
);


/* =========================================
   START
========================================= */

createBoard();

updateScore();

</script>

</body>
</html>
