<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Golf Challenge ⛳</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#31577b,#07101a 75%);
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow-x:hidden;
    touch-action:manipulation;
}

h1{
    padding-top:8px;
    font-size:clamp(24px,7vw,36px);
    text-shadow:0 3px 8px #000;
}

.subtitle{
    font-size:12px;
    color:#c6eaff;
    margin:3px 0 7px;
}

/* SCORE */

.scoreboard{
    width:94%;
    max-width:720px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
}

.box{
    background:
        linear-gradient(145deg,#193d58,#07131e);
    border:1px solid #ffffff25;
    border-radius:13px;
    padding:7px 2px;
    box-shadow:0 5px 14px #0008;
}

.box small{
    display:block;
    color:#9db5c7;
    font-size:10px;
}

.box strong{
    font-size:19px;
}

/* COURSE */

.course{
    position:relative;
    width:94%;
    max-width:760px;
    height:min(60vh,500px);
    min-height:350px;
    margin:9px auto;
    overflow:hidden;
    border:3px solid #ffffff40;
    border-radius:22px;

    background:
        linear-gradient(
            to bottom,
            #79d4f4 0 38%,
            #55ad42 38% 100%
        );

    box-shadow:0 16px 40px #000b;
}

/* SKY */

.sun{
    position:absolute;
    width:62px;
    height:62px;
    right:8%;
    top:7%;
    border-radius:50%;
    background:#ffe879;
    box-shadow:0 0 35px #fff3a5;
}

.cloud{
    position:absolute;
    width:95px;
    height:23px;
    background:white;
    opacity:.82;
    border-radius:30px;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:40px;
    height:40px;
    left:15px;
    top:-20px;
}

.cloud:after{
    width:45px;
    height:45px;
    right:10px;
    top:-23px;
}

.cloud1{
    left:8%;
    top:14%;
}

.cloud2{
    right:27%;
    top:22%;
    transform:scale(.7);
}

/* TREES */

.tree{
    position:absolute;
    z-index:2;
}

.tree .trunk{
    width:15px;
    height:55px;
    background:#6b401e;
    margin:auto;
}

.tree .leaves{
    width:72px;
    height:72px;
    background:
        radial-gradient(circle,#267a32 25%,#155722 70%);
    border-radius:50%;
    box-shadow:
        15px 12px 0 #1d6828,
        -15px 15px 0 #237630;
}

.tree1{
    left:3%;
    top:32%;
    transform:scale(.8);
}

.tree2{
    right:3%;
    top:35%;
    transform:scale(.9);
}

.tree3{
    left:16%;
    top:45%;
    transform:scale(.55);
}

/* COURSE GRASS */

.grass{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:63%;

    background:
        repeating-linear-gradient(
            90deg,
            #3e9d38 0 55px,
            #48a940 55px 110px
        );
}

/* FAIRWAY */

.fairway{
    position:absolute;

    width:58%;
    height:76%;

    left:21%;
    bottom:-5%;

    background:
        linear-gradient(
            90deg,
            #62b64c,
            #79c65b,
            #62b64c
        );

    clip-path:
        polygon(
            39% 0,
            61% 0,
            88% 100%,
            12% 100%
        );

    opacity:.95;
}

/* SAND */

.sand{
    position:absolute;
    width:125px;
    height:55px;
    background:#e6ca83;
    border-radius:50%;
    box-shadow:inset 0 5px 15px #9e8044;
}

.sand1{
    left:7%;
    bottom:19%;
}

.sand2{
    right:7%;
    bottom:31%;
    transform:rotate(-15deg);
}

/* GREEN */

.green{
    position:absolute;
    width:210px;
    height:100px;
    left:calc(50% - 105px);
    top:13%;

    background:
        radial-gradient(
            ellipse,
            #83cf63,
            #54a941
        );

    border-radius:50%;
    box-shadow:
        inset 0 0 20px #347b2d;
}

/* HOLE */

.hole{
    position:absolute;

    width:28px;
    height:12px;

    left:calc(50% - 14px);
    top:30%;

    background:#151515;
    border-radius:50%;

    z-index:5;

    box-shadow:
        0 3px 4px #0008;
}

/* FLAG */

.flag{
    position:absolute;

    width:5px;
    height:92px;

    left:calc(50% + 3px);
    top:7%;

    background:#eee;

    z-index:6;
}

.flag:after{
    content:"";

    position:absolute;

    top:0;
    left:4px;

    width:55px;
    height:30px;

    background:
        linear-gradient(
            135deg,
            #e92323 50%,
            transparent 51%
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            72% 100%,
            0 100%
        );
}

/* AIM LINE */

.aim{
    position:absolute;

    width:4px;
    height:115px;

    left:calc(50% - 2px);
    bottom:25%;

    background:
        repeating-linear-gradient(
            to bottom,
            #fff 0 8px,
            transparent 8px 15px
        );

    transform-origin:bottom;
    z-index:8;
    opacity:.8;
}

/* BALL */

.ball{
    position:absolute;

    width:17px;
    height:17px;

    left:calc(50% - 8px);
    bottom:22%;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            white,
            #cfd3d5
        );

    border:1px solid #777;

    z-index:20;

    box-shadow:0 3px 7px #0008;

    transition:
        left .8s cubic-bezier(.15,.8,.2,1),
        bottom .8s cubic-bezier(.15,.8,.2,1),
        transform .8s ease;
}

/* GOLFER */

.golfer{
    position:absolute;

    width:105px;
    height:165px;

    left:calc(50% - 53px);
    bottom:4%;

    z-index:15;

    transform-origin:bottom center;

    transition:
        transform .18s ease;
}

/* HEAD */

.head{
    position:absolute;

    width:36px;
    height:36px;

    left:34px;
    top:0;

    border-radius:50%;

    background:#b9784f;

    border:2px solid #663d2b;
}

/* HAIR */

.hair{
    position:absolute;

    width:38px;
    height:17px;

    left:33px;
    top:-5px;

    background:#202020;

    border-radius:
        20px 20px 6px 6px;
}

/* BODY */

.body{
    position:absolute;

    width:47px;
    height:62px;

    left:29px;
    top:36px;

    background:
        linear-gradient(
            90deg,
            #164e91,
            #2779ca,
            #103d75
        );

    border:2px solid #092e5e;

    border-radius:11px;
}

/* SHIRT */

.shirtNumber{
    position:absolute;

    top:52px;
    left:47px;

    font-weight:bold;
    color:white;
}

/* ARMS */

.arm{
    position:absolute;

    width:52px;
    height:10px;

    top:48px;

    background:#b9784f;

    border-radius:10px;

    transform-origin:center;

    transition:
        transform .18s ease;
}

.armLeft{
    left:-5px;
    transform:rotate(35deg);
}

.armRight{
    right:-5px;
    transform:rotate(-35deg);
}

/* LEGS */

.leg{
    position:absolute;

    width:14px;
    height:65px;

    top:94px;

    background:#202733;

    border-radius:8px;

    transform-origin:top center;

    transition:
        transform .18s ease;
}

.legLeft{
    left:35px;
    transform:rotate(8deg);
}

.legRight{
    left:58px;
    transform:rotate(-8deg);
}

/* SHOES */

.shoe{
    position:absolute;

    width:30px;
    height:12px;

    background:#111;

    border-radius:10px;

    top:151px;
}

.shoeLeft{
    left:20px;
}

.shoeRight{
    left:56px;
}

/* CLUB */

.club{
    position:absolute;

    width:7px;
    height:105px;

    left:72px;
    top:50px;

    background:
        linear-gradient(
            90deg,
            #555,
            #ddd,
            #444
        );

    border-radius:4px;

    transform-origin:
        top center;

    transform:rotate(-35deg);

    transition:
        transform .18s
        cubic-bezier(.2,.8,.2,1);

    z-index:5;
}

.club:after{
    content:"";

    position:absolute;

    width:25px;
    height:10px;

    left:-9px;
    bottom:-5px;

    background:#555;

    border-radius:5px;
}

/* SWING */

.golfer.swing{
    transform:
        rotate(5deg)
        translateX(4px);
}

.golfer.swing .club{
    transform:
        rotate(75deg);
}

.golfer.swing .armLeft{
    transform:
        rotate(65deg);
}

.golfer.swing .armRight{
    transform:
        rotate(-70deg);
}

.golfer.swing .legRight{
    transform:
        rotate(-18deg);
}

/* CONTROLS */

.message{
    width:94%;
    max-width:720px;
    min-height:25px;
    margin:5px auto;

    font-size:
        clamp(15px,4vw,20px);

    font-weight:bold;

    text-shadow:0 2px 6px #000;
}

.controls{
    width:94%;
    max-width:720px;
    margin:auto;
}

.powerLabel{
    text-align:left;
    color:#b7c9d7;
    font-size:11px;
    margin-bottom:3px;
}

.powerBar{
    height:15px;
    width:100%;

    background:#101820;

    border:1px solid white;

    border-radius:20px;

    overflow:hidden;
}

.power{
    width:50%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #00d66b,
            #ffe000,
            #ff2020
        );
}

.buttons{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:7px;

    margin-top:8px;
}

button{
    border:0;

    min-height:49px;

    border-radius:14px;

    color:white;

    font-weight:bold;

    font-size:
        clamp(11px,3.5vw,16px);

    background:
        linear-gradient(
            145deg,
            #087dff,
            #0048a8
        );

    box-shadow:
        0 5px 0 #002d68,
        0 7px 14px #0008;

    touch-action:manipulation;
}

button:active{
    transform:translateY(4px);

    box-shadow:
        0 1px 0 #002d68;
}

button:disabled{
    opacity:.45;
}

.restart{
    display:none;

    width:100%;

    margin-top:8px;

    background:
        linear-gradient(
            145deg,
            #00ddff,
            #0076ff
        );
}

/* MOBILE */

@media(max-width:600px){

    .course{
        height:51vh;
        min-height:320px;
        border-radius:18px;
    }

    .golfer{
        transform:scale(.8);
        transform-origin:bottom center;
    }

    .green{
        width:180px;
        left:calc(50% - 90px);
    }

    .buttons{
        gap:5px;
    }
}

@media(max-height:700px){

    .course{
        height:45vh;
        min-height:285px;
    }

    .golfer{
        transform:scale(.65);
    }

    .message{
        font-size:14px;
    }

    button{
        min-height:43px;
    }
}
</style>
</head>

<body>

<h1>⛳ GOLF CHALLENGE</h1>

<div class="subtitle">
    Aim • Power • Swing • Hole!
</div>

<!-- SCORE -->

<div class="scoreboard">

    <div class="box">
        <small>HOLE</small>
        <strong id="hole">1/5</strong>
    </div>

    <div class="box">
        <small>STROKES</small>
        <strong id="strokes">0</strong>
    </div>

    <div class="box">
        <small>PAR</small>
        <strong>3</strong>
    </div>

    <div class="box">
        <small>SCORE</small>
        <strong id="score">E</strong>
    </div>

</div>

<!-- COURSE -->

<div class="course">

    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <!-- TREES -->

    <div class="tree tree1">
        <div class="leaves"></div>
        <div class="trunk"></div>
    </div>

    <div class="tree tree2">
        <div class="leaves"></div>
        <div class="trunk"></div>
    </div>

    <div class="tree tree3">
        <div class="leaves"></div>
        <div class="trunk"></div>
    </div>

    <!-- FIELD -->

    <div class="grass"></div>

    <div class="fairway"></div>

    <div class="sand sand1"></div>
    <div class="sand sand2"></div>

    <!-- GREEN -->

    <div class="green"></div>

    <!-- HOLE -->

    <div class="hole"></div>

    <div class="flag"></div>

    <!-- AIM -->

    <div
        class="aim"
        id="aim">
    </div>

    <!-- BALL -->

    <div
        class="ball"
        id="ball">
    </div>

    <!-- GOLFER -->

    <div
        class="golfer"
        id="golfer">

        <div class="head"></div>

        <div class="hair"></div>

        <div class="body"></div>

        <div class="shirtNumber">
            7
        </div>

        <div
            class="arm armLeft">
        </div>

        <div
            class="arm armRight">
        </div>

        <div
            class="leg legLeft">
        </div>

        <div
            class="leg legRight">
        </div>

        <div
            class="shoe shoeLeft">
        </div>

        <div
            class="shoe shoeRight">
        </div>

        <div class="club"></div>

    </div>

</div>

<!-- MESSAGE -->

<div
    class="message"
    id="message">

    Choose your aim and power! ⛳

</div>

<!-- CONTROLS -->

<div class="controls">

    <div class="powerLabel">
        POWER
    </div>

    <div class="powerBar">

        <div
            class="power"
            id="power">
        </div>

    </div>

    <div class="buttons">

        <button onclick="aimLeft()">
            ⬅️ AIM
        </button>

        <button onclick="hitBall()">
            🏌️ SWING
        </button>

        <button onclick="aimRight()">
            AIM ➡️
        </button>

        <button onclick="changeClub()">
            🏏 CLUB
        </button>

    </div>

    <button
        class="restart"
        id="restart"
        onclick="restartGame()">

        🔄 NEW GAME

    </button>

</div>

<script>

/* =================================
   VARIABLES
================================= */

let hole = 1;

let strokes = 0;

let totalScore = 0;

let angle = 0;

let powerValue = 30;

let powerDirection = 1;

let playing = true;

let club = "Driver";

/* =================================
   ELEMENTS
================================= */

const ball =
    document.getElementById("ball");

const golfer =
    document.getElementById("golfer");

const aim =
    document.getElementById("aim");

const power =
    document.getElementById("power");

const message =
    document.getElementById("message");

const strokesText =
    document.getElementById("strokes");

const holeText =
    document.getElementById("hole");

const scoreText =
    document.getElementById("score");

const restart =
    document.getElementById("restart");

/* =================================
   POWER ANIMATION
================================= */

setInterval(function(){

    if(!playing)
        return;

    powerValue +=
        powerDirection * 2;

    if(powerValue >= 100){

        powerValue = 100;

        powerDirection = -1;
    }

    if(powerValue <= 20){

        powerValue = 20;

        powerDirection = 1;
    }

    power.style.width =
        powerValue + "%";

},40);

/* =================================
   AIM LEFT
================================= */

function aimLeft(){

    if(!playing)
        return;

    angle -= 8;

    if(angle < -35)
        angle = -35;

    aim.style.transform =
        "rotate("+angle+"deg)";

    message.textContent =
        "🎯 Aim: " +
        angle +
        "°";
}

/* =================================
   AIM RIGHT
================================= */

function aimRight(){

    if(!playing)
        return;

    angle += 8;

    if(angle > 35)
        angle = 35;

    aim.style.transform =
        "rotate("+angle+"deg)";

    message.textContent =
        "🎯 Aim: " +
        angle +
        "°";
}

/* =================================
   CLUB
================================= */

function changeClub(){

    if(club === "Driver"){

        club = "Iron";

    }
    else if(club === "Iron"){

        club = "Wedge";

    }
    else{

        club = "Driver";

    }

    message.textContent =
        "🏌️ Club: " +
        club;
}

/* =================================
   HIT BALL
================================= */

function hitBall(){

    if(!playing)
        return;

    playing = false;

    strokes++;

    strokesText.textContent =
        strokes;

    golfer.classList.add(
        "swing"
    );

    message.textContent =
        "🏌️ SWING! 💥";

    /*
       Distance based on power
    */

    let distance =
        20 +
        powerValue * 0.65;

    if(club === "Driver")
        distance += 15;

    if(club === "Wedge")
        distance -= 20;

    /*
       Aim changes ball direction
    */

    let horizontal =
        50 + angle * 0.8;

    if(horizontal < 5)
        horizontal = 5;

    if(horizontal > 95)
        horizontal = 95;

    /*
       Ball animation
    */

    setTimeout(function(){

        ball.style.left =
            horizontal + "%";

        ball.style.bottom =
            Math.min(
                88,
                22 + distance * .55
            ) + "%";

        ball.style.transform =
            "scale(.55) rotate(1000deg)";

    },180);

    /*
       Result
    */

    setTimeout(function(){

        checkResult(
            horizontal,
            distance
        );

    },950);
}

/* =================================
   RESULT
================================= */

function checkResult(
    horizontal,
    distance
){

    golfer.classList.remove(
        "swing"
    );

    /*
       Good accuracy
    */

    const accuracy =
        Math.abs(
            horizontal - 50
        );

    /*
       Hole
    */

    if(
        accuracy < 5 &&
        distance > 60
    ){

        message.textContent =
            "🏆 HOLE! Amazing shot! ⛳";

        totalScore +=
            strokes;

        nextHole();

        return;
    }

    /*
       Too short
    */

    if(distance < 45){

        message.textContent =
            "😅 Too short!";

    }

    /*
       Too far
    */

    else if(distance > 90){

        message.textContent =
            "💨 Too far!";

    }

    /*
       Wide
    */

    else if(accuracy > 25){

        message.textContent =
            "🌳 Ball went wide!";

    }

    else{

        message.textContent =
            "🏌️ Ball landed safely.";

    }

    /*
       Prepare next stroke
    */

    setTimeout(function(){

        resetBall();

        playing = true;

        message.textContent =
            "Take your next shot! ⛳";

    },1200);
}

/* =================================
   NEXT HOLE
================================= */

function nextHole(){

    setTimeout(function(){

        if(hole >= 5){

            finishGame();

            return;
        }

        hole++;

        holeText.textContent =
            hole + "/5";

        strokes = 0;

        strokesText.textContent =
            "0";

        angle = 0;

        aim.style.transform =
            "rotate(0deg)";

        resetBall();

        playing = true;

        message.textContent =
            "⛳ Hole " +
            hole +
            " — good luck!";

    },1300);
}

/* =================================
   RESET BALL
================================= */

function resetBall(){

    ball.style.left =
        "calc(50% - 8px)";

    ball.style.bottom =
        "22%";

    ball.style.transform =
        "scale(1) rotate(0deg)";
}

/* =================================
   FINISH
================================= */

function finishGame(){

    playing = false;

    message.textContent =
        "🏆 COURSE COMPLETE! " +
        totalScore +
        " total strokes!";

    restart.style.display =
        "block";
}

/* =================================
   RESTART
================================= */

function restartGame(){

    hole = 1;

    strokes = 0;

    totalScore = 0;

    angle = 0;

    powerValue = 30;

    playing = true;

    holeText.textContent =
        "1/5";

    strokesText.textContent =
        "0";

    scoreText.textContent =
        "E";

    aim.style.transform =
        "rotate(0deg)";

    resetBall();

    restart.style.display =
        "none";

    message.textContent =
        "Choose your aim and power! ⛳";
}

</script>

</body>
</html>
