<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dark Tales | Horror Story Library</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#171717;
    color:#222;
    font-family:Georgia,"Noto Serif Devanagari",serif;
}

/* ================= HEADER ================= */

header{
    background:
    radial-gradient(circle,#54152d,#190b12 55%,#050505);
    color:white;
    text-align:center;
    padding:65px 20px;
}

header h1{
    font-size:clamp(38px,7vw,70px);
    text-shadow:0 0 25px #ff174f;
}

header p{
    margin-top:15px;
    color:#ddd;
    font-family:Arial,sans-serif;
}

/* ================= LIBRARY ================= */

.library{
    width:min(1100px,94%);
    margin:35px auto;
}

.search{
    width:100%;
    padding:16px;
    border-radius:12px;
    border:1px solid #444;
    font-size:16px;
    margin-bottom:30px;
}

/* ================= BOOKS ================= */

.books{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
}

.book{
    background:#222;
    color:#eee;
    padding:25px;
    border-radius:15px;
    border:1px solid #3c3c3c;
    cursor:pointer;
    transition:.3s;
}

.book:hover{
    transform:translateY(-7px);
    border-color:#a81749;
    box-shadow:0 15px 35px #000;
}

.bookIcon{
    font-size:50px;
    margin-bottom:15px;
}

.book h2{
    margin-bottom:10px;
}

.book p{
    color:#aaa;
    line-height:1.6;
}

.book button{
    margin-top:18px;
    padding:11px 18px;
    background:#86123d;
    color:white;
    border:0;
    border-radius:8px;
}

/* ================= READING MODE ================= */

.reader{
    display:none;
    min-height:100vh;
    background:#777;
    padding:30px 10px;
}

/* PDF PAPER */

.paper{
    max-width:850px;
    margin:auto;

    background:#fffdf7;

    padding:
    clamp(25px,6vw,75px);

    box-shadow:
    0 10px 40px rgba(0,0,0,.6);

    min-height:1100px;
}

/* book title */

.paper h1{
    text-align:center;
    font-size:
    clamp(30px,6vw,48px);

    color:#3a0c1d;

    margin-bottom:15px;
}

.author{
    text-align:center;
    color:#777;
    margin-bottom:45px;
}

/* story */

.story{
    font-size:18px;
    line-height:2.15;
    text-align:justify;
}

.story p{
    margin-bottom:24px;
    text-indent:35px;
}

.story .chapter{
    text-align:center;
    font-size:27px;
    color:#5c102b;
    margin:50px 0 25px;
    text-indent:0;
}

/* buttons */

.topControls{
    max-width:850px;
    margin:0 auto 20px;
    display:flex;
    gap:10px;
}

.topControls button{
    padding:12px 18px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    background:#21151b;
    color:white;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .reader{
        padding:10px 0;
    }

    .paper{
        padding:25px 20px;
    }

    .story{
        font-size:16px;
        line-height:1.9;
    }

    .story p{
        text-indent:20px;
    }

}
</style>
</head>

/* =====================================================
   SHOW BOOKS
===================================================== */

const booksBox =
document.getElementById("books");

function showBooks(list){

    booksBox.innerHTML="";

    if(list.length===0){

        booksBox.innerHTML=`
        <div style="
        color:white;
        text-align:center;
        padding:50px;
        ">
        <h2>😔 कथा भेटिएन</h2>
        </div>`;

        return;
    }

    list.forEach(book=>{

        const card =
        document.createElement("div");

        card.className="book";

        card.innerHTML=`

        <div class="bookIcon">
            ${book.icon}
        </div>

        <h2>
            ${book.title}
        </h2>

        <p>
            ${book.description}
        </p>

        <button>
            📖 पुस्तक खोल्नुहोस्
        </button>

        `;

        card.onclick=()=>{
            openBook(book);
        };

        booksBox.appendChild(card);

    });
}


/* =====================================================
   OPEN BOOK
===================================================== */

function openBook(book){

    document.getElementById("library")
    .style.display="none";

    document.getElementById("reader")
    .style.display="block";

    document.getElementById("title")
    .textContent=
    book.icon+" "+book.title;

    document.getElementById("story")
    .innerHTML=
    book.text;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================================
   CLOSE BOOK
===================================================== */

document.getElementById("back")
.onclick=()=>{

    document.getElementById("reader")
    .style.display="none";

    document.getElementById("library")
    .style.display="block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
};


/* =====================================================
   SEARCH
===================================================== */

document.getElementById("search")
.addEventListener("input",function(){

    const keyword=
    this.value
    .trim()
    .toLowerCase();

    const result=
    stories.filter(book=>
        book.title
        .toLowerCase()
        .includes(keyword)
        ||
        book.description
        .toLowerCase()
        .includes(keyword)
    );

    showBooks(result);
});


/* START */

showBooks(stories);

</script>
